<!-- ===================================================================
     POSTER ROUTING -- runs before anything else in the page.

     Rewrites the src of every <img>, now and as the grid renders more, to
     load through this domain via this site's own /img proxy instead of straight
     from the image host.

     Two reasons, in order of how much they matter:

     1. Networks that filter on hostname (a work network, some ISPs) block
        images2.vudu.com outright, and the fallback proxies the pages walk
        through -- cdn.statically.io, i0.wp.com, wsrv.nl -- are separate
        hostnames that can be blocked just as easily. Routed through here
        the browser only ever connects to this site, so there is nothing
        for a host-based filter to match. (Confirmed working on a network
        that was blocking Vudu.)

     2. Resizing: this USED to also re-encode, when the proxy was Netlify's
        Image CDN -- a poster arrived as ~10KB of webp instead of ~40KB of
        source jpeg. On Cloudflare Pages there is no image-processing step,
        so the &w= and &fm= below are sent and ignored, and posters arrive
        at their original size and format. See README.md "Posters".

     The host allowlist lives in functions/img.js -- a URL whose host is not
     on that list is refused, so add the host there before pointing anything
     new at it. (It used to be [images] remote_images in netlify.toml, which
     Cloudflare does not read.)
     =================================================================== -->
<script>
(function () {
  var PROXY  = "/img";
  var WIDTH  = 300;      // poster cards render ~150px wide; 300 covers retina
  var FORMAT = "webp";   // smaller than the source jpg

  function proxied(u) {
    if (!u) return u;
    u = String(u).trim();
    if (!/^(https?:)?\/\//i.test(u)) return u;              // relative -> leave alone
    if (u.indexOf(PROXY + "?url=") === 0) return u;         // already proxied
    if (u.indexOf("//" + location.host) !== -1) return u;   // same-site -> leave alone
    if (u.slice(0, 2) === "//") u = "https:" + u;
    else if (u.slice(0, 5).toLowerCase() === "http:") u = "https:" + u.slice(5);
    return PROXY + "?url=" + encodeURIComponent(u) + "&w=" + WIDTH + "&fm=" + FORMAT;
  }

  function fix(el) {
    if (!el || el.tagName !== "IMG") return;
    var src = el.getAttribute("src");
    var next = proxied(src);
    if (next && next !== src) el.setAttribute("src", next);
  }

  function scan(root) {
    if (!root || root.nodeType !== 1) return;
    fix(root);
    if (root.querySelectorAll) {
      var imgs = root.querySelectorAll("img");
      for (var i = 0; i < imgs.length; i++) fix(imgs[i]);
    }
  }

  new MutationObserver(function (mutations) {
    for (var i = 0; i < mutations.length; i++) {
      var m = mutations[i];
      if (m.type === "attributes") fix(m.target);
      else for (var j = 0; j < m.addedNodes.length; j++) scan(m.addedNodes[j]);
    }
  }).observe(document.documentElement, {
    childList: true, subtree: true, attributes: true, attributeFilter: ["src"]
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { scan(document.body); });
  } else {
    scan(document.body);
  }
})();
</script>
<script>
/* ============ EDGE SHEET CACHE (functions/sheet.js) ============
   Shared by every page. Same block in each file -- keep them in step.

   Google takes 0.5-14s to answer a sheet request and forbids CDNs from keeping
   a copy, which is why every page used to show its cached grid and then sit
   on "Checking for changes..." for several seconds. /sheet keeps that copy at
   Cloudflare's edge instead.

     __edge.fast(url)     -> the edge's copy, however old, in ~50ms
     __edge.confirm(url)  -> a copy no older than FRESH_S, waiting on Google
                             only if the edge has nothing that recent
     __edge.isOld(r)      -> true when a fast answer still needs confirming

   Each resolves to {res, age, how}: `res` is the fetch Response (body unread,
   so callers can stream it), `age` its age in seconds, `how` where it came
   from. The pages paint the fast answer straight away and run the confirm
   pass silently behind it, so the data is still live -- it just no longer
   holds anything up.

   If /sheet is missing (local preview, a host without Functions) or fails,
   this goes straight to Google exactly as the pages always did. */
(function(){
  var FRESH_S=60;
  var off=false;
  function opts(signal){ var o={credentials:'omit'}; if(signal) o.signal=signal; return o; }
  function direct(url, signal){
    return fetch(url,opts(signal)).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return {res:r, age:0, how:'DIRECT'};
    });
  }
  function viaEdge(url, fresh, signal){
    if(off) return direct(url, signal);
    var u='/sheet?u='+encodeURIComponent(url)+(fresh==null?'':'&fresh='+fresh);
    return fetch(u,opts(signal)).then(function(r){
      var how=r.headers.get('X-Sheet-Cache');
      /* No header means this was not the function answering (a 404 page, a
         static server) -- stop asking it for the rest of this visit. */
      if(!how){ off=true; return direct(url, signal); }
      if(!r.ok) throw new Error('sheet HTTP '+r.status);
      return {res:r, age:+(r.headers.get('X-Sheet-Age')||0), how:how};
    }).catch(function(e){
      if(off || (e && e.name==='AbortError')) throw e;
      try{ console.warn('[edge] /sheet unavailable, using Google directly:', (e&&e.message)||e); }catch(x){}
      return direct(url, signal);
    });
  }
  window.__edge={
    FRESH_S:FRESH_S,
    fast:function(url,signal){ return viaEdge(url,null,signal); },
    confirm:function(url,maxAge,signal){ return viaEdge(url, maxAge==null?FRESH_S:maxAge, signal); },
    isOld:function(r){ return !!r && (r.age>FRESH_S || r.how==='ERROR-STALE'); },
    text:function(p){ return p.then(function(r){ return r.res.text().then(function(t){ r.text=t; return r; }); }); }
  };
})();
</script>

  animation:ddpulse 1.5s ease-in-out infinite}

  .spin,.skel{animation:none}

<script>
/* ============ EARLY DATA LOADER ============
   Starts BOTH sheet downloads before the CSS, the fonts and the main script are
   even parsed -- the deploy-time mirror and the live sheet, side by side.
   WHY THE PAGE FELT SLOW
   The data here is tiny -- about 11KB gzipped for ~130 titles -- so the wait
   was never really the download. Three other things caused it:
   1. #status was a full-page cover (position:absolute; inset:0 with a solid
      background) sitting on top of everything until the rows landed. The
      sidebar, the pager and the grid all existed the whole time; nobody could
      see them. It is now a small chip at the top with a progress bar.
   2. The "Need to Add" tab is a FILTER spill, so its used range runs far past
      the last real title. A plain gviz request hands back every one of those
      blank rows. The request now asks Google to drop them first:
          select * where F is not null and F <> ''
      F is the Title column. `select *` (rather than naming columns) is
      deliberate -- the page reads cells BY POSITION, so pruning columns would
      shift every index and break the whole thing.
   3. The live request used to wait its turn: this block fetched only the
      mirror, and the gviz request was not sent until the main script had
      painted that mirror -- so Google's 0.5-14s TTFB was paid strictly AFTER
      the mirror's, on every visit, cache or no cache. Both now leave here at
      once, and the live one goes through the edge cache (__edge.fast, defined
      just above), which normally answers in ~50ms from Cloudflare's copy.
      The main script races the two for the first paint when it has no local
      cache, and settles on the live answer either way.
   If the filtered query is ever rejected, it retries unfiltered, so a schema
   change can't take the page down.                                          */
(function(){
  var id='1iCuGBc7f0J_Dddshqf2Ho86ypPh2b1QIMkQOsB3fSrI';
  var gid='1970076351';
  // The "Need to Add" tab has ONE header row (row 1); the FILTER in B2 spills
  // the movies starting at row 2. So only 1 row is a header -- using 2 here
  // silently drops the first movie. If you ever add a banner row above the
  // header, bump this back to 2 to match.
  var headers=1;
  /* The deploy-time mirror of the "Need to Add" tab. Used ONLY to put
     something on screen on a first visit (and as the very last fallback when
     every live route has failed) -- see "THE LIVE SHEET, always" below. */
  var CSV_URL = '/mirror/ma-compare.csv';
/* Was the published Google CSV below. That endpoint answers
   "Cache-Control: private, max-age=300" and is regenerated per request, so no
   CDN could hold it and every visit paid for the whole file again. The mirror
   is the same bytes, rebuilt at deploy time and served by Cloudflare with Brotli
   and a real revalidate. If it is ever missing, this page still falls back to
   the live sheet on its own, exactly as it did before.
   Original: https://docs.google.com/spreadsheets/d/e/2PACX-1vRqFCFR3Ip1QuEdDACRkq4V-QyHQdqfywoen6DY_WOFdCjvm4YaoO77aQhY2yYIQRpjsgIXY2jvBRua/pub?gid=1970076351&single=true&output=csv */
  var TITLE_COL='F';                       // column holding Title (see COL.title = 5)
  var base='https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?headers='+headers+'&gid='+gid;
  var rowFilter='&tq='+encodeURIComponent("select * where "+TITLE_COL+" is not null and "+TITLE_COL+" <> ''");
  /* ---- progress hub: the indicator subscribes later and replays the last ---- */
  var subs=[], last=null;
  window.__MA_PROG=function(cb){ subs.push(cb); if(last){ try{cb(last);}catch(e){} } };
  function emit(o){ last=o; for(var i=0;i<subs.length;i++){ try{subs[i](o);}catch(e){} } }
  emit({stage:'connect'});
  try{ window.__MA_EXP = +(localStorage.getItem('ma_bytes')||0) || 0; }catch(e){ window.__MA_EXP = 0; }
  /* Reads a response as a stream so the bar shows real bytes rather than a
     guess, then hands back the full text. Only the LIVE request reports
     progress: with two downloads in flight at once, summing them into one bar
     would make it jump about, and the live one is what the page settles on. */
  function readWithProgress(res){
    if(!res.body || !res.body.getReader) return res.text();
    var reader=res.body.getReader(), dec=new TextDecoder('utf-8'), out='', bytes=0;
    return (function pump(){
      return reader.read().then(function(r){
        if(r.done){
          out+=dec.decode();
          try{ localStorage.setItem('ma_bytes', String(bytes)); }catch(e){}
          return out;
        }
        bytes+=r.value.byteLength;
        out+=dec.decode(r.value,{stream:true});
        emit({stage:'download', bytes:bytes, total:window.__MA_EXP});
        return pump();
      });
    })();
  }
  /* One live attempt through the edge. Resolves to {text, age, how, url}: the
     edge's age/how travel with the text so the main script can decide whether
     a silent confirm pass is owed (__edge.isOld), and `url` so that pass asks
     for exactly the query that was painted.
     gviz reports a rejected query with HTTP 200 and status:"error" in the
     body, so that is checked here too -- otherwise the unfiltered retry below
     would never fire. The marker sits in the first ~100 bytes. */
  function live(url){
    return window.__edge.fast(url).then(function(r){
      return readWithProgress(r.res).then(function(t){
        if(/"status"\s*:\s*"error"/.test(t.slice(0,800))) throw new Error('sheet rejected the query');
        return {text:t, age:r.age, how:r.how, url:url};
      });
    });
  }
  var early=null, liveP=null;
  try{
    // The mirror: a single static file, no row filter, no retry ladder.
    if(CSV_URL){
      early=fetch(CSV_URL).then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status);
        return r.text();
      });
      early.catch(function(){});
    }
  }catch(e){}
  try{
    // The live sheet, in parallel. Filtered first; if Google rejects the
    // query, fall back to the plain tab (still through the edge).
    if(window.__edge){
      liveP=live(base+rowFilter+'&tqx=out:json').catch(function(e){
        if(e && e.name==='AbortError') throw e;
        emit({stage:'retry'});
        return live(base+'&tqx=out:json');
      });
      liveP.catch(function(){});   // swallow here; handled properly later
    }
  }catch(e){}
  window.__SHEET={id:id, gid:gid, headers:headers, url:base, urlFiltered:base+rowFilter,
                  csvUrl:CSV_URL, early:early, live:liveP};
})();
</script>

<style>
:root{
  --bg:#171C20;
  --bg-soft:#1f262b;
  --pill:#ffffff;
  --pill-text:#37474f;
  --bar:#8a9096;
  --bar-text:#ffffff;
  --accent:#007BC4;
  /* Same hue, lifted, for the places where --accent has to carry meaning as a
     thin line or small text on the dark sidebar rather than as a filled pill. */
  --accent-bright:#3AA0E3;
  --track:#4a565e;
  --track-fill:#eceff1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg)}
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{
  background:var(--bg);
  font-family:'Poppins','Segoe UI',sans-serif;
  font-weight:700;
  color:#eceff1;
  overflow:hidden;
}
#app{display:flex;height:100%}
/* ---------- SIDEBAR ---------- */
#sidebar{
  width:250px;min-width:250px;
  padding:16px 12px 30px 14px;
  height:100%;
  overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:#4a565e transparent;
}
#sidebar::-webkit-scrollbar{width:6px}
#sidebar::-webkit-scrollbar-thumb{background:#4a565e;border-radius:3px}
/* Every colour here is declared outright (same as the Collection page). With
   color-scheme:dark on the page, a field that leans on the browser's default
   form-control white gets flipped to a dark grey, leaving dark text and a dark
   caret on a dark box. Never let a control's legibility depend on a UA default. */
#searchBox{
  width:100%;padding:9px 12px;border:1px solid #4a565e;border-radius:6px;
  background:#263238;
  font:700 13.5px 'Poppins',sans-serif;color:#ffffff;
  caret-color:#ffffff;
  margin-bottom:12px;outline:none;
}
#searchBox::placeholder{color:#90a4ae}
/* outline:none removes the focus ring, so the field draws its own. */
#searchBox:focus{border-color:#eceff1}
.facet{position:relative;margin-bottom:10px}
.facet-btn{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  background:var(--pill);color:var(--pill-text);
  border:none;border-radius:8px;padding:5px 7px;cursor:pointer;
  font:700 12.5px 'Poppins',sans-serif;letter-spacing:1.2px;text-transform:uppercase;
  transition:box-shadow .15s;
}
.facet-btn:hover{box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.facet-btn .icon{font-size:13px;color:#607d8b;transition:transform .2s}
.facet.open .facet-btn .icon{transform:rotate(180deg)}
.facet-btn .count-badge{
  background:var(--accent);color:#fff;border-radius:10px;
  font-size:10px;padding:1px 7px;margin-left:auto;margin-right:8px;
}
.facet-panel{
  display:none;position:relative;z-index:30;
  background:#fff;border-radius:8px;margin-top:5px;
  box-shadow:0 8px 22px rgba(0,0,0,.45);
  padding:8px;color:var(--pill-text);
}
.facet.open .facet-panel{display:block}
/* On a white panel, so it is pinned to the light scheme and given its colours
   explicitly -- the inverse of the #searchBox trap above: with color-scheme:dark
   inherited from the page it would render as a dark box inside a white popover. */
.facet-panel input.opt-search{
  width:100%;padding:6px 9px;margin-bottom:6px;
  border:1px solid #cfd8dc;border-radius:5px;font:700 12.5px 'Poppins',sans-serif;outline:none;
  color-scheme:light;background:#ffffff;color:var(--pill-text);
}
.facet-panel input.opt-search::placeholder{color:#90a4ae}
.opt-list{max-height:240px;overflow-y:auto;scrollbar-width:thin}
.opt-list label{
  display:flex;align-items:center;gap:8px;
  font:700 13px 'Poppins',sans-serif;padding:5px 6px;border-radius:4px;cursor:pointer;
}
.opt-list label:hover{background:#eceff1}
.opt-list input{accent-color:var(--accent)}
.opt-list .n{margin-left:auto;color:#90a4ae;font-size:11px}
.opt-more{font-size:11px;color:#90a4ae;padding:5px 6px}
.facet-clear{
  display:block;width:100%;margin-top:6px;padding:6px;
  background:#eceff1;border:none;border-radius:5px;cursor:pointer;
  font:700 11px 'Poppins',sans-serif;letter-spacing:1px;text-transform:uppercase;color:#546e7a;
}
.facet-clear:hover{background:#cfd8dc}

  padding:7px 9px;border-radius:5px;color:var(--pill-text);

}

   digits between two 132px arrows leave about 140px for the label, so

   wall, revealed only once you have scrolled to the end of it -- the moment
   you actually want the next page. Its middle is the jump control, so the far

<script>
/* ================= CONFIGURATION =================
   The sheet id / gid / header-rows live in the tiny inline script in
   <head> (window.__SHEET) so the download can start before anything else
   on the page — edit them there. */
const SHEET_ID = window.__SHEET.id;
const GID = window.__SHEET.gid;
const MA_BASE = 'https://www.moviesanywhere.com';
// PERF: parsed rows are cached so a revisit renders instantly while a fresh
// copy downloads in the background; if the data changed, the grid silently
// updates (keeping your filters, sliders, page and scroll).
//
// The cache lives in IndexedDB now, in the same database the Collection page
// uses ('dd-cache' / store 'kv'), under a key of its own. It used to be
// localStorage ('maCompare:v2:...', 6h): that is synchronous, so the read and
// the JSON.stringify of every write ran on the main thread, and its ~5MB quota
// is shared with every other page on the origin. The old key is still read
// ONCE as a fallback so nobody's first visit after this change is a cold one,
// and removed after the first successful IndexedDB write so there are never
// two copies.
//
// TTL for PAINTING from it is a week rather than 6h: the live sheet is always
// fetched behind it, so an old cache only ever means "the grid you saw last
// time, for the ~50ms until the edge answers", never "stale data that sticks".
const IDB_NAME  = 'dd-cache', IDB_STORE = 'kv';
const IDB_KEY   = 'maCompare:v3:' + SHEET_ID + ':' + GID;
const LEGACY_CACHE_KEY = 'maCompare:v2:' + SHEET_ID + ':' + GID;
const CACHE_TTL = 7 * 24 * 60 * 60 * 1000;
// Sidebar collapsed/expanded, remembered per page (the Collection page uses dd_sb).
const SB_KEY = 'ma_sb';
// Fixed column positions (0-based, A=0), confirmed directly against the sheet.
// Column A is a small Google-cached =IMAGE() thumbnail (not link text), so the
// outbound link is built from the MA ID page path in column P instead. Columns
// C and E are both labeled "Quality" (owned quality / best-available quality),
// so we read them by position rather than by header text.
// Column P ("MA ID") holds the relative page path, e.g. "/movie/<slug>".
// Column Q holds the full poster URL, e.g.
//   https://images.moviesanywhere.com/<hash>/<uuid>.webp?h=375&resize=fit&w=250
const COL = {
  owned:1, ownedQ:2, md2d:3, bestQ:4, title:5, year:6,
  vudu:7, itunes:8, gplay:9, amazon:10, studio:11, tomato:12, imdb:13,
  vuduId:14, maId:15, imgRaw:16,   // vuduId currently unused
};
const RETAILERS = [
  {key:'vudu',   label:'Vudu'},
  {key:'itunes', label:'iTunes'},
  {key:'gplay',  label:'Google Play'},
  {key:'amazon', label:'Amazon'},
];
// Covers per page adapts to the layout so every row is full
let PER_PAGE = 150;
const mobileMq = window.matchMedia('(max-width:760px)');
function syncPerPage(){
  const firstShown = page * PER_PAGE;
  PER_PAGE = mobileMq.matches ? 148
           : document.body.classList.contains('sbCollapsed') ? 180
           : 150;
  page = Math.floor(firstShown / PER_PAGE);
}
(mobileMq.addEventListener ? mobileMq.addEventListener('change', ()=>{ syncPerPage(); if(items.length) renderPage(); })
                           : mobileMq.addListener(()=>{ syncPerPage(); if(items.length) renderPage(); }));
/* ================================================= */
const FACETS = [
  {label:'Owned',         key:'owned'},
  {label:'Owned Quality', key:'ownedQ'},
  {label:'MD2D',          key:'md2d'},
  {label:'Best Quality',  key:'bestQ'},
  {label:'Studio',        key:'studio'},
  // Pricing filters: discrete dollar-amount checkboxes (like Owned), not
  // ranges. numeric:true sorts the options $ low → high instead of lexically.
  {label:'Best Price',        key:'priceBand',  numeric:true},
  {label:'Vudu Price',        key:'vuduBand',   numeric:true},
  {label:'iTunes Price',      key:'itunesBand', numeric:true},
  {label:'Google Play Price', key:'gplayBand',  numeric:true},
  {label:'Amazon Price',      key:'amazonBand', numeric:true},
];
const SLIDERS = [
  {label:'Year',           key:'year',   min:1920, max:2026, step:1},
  {label:'Rotten Tomatoes',key:'tomato', min:0, max:100, step:1},
  {label:'IMDb',           key:'imdb',   min:0, max:10,  step:0.1},
];
const $=s=>document.querySelector(s);
// One reusable collator for every A -> Z ordering on the page (facet lists,
// title sorts, tie-breaks). localeCompare inside a sort rebuilds the collation
// table on every comparison; numeric:true files "2 Fast" before "10 Things".
const collator = new Intl.Collator(undefined,{sensitivity:'base',numeric:true});
// Deferred work that must still happen on a page busy streaming posters, which

const idle = cb => (window.requestIdleCallback||(f=>setTimeout(f,1)))(cb,{timeout:600});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- STATUS + TOP PROGRESS BAR ----------
   #status is a chip at the top now, not a full-page cover, so the sidebar,
   pager and grid are visible and usable from the first frame. */
// innerHTML, like the Collection page, so an error can carry a <small> line.
// Anything from outside (an error message) must go through esc() first.
function setStatus(html, spinning=true, isErr=false){
  const s=$('#status');
  if(html===null){ s.classList.add('hidden'); return; }
  s.classList.remove('hidden');
  s.classList.toggle('err', isErr);
  s.querySelector('.spin').style.display = spinning ? '' : 'none';
  $('#statusTxt').innerHTML = html;
}
const topbarEl=$('#topbar'), barFill=$('#topfill');
let barPct=0;
function setBar(p){
  if(p==null){ topbarEl.classList.add('indet'); return; }
  p=Math.max(0,Math.min(1,p));
  if(p<barPct) return;                       // never let it run backwards
  barPct=p;
  topbarEl.classList.remove('indet');
  barFill.style.width=(p*100).toFixed(1)+'%';
}
function barDone(){ topbarEl.classList.remove('indet'); barFill.style.width='100%'; topbarEl.classList.add('done'); }
const fmtKB = b => b<1048576 ? Math.round(b/1024)+' KB' : (b/1048576).toFixed(1)+' MB';
// True from the moment the grid shows real titles (cache, mirror or live).
// From then on the status chip stays away: the visitor is looking at a full
// wall, and "Checking for updates..." over it is exactly the visible, slow-
// feeling refresh this page is trying not to have.
let painted=false;
window.__MA_PROG(o=>{
  if(o.stage==='connect'){ if(!painted) setStatus('Connecting to the sheet…'); setBar(null); }
  else if(o.stage==='download'){
    if(!painted) setStatus('Loading titles… '+fmtKB(o.bytes));
    setBar(o.total ? Math.min(0.75, o.bytes/o.total*0.75) : null);
  }
  else if(o.stage==='retry'){ if(!painted) setStatus('Retrying without the row filter…'); setBar(null); }
});
/* ---------- LOAD DATA FROM GOOGLE SHEET ----------
   The <head> script has already started the live request through the edge
   cache (window.__SHEET.live); fetchGviz consumes that in-flight answer first.
   If a plain fetch is blocked by CORS, we retry as JSONP (a <script> tag with
   a callback), which works for any public sheet but cannot go through /sheet. */
function gvizUrl(){
  return window.__SHEET.urlFiltered || window.__SHEET.url;
}
/* ---------- CSV LOADING (first-paint seed + last-resort fallback) ----------
   Turns a published-CSV export into the same {table:{rows:[{c:[{v},...]}]}}
   shape gviz returns, so parseRows() below doesn't need to know which
   transport actually fetched the data. */
function parseCsvText(text){
  const rows=[]; let row=[], field='', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i++; }
        else inQuotes=false;
      }else field+=c;
    }else{
      if(c==='"') inQuotes=true;
      else if(c===',') { row.push(field); field=''; }
      else if(c==='\r') { /* ignore; \n (below) ends the row */ }
      else if(c==='\n') { row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  if(field!=='' || row.length){ row.push(field); rows.push(row); }
  return rows;
}
function csvRowsToGvizJson(rows, headerRows){
  const dataRows=rows.slice(headerRows||0);
  return { table: { rows: dataRows.map(cols => ({
    c: cols.map(v => (v===''||v==null) ? {v:null} : {v})
  })) } };
}
async function fetchCsv(){
  const url=window.__SHEET.csvUrl;
  let txt=null;
  /* Reuse the mirror request the <head> kicked off. NOT one-shot any more:
     the first-paint race and the last-resort fallback in loadSheet() can both
     want it, and a settled promise hands the same text to both for free. A
     failed one is dropped so the fallback really does try again. */
  const early=window.__SHEET && window.__SHEET.early;
  if(early){
    try{ txt=await early; }catch(e){ txt=null; window.__SHEET.early=null; }
  }
  if(txt==null){
    const res=await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    txt=await res.text();
  }
  const json=csvRowsToGvizJson(parseCsvText(txt), window.__SHEET.headers||1);
  if(!json.table.rows.length) throw new Error('CSV had no data rows');
  return json;
}
function parseGvizText(txt){
  const json=JSON.parse(txt.substring(txt.indexOf('(')+1, txt.lastIndexOf(')')));
  if(json && json.status==='error')
    throw new Error((json.errors&&json.errors[0]&&json.errors[0].detailed_message)||'sheet error');
  if(!json || !json.table) throw new Error('sheet answered without a table');
  return json;
}
/* -> {json, meta}. meta = {age, how, url}: how old the edge's copy was, where
   it came from, and the exact URL asked for -- the silent confirm pass needs
   all three (see confirmLater). */
async function fetchGviz(url){
  /* The <head> request already ran the whole edge ladder -- the filtered
     query, then the plain tab if Google rejected it. If that failed there is
     no point sending the same two requests again: go straight on to JSONP. */
  const head=window.__SHEET && window.__SHEET.live;
  if(head){
    window.__SHEET.live=null;            // one-shot; refreshes re-fetch
    const r=await head;
    return {json:parseGvizText(r.text), meta:r};
  }
  const full=url+'&tqx=out:json';
  const r=window.__edge ? await window.__edge.fast(full)
                        : await fetch(full).then(res=>{ if(!res.ok) throw new Error('HTTP '+res.status); return {res, age:0, how:'DIRECT'}; });
  const text=await r.res.text();
  return {json:parseGvizText(text), meta:{age:r.age, how:r.how, url:full}};
}
function jsonpGviz(url){
  return new Promise((resolve,reject)=>{
    const cb='__gviz_cb_'+Math.random().toString(36).slice(2);
    const timer=setTimeout(()=>{ cleanup(); reject(new Error('timed out')); },45000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; script.remove(); }
    window[cb]=json=>{
      cleanup();
      if(json && json.status==='error'){
        reject(new Error((json.errors&&json.errors[0]&&json.errors[0].detailed_message)||'sheet returned an error'));
      } else resolve(json);
    };
    const script=document.createElement('script');
    script.src=url+'&tqx=out:json;responseHandler:'+cb;
    script.onerror=()=>{ cleanup(); reject(new Error('script blocked or sheet not public')); };
    document.head.appendChild(script);
  });
}
/* THE LIVE SHEET, always -- never the mirror.
   The mirror under /mirror/ is written at deploy time, so reading it here made
   the page show whatever the sheet said at the last deploy. With deploys being
   manual that could be hours or days stale, which is exactly what it looked
   like. The mirror is still used, but only to put something on screen fast
   (see the first-paint race in the boot below); what the page settles on
   always comes from the sheet itself.
   Ladder: edge (filtered, then plain -- started in <head>) -> JSONP filtered
   -> JSONP plain -> the mirror. JSONP answers come straight from Google, so
   they are as fresh as it gets (age 0, nothing to confirm). */
async function loadSheet(){
  try{ return await fetchGviz(gvizUrl()); }
  catch(e1){
    console.warn('[ma] edge/gviz fetch failed, trying JSONP:', e1 && e1.message);
    try{ return {json:await jsonpGviz(gvizUrl()), meta:{age:0, how:'JSONP'}}; }
    catch(e2){
      try{ return {json:await jsonpGviz(window.__SHEET.url), meta:{age:0, how:'JSONP'}}; }
      catch(e3){
        /* Every live route failed (offline, sheet unshared, network filter).
           The mirror is stale by definition, but stale beats an empty page.
           Flagged so the boot does not cache it as if it were live. */
        if(window.__SHEET.csvUrl) return {json:await fetchCsv(), meta:{age:0, how:'MIRROR', mirror:true}};
        throw e3;
      }
    }
  }
}
const clean=v=>String(v??'').trim();
// Retailer price cells read like "$24.99 UHD" / "$9.99 SD" —
// split into a number and a quality tier (rank: SD < HD/HDX < UHD/4K).
function parsePriceCell(raw){
  if(raw==null||raw==='') return null;
  const s=String(raw);
  const pm=s.match(/([0-9]+(?:\.[0-9]+)?)/);
  if(!pm) return null;
  const price=parseFloat(pm[1]);
  const qm=s.match(/\b(UHD|4K|HDX|HD|SD)\b/i);
  let tier=1, label='SD';
  if(qm){
    const q=qm[1].toUpperCase();
    if(q==='UHD'||q==='4K'){ tier=3; label='4K UHD'; }
    else if(q==='HDX'||q==='HD'){ tier=2; label='HD'; }
    else { tier=1; label='SD'; }
  }
  return {price, tier, label};
}
// Owned/Owned-Quality display labels: the raw sheet values are terse
// (blank, "FALSE", "SD", "HD"), so we translate them into labels that read
// clearly as filter options.
function ownedDisplay(raw){
  const c=clean(raw);
  if(c.toUpperCase()==='FALSE') return 'UNOWNED';
  return c||'—';
}
function ownedQDisplay(raw){
  const c=clean(raw);
  const u=c.toUpperCase();
  if(!c || c==='—') return 'UNOWNED';
  if(u==='HD') return 'HD UPGRADEABLE';
  if(u==='SD') return 'SD UPGRADEABLE';
  return c;
}
function parseRows(json){
  const out=[];
  // Guard against the same title appearing more than once. The "Need to Add"
  // tab is generated from other tabs, so a title can legitimately exist twice.
  // We key on the MA ID page path (the most reliably unique field), falling
  // back to the Vudu ID, then to title+year. First occurrence wins.
  const seen=new Set();
  (json.table.rows||[]).forEach(r=>{
    const cell=i=>{ const c=r.c && r.c[i]; return c==null?null:(c.v==null?null:c.v); };
    const title=clean(cell(COL.title));
    if(!title) return;
    // Skip anything already owned outright. "UPGRADE" (owned at a lower
    // quality) and "FALSE" (not owned) still belong on a want-to-buy list.
    const ownedRaw=cell(COL.owned);
    if(String(ownedRaw).trim().toUpperCase()==='TRUE') return;
    let yearN=cell(COL.year);
    yearN=typeof yearN==='number'?yearN:parseInt(String(yearN??''),10);
    let tomN=cell(COL.tomato);
    tomN=typeof tomN==='number'?tomN:parseFloat(String(tomN??'').replace('%',''));
    let imdbN=cell(COL.imdb);
    imdbN=typeof imdbN==='number'?imdbN:parseFloat(String(imdbN??''));
    // Gather each retailer's offer, find the highest quality tier available,
    // then the cheapest price within that tier (ties broken by retailer order).
    const offers=RETAILERS.map(rt=>{
      const parsed=parsePriceCell(cell(COL[rt.key]));
      return parsed?{...parsed, retailer:rt.label}:null;
    }).filter(Boolean);
    let best=null;
    if(offers.length){
      const maxTier=Math.max(...offers.map(o=>o.tier));
      best=offers.filter(o=>o.tier===maxTier).reduce((a,b)=>b.price<a.price?b:a);
    }
    const bestQRaw=clean(cell(COL.bestQ));
    const bestQ=bestQRaw==='4K'?'4K UHD':(bestQRaw||'—');
    // ---- DEDUP CHECK ----
    const maIdPath=clean(cell(COL.maId));
    const vuduIdVal=clean(cell(COL.vuduId));
    const dupKey = maIdPath || vuduIdVal || (title+'|'+(isNaN(yearN)?'':yearN));
    if(seen.has(dupKey)) return;   // already have this title — skip the repeat
    seen.add(dupKey);
    // Column Q holds a complete image URL. Use it as-is; only backfill a
    // scheme / extension / sizing params if a future pull leaves any off.
    let img=clean(cell(COL.imgRaw));
    if(img){
      if(img.startsWith('//')) img='https:'+img;
      else if(!/^https?:\/\//i.test(img)) img='https://'+img.replace(/^\/+/,'');
      else img=img.replace(/^http:\/\//i,'https://');
      const qi=img.indexOf('?');
      let base=qi>=0?img.slice(0,qi):img;
      const query=qi>=0?img.slice(qi+1):'';
      if(!/\.(webp|jpe?g|png|avif)$/i.test(base)) base+='.webp';
      img=base+'?'+(query||'h=375&resize=fit&w=250');
    }
    const item={
      title,
      sortTitle:title.replace(/^(the|a|an)\s+/i,'').toLowerCase(),
      year:isNaN(yearN)?null:yearN,
      owned:ownedDisplay(ownedRaw),
      ownedQ:ownedQDisplay(cell(COL.ownedQ)),
      md2d:clean(cell(COL.md2d))||'—',
      bestQ,
      studio:clean(cell(COL.studio))||'—',
      tomato:isNaN(tomN)?null:(tomN>0&&tomN<=1?Math.round(tomN*100):tomN),
      imdb:isNaN(imdbN)?null:imdbN,
      price: best?best.price:null,
      priceBand: best?('$'+best.price.toFixed(2)):null,
      priceQuality: best?best.label:'',
      retailer: best?best.retailer:'',
      url: maIdPath?MA_BASE+maIdPath:'',
      img,
    };
    RETAILERS.forEach(rt=>{
      const p=parsePriceCell(cell(COL[rt.key]));
      item[rt.key+'Price']=p?p.price:null;                 // numeric (kept for sorting/future use)
      item[rt.key+'Band']=p?('$'+p.price.toFixed(2)):null; // string label for the price checkboxes
    });
    item.search=[item.title,item.studio,item.year].join(' ').toLowerCase();
    out.push(item);
  });
  return out;
}
// -> {rows, meta}; meta is what the edge said about the copy (see loadSheet).
async function loadAll(){
  const got=await loadSheet();
  return {rows:parseRows(got.json), meta:got.meta};
}
/* ---------- FACET UI ---------- */
/* Option lists are counted off the titles currently on screen, the same rule
   the Collection page follows: pick a studio and every other list shrinks to
   what that studio actually has, so nothing on offer can only ever return zero.
   A facet with picks of its own is the exception. Counting Studio off a list
   already narrowed to one studio would leave it as the only choice and no way
   to tick a second one, so it counts off everything-but-itself instead. */
function countFacets(rows,list){
  list.forEach(f=>{
    const counts=new Map();
    rows.forEach(m=>{
      const vals=f.csv?m[f.key]:[m[f.key]].filter(Boolean);
      vals.forEach(v=>{
        // MD2D's "—" placeholder (no MD2D status) is noise, not a useful
        // filter option, so it's excluded here rather than shown as a choice.
        if(f.key==='md2d' && v==='—') return;
        counts.set(v,(counts.get(v)||0)+1);
      });
    });
    // Price bands keep their natural $ low -> high order; everything else is
    // A -> Z through the one shared collator (numeric, case/accent-blind), the
    // same ordering the Collection page uses.
    facetValues[f.key]=[...counts.entries()].sort(f.numeric
      ? (a,b)=>(parseFloat(a[0].replace(/[^0-9.]/g,''))||0)-(parseFloat(b[0].replace(/[^0-9.]/g,''))||0)
      : (a,b)=>collator.compare(a[0],b[0]));
  });
}
// The whole-catalog pass, run before every build: buildFacets() sizes its
// panels off it, and a stale selection is checked against it. applyFilters()
// narrows the lists from there.
function buildFacetValues(){
  countFacets(items,FACETS);
  FACETS.forEach(f=>{
    if(!selected[f.key]) selected[f.key]=new Set();
    // Drop any previously-selected value that no longer exists in the data
    // (matters when a background refresh replaces the catalog).
    const counts=new Map(facetValues[f.key]);
    selected[f.key]=new Set([...selected[f.key]].filter(v=>counts.has(v)));
  });
}
function refreshFacetValues(q){
  const shared=[], own=[];
  FACETS.forEach(f=>(selected[f.key].size?own:shared).push(f));
  countFacets(filtered,shared);
  own.forEach(f=>countFacets(items.filter(m=>rowMatches(m,q,f.key)),[f]));
}
// Set once the sidebar exists. A search typed while the sheet is still
// loading has nothing to count yet.
let facetsReady=false;
function refreshFacetsNow(){
  if(!facetsReady) return;
  refreshFacetValues($('#searchBox').value.trim().toLowerCase());
  // Counts and option lists just moved under the sidebar, so every badge and
  // whichever panel is open both need redoing.
  document.querySelectorAll('#facets .facet').forEach(el=>{
    updateBadge(el,el.dataset.key);
    if(el.classList.contains('open') && el._render) el._render();
  });
}
function buildFacets(){
  const host=$('#facets'); host.innerHTML='';
  FACETS.forEach(f=>{
    const el=document.createElement('div');
    el.className='facet'; el.dataset.key=f.key;
    const many=facetValues[f.key].length>12;
    el.innerHTML=`
      <button class="facet-btn">
        <span>${esc(f.label)}</span>
        <span class="count-badge" style="display:none">0</span>
        <span class="icon">${many?'+':'▾'}</span>
      </button>
      <div class="facet-panel">
        ${facetValues[f.key].length>10?'<input class="opt-search" placeholder="Search…">':''}
        <div class="opt-list"></div>
        <button class="facet-clear">Clear</button>
      </div>`;
    host.appendChild(el);
    const list=el.querySelector('.opt-list');
    const search=el.querySelector('.opt-search');
    // A re-render starts at the top -- the panel has just been opened, or had
    // its list recounted underneath it -- except straight after a tick, when
    // the list barely moves and the next box you want is still under the cursor.
    let keepScroll=false;
    const render=()=>{
      const ql=search?search.value.trim().toLowerCase():'';
      const prev=list.scrollTop;
      const itemsF=facetValues[f.key].filter(([v])=>!ql||v.toLowerCase().includes(ql));
      const shown=itemsF.slice(0,250);
      list.innerHTML=(shown.length?shown.map(([v,n])=>`
        <label><input type="checkbox" value="${esc(v)}" ${selected[f.key].has(v)?'checked':''}>
        <span>${esc(v)}</span><span class="n">${n}</span></label>`).join('')
        :'<div class="opt-more">Nothing left to narrow by.</div>')
        +(itemsF.length>250?`<div class="opt-more">${itemsF.length-250} more — type to narrow down</div>`:'');
      list.scrollTop = keepScroll ? prev : 0;
      keepScroll=false;
    };
    el._render=render;
    el.querySelector('.facet-btn').addEventListener('click',()=>{
      const was=el.classList.contains('open');
      document.querySelectorAll('.facet.open').forEach(x=>x.classList.remove('open'));
      if(!was){ el.classList.add('open'); render(); if(search) search.focus(); }
    });
    if(search) search.addEventListener('input',render);
    list.addEventListener('change',e=>{
      if(e.target.type!=='checkbox') return;
      const v=e.target.value;
      e.target.checked?selected[f.key].add(v):selected[f.key].delete(v);
      keepScroll=true;
      applyFilters();
    });
    el.querySelector('.facet-clear').addEventListener('click',()=>{
      selected[f.key].clear(); if(search) search.value='';
      applyFilters();
    });
    // Keep the badge correct if this is a rebuild with selections intact.
    updateBadge(el,f.key);
  });
  facetsReady=true;
  if(!buildFacets._outsideBound){
    document.addEventListener('click',e=>{
      if(!e.target.closest('.facet')) document.querySelectorAll('.facet.open').forEach(x=>x.classList.remove('open'));
    });
    buildFacets._outsideBound=true;
  }
}
function updateBadge(el,key){
  const b=el.querySelector('.count-badge'), n=selected[key].size;
  b.style.display=n?'inline-block':'none'; b.textContent=n;
}
/* ---------- SLIDERS ---------- */
/* Every rebuild keeps a range the visitor actually SET (s._active), clamped to
   the possibly-new min/max; an untouched slider simply takes the new full span.
   This used to be a `preserve` flag the caller had to remember to pass, and
   the first-visit mirror -> live swap did not pass it, so a range set during
   that window snapped back. Same rule as the Collection page's buildSliders. */
function buildSliders(){
  const host=$('#sliders'); host.innerHTML='';
  SLIDERS.forEach(s=>{
    const prev=s._active && rangeState[s.key] ? rangeState[s.key] : null;
    const vals=items.map(m=>m[s.key]).filter(v=>v!=null);
    if(vals.length){
      s.min=Math.floor(Math.min(s.min,...vals));
      s.max=Math.ceil(Math.max(s.max,...vals));
    }
    let startLo=s.min, startHi=s.max;
    if(prev){
      startLo=Math.max(s.min,Math.min(s.max,prev.lo));
      startHi=Math.max(s.min,Math.min(s.max,prev.hi));
    }
    rangeState[s.key]={lo:startLo,hi:startHi};
    const el=document.createElement('div');
    el.className='slider-group';
    el.innerHTML=`
      <div class="sl-title">${esc(s.label)}</div>
      <div class="range-wrap">
        <div class="rail"></div><div class="fill"></div>
        <input type="range" class="lo" min="${s.min}" max="${s.max}" step="${s.step}" value="${startLo}">
        <input type="range" class="hi" min="${s.min}" max="${s.max}" step="${s.step}" value="${startHi}">
      </div>
      <div class="sl-vals">
        <input class="v-lo" type="number" min="${s.min}" max="${s.max}" step="${s.step}" value="${startLo}" title="Type a value">
        <input class="v-hi" type="number" min="${s.min}" max="${s.max}" step="${s.step}" value="${startHi}" title="Type a value">
      </div>`;
    host.appendChild(el);
    const lo=el.querySelector('.lo'), hi=el.querySelector('.hi'),
          fill=el.querySelector('.fill'), vlo=el.querySelector('.v-lo'), vhi=el.querySelector('.v-hi');
    const paint=()=>{
      const a=+lo.value,b=+hi.value;
      let mn=Math.min(a,b),mx=Math.max(a,b);
      if(mn < s.min + s.step/2) mn = s.min;
      if(mx > s.max - s.step/2) mx = s.max;
      rangeState[s.key]={lo:mn,hi:mx};
      const pct=v=>(v-s.min)/(s.max-s.min)*100;
      fill.style.left=pct(mn)+'%'; fill.style.width=(pct(mx)-pct(mn))+'%';
      vlo.value=mn; vhi.value=mx;
      /* Deliberately the same test rowMatches() uses to decide whether this
         slider filters anything, so the blue can never disagree with the grid. */
      s._active = mn>s.min || mx<s.max;
      el.classList.toggle('active', s._active);
    };
    paint();
    let t;
    const onInput=()=>{ paint(); clearTimeout(t); t=setTimeout(applyFilters,150); };
    lo.addEventListener('input',onInput); hi.addEventListener('input',onInput);
    const manual=(inputEl,rangeEl)=>{
      let v=parseFloat(inputEl.value);
      if(isNaN(v)){ paint(); return; }
      v=Math.max(s.min,Math.min(s.max,v));
      rangeEl.value=v;
      paint(); applyFilters();
    };
    vlo.addEventListener('change',()=>manual(vlo,lo));
    vhi.addEventListener('change',()=>manual(vhi,hi));
    vlo.addEventListener('keydown',e=>{ if(e.key==='Enter') vlo.blur(); });
    vhi.addEventListener('keydown',e=>{ if(e.key==='Enter') vhi.blur(); });
    s._reset=()=>{ lo.value=s.min; hi.value=s.max; paint(); };

/* ---------- FILTER + SORT + RENDER ---------- */
// `skipKey` leaves one facet out, which is how a facet with picks of its own
// gets its option list counted (see refreshFacetValues).
function rowMatches(m,q,skipKey){
  if(q && !m.search.includes(q)) return false;
  for(const f of FACETS){
    if(f.key===skipKey) continue;
    const sel=selected[f.key]; if(!sel.size) continue;
    const vals=f.csv?m[f.key]:[m[f.key]];
    if(!vals.some(v=>sel.has(v))) return false;
  }
  for(const s of SLIDERS){
    const r=rangeState[s.key];
    if(r.lo>s.min || r.hi<s.max){
      const v=m[s.key];
      if(v==null || v<r.lo || v>r.hi) return false;
    }
  }

}
/* keepPage: stay on the current page (a background repaint) instead of going
   back to page 1 (the visitor changed a filter).
   soft: leave the grid's <img> tags alone if the cards would come out the same
   (see renderedKey). Both as on the Collection page. */
function applyFilters(keepPage, soft){
  const q=$('#searchBox').value.trim().toLowerCase();
  filtered=items.filter(m=>rowMatches(m,q,null));
  refreshFacetsNow();
  renderChips();
  sortItems();
  if(!keepPage) page=0;
  renderPage(soft?{ifChanged:true}:null);

/* Same semantics as the Collection page's sortNow():
   - direction: only "desc" reverses. This used to read `dir==='asc'?1:-1`, the
     other way round from every other page, so any value without an explicit
     direction sorted DESCENDING here and ascending everywhere else;
   - blanks (no price, no score, no year) go last whichever way you sort;
   - ties, and rows blank on both sides, fall back to the title A -> Z through
     the shared collator, so equal prices list in a stable, readable order
     instead of whatever order the sheet happened to hold them in.
   Titles compare on sortTitle (leading The/A/An dropped), as this page always
   has, with the full title as the final tie-break. */
function sortItems(){
  const [key,dir]=$('#sortSel').value.split('|');
  const mul=dir==='desc'?-1:1;
  const alphaTitle=(a,b)=>collator.compare(a.sortTitle||a.title||'', b.sortTitle||b.title||'')
                       || collator.compare(a.title||'', b.title||'');
  filtered.sort((a,b)=>{
    if(key==='sortTitle') return mul*alphaTitle(a,b);
    const x=a[key], y=b[key];
    if(x==null&&y==null) return alphaTitle(a,b);
    if(x==null) return 1;               // blanks last either direction
    if(y==null) return -1;
    if(x===y) return alphaTitle(a,b);
    return mul*(x-y);
  });
}
// Fingerprint of what is currently in the grid. A background repaint that
// would produce the same cards is skipped outright -- rewriting innerHTML
// restarts every <img>, throwing away posters that are already half-loaded.
// Everything the card markup reads goes into it, and nothing else.
let renderedKey=null;
function renderPage(opts){
  const total=filtered.length;
  const pages=Math.max(1,Math.ceil(total/PER_PAGE));
  page=Math.min(page,pages-1);
  const start=page*PER_PAGE, end=Math.min(start+PER_PAGE,total);
  const label= total? `${start+1} - ${end} / ${total}` : '0 results';
  $('#pgLabel').textContent=label;
  const atFirst=page===0, atLast=page>=pages-1;
  $('#prevPg').disabled=atFirst;  $('#nextPg').disabled=atLast;
  if(window.syncBottomPager) syncBottomPager(page,pages);
  const grid=$('#grid');
  const slice=filtered.slice(start,end);
  let k=page+'|';
  for(const m of slice) k+=m.url+'\u0001'+m.title+'\u0001'+m.year+'\u0001'+m.img+'\u0001'
    +m.retailer+'\u0001'+m.price+'\u0001'+m.priceQuality+'\u0002';
  if(opts && opts.ifChanged && k===renderedKey) return;  // identical -> leave the loading images alone
  renderedKey=k;
  // The first ~20 covers load eagerly with a high fetch priority so the top of
  // the grid fills straight away; the rest stay lazy. decoding="async" keeps
  // poster decode work off the main thread so scrolling/paging stays smooth.
  grid.innerHTML=slice.map((m,i)=>{
    const tip=`${m.title}${m.year?' ('+m.year+')':''}${m.retailer?' — cheapest at '+m.retailer:''}`;
    return `
    <a class="card" href="${esc(m.url)||'#'}" target="_blank" rel="noopener"
       title="${esc(tip)}">
      ${m.img?`<img loading="${i<20?'eager':'lazy'}" ${i<10?'fetchpriority="high"':''} decoding="async"
        width="250" height="375" src="${esc(m.img)}"
        onerror="this.remove();this.parentNode.insertAdjacentHTML('afterbegin','<div class=ph>${esc(m.title).replace(/'/g,'&#39;')}</div>')">`
        :`<div class="ph">${esc(m.title)}</div>`}
      ${m.retailer?`<span class="where-tag r-${m.retailer.toLowerCase().replace(/ /g,'')}">${esc(m.retailer)}</span>`:''}
      ${m.price!=null?`<span class="price-tag">$${m.price.toFixed(2)}${m.priceQuality?' '+m.priceQuality:''}</span>`:''}
    </a>`;

}
function toTop(){
  $('#grid').scrollTop=0;
  $('#pagerTop').scrollIntoView({behavior:'smooth', block:'start'});
}
function goPrev(){ if(page>0){ page--; renderPage(); toTop(); } }
function goNext(){ page++; renderPage(); toTop(); }
$('#prevPg').addEventListener('click',goPrev);   $('#nextPg').addEventListener('click',goNext);
/* ---- BOTTOM PAGER ----------------------------------------------------------
   A second set of controls parked at the foot of the wall, revealed only once
   #grid -- which is the scroll container on this page, not the window -- has
   been scrolled to its end.

   The middle of the bar is the jump control. It shows "Page 67 of 127"; click
   it and it becomes a field you type a page number into, because the <select>
   this replaced meant scrolling a 127-item menu to get anywhere, which is a
   list rather than a jump. Enter commits, Escape or clicking away cancels, and
   anything out of range is clamped rather than rejected.
   ------------------------------------------------------------------------- */
(function(){
  const grid=document.getElementById('grid'),
        prevB=document.getElementById('prevPgB'), nextB=document.getElementById('nextPgB'),
        label=document.getElementById('pgJump'), form=document.getElementById('pgJumpForm'),
        field=document.getElementById('pgJumpIn'), ofTxt=document.getElementById('pgJumpOf');

  function openJump(){
    field.value=String(cur+1);
    label.hidden=true; form.hidden=false;
    field.focus(); field.select();
  }
  function closeJump(){ if(!form.hidden){ form.hidden=true; label.hidden=false; } }
  // The arrows run the same goPrev/goNext as the top bar, so a flip from the
  // foot of the wall lands exactly where a flip from the head does.
  prevB.addEventListener('click',goPrev);
  nextB.addEventListener('click',goNext);
  label.addEventListener('click',openJump);
  form.addEventListener('submit',function(e){
    e.preventDefault();
    const n=parseInt(field.value,10);
    closeJump();
    if(!isFinite(n)) return;                       // empty or junk -- just close
    const want=Math.min(pageCount,Math.max(1,n))-1;
    if(want===cur) return;

  field.addEventListener('keydown',function(e){ if(e.key==='Escape'){ e.preventDefault(); closeJump(); } });

  /* Within 24px of the end counts as the end: the scroll metrics are fractional

     half a pixel short never shows the bar.
     Measured straight out of the scroll handler rather than inside a rAF --
     it is one read, and the class is only written when the answer changes
     (twice per trip down the wall), so there is no layout thrash to batch. */
  let shown=null;
  function atEnd(){
    const end = grid.scrollHeight-grid.scrollTop-grid.clientHeight<=24;
    if(end!==shown){ shown=end; document.body.classList.toggle('atEnd',end); }
  }

       A timeout rather than rAF: this has to settle even when the tab is
       throttled, and reading scrollHeight forces the layout it needs. */
    setTimeout(function(){ shown=null; atEnd(); },0);
  };

})();
let searchTimer;
$('#searchBox').addEventListener('input',()=>{ clearTimeout(searchTimer); searchTimer=setTimeout(applyFilters,200); });
$('#sortSel').addEventListener('change',()=>{ sortItems(); page=0; renderPage(); });
/* The visible sort control -- copied from the Collection page. #sortSel stays
   the single source of truth: every pick writes to it and fires a real
   'change', so sortItems() and the listener above need to know nothing about
   this. It exists because Chrome on Windows draws a <select>'s dropdown list
   with the OS menu font: the options came out in Segoe UI no matter what
   font-family the select carried. Plain markup honours Poppins. */
(function(){
  const wrap=$('#sortWrap'), sel=$('#sortSel'),
        btn=$('#sortBtn'), panel=$('#sortPanel'), label=$('#sortLabel');
  panel.innerHTML=[].map.call(sel.options,o=>
    `<button type="button" role="option" data-v="${esc(o.value)}"`+
    ` aria-selected="${o.value===sel.value}">${esc(o.textContent)}</button>`).join('');
  /* The closed button gives the label about 181px, and the graded sorts run
     past it with "(high)"/"(low)" spelled out, so they arrived ellipsed with
     the one word that tells them apart cut off. data-short swaps that suffix
     for an arrow -- down for highest-first, up for lowest-first. Only the
     closed button takes it; the panel, the <select> and the tooltip keep the
     full wording. */
  const sync=()=>{
    const cur=sel.options[sel.selectedIndex];
    label.textContent=cur?(cur.dataset.short||cur.textContent):'';
    btn.title=cur?cur.textContent:'Sort titles';

/* Desktop collapse, remembered across visits (SB_KEY). Restored here, before

function setSbCollapsed(v){

/* ---------- CACHE (IndexedDB, shared 'dd-cache' database) ----------
   One connection, opened once and reused for the read and every write. Every
   failure is swallowed: private mode, a full quota or a blocked database just
   means no instant paint, never a broken page. */
let idbConn=null;
function openIdb(){
  if(idbConn) return idbConn;
  idbConn=new Promise((res,rej)=>{
    const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE); };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>{ idbConn=null; rej(r.error); };
  });
  return idbConn;
}
function idbGet(db,key){
  return new Promise((res,rej)=>{
    const q=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(key);
    q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);
  });
}
function usable(rec){
  if(!rec || !Array.isArray(rec.d) || !rec.d.length) return null;
  if(!(Date.now()-rec.t <= CACHE_TTL)) return null;
  return rec;
}
// The pre-IndexedDB copies: localStorage, or sessionStorage where an embed
// blocked localStorage. Only ever READ (once, as a fallback) and removed.
function legacyStores(){
  const out=[];
  try{ if(window.localStorage) out.push(window.localStorage); }catch(e){}
  try{ if(window.sessionStorage) out.push(window.sessionStorage); }catch(e){}
  return out;
}
async function cacheGet(){
  try{
    const rec=usable(await idbGet(await openIdb(), IDB_KEY));
    if(rec) return rec;
  }catch(e){ /* no IndexedDB here -- try the old copy */ }
  for(const store of legacyStores()){
    try{
      const raw=store.getItem(LEGACY_CACHE_KEY);
      if(!raw) continue;
      const rec=usable(JSON.parse(raw));
      if(rec) return rec;
    }catch(e){ /* try the next store */ }
  }
  return null;
}
function writeCache(list){
  /* Deferred to idle() (with its timeout -- a grid still streaming posters may
     never go idle; on /sales that once left the cache unwritten indefinitely).
     IndexedDB stores the array by structured clone, so there is no
     JSON.stringify of the whole catalog on the main thread any more. */
  idle(async()=>{
    try{
      const db=await openIdb();
      await new Promise((res,rej)=>{
        const tx=db.transaction(IDB_STORE,'readwrite');
        tx.objectStore(IDB_STORE).put({t:Date.now(), d:list}, IDB_KEY);
        tx.oncomplete=res; tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);
      });
      // Written -- so the localStorage copy is now just a second, older copy.
      for(const store of legacyStores()){ try{ store.removeItem(LEGACY_CACHE_KEY); }catch(e){} }
    }catch(e){ /* private mode / quota -- caching is optional */ }
  });
}
/* ---------- SOFT REPAINT ----------
   The ONE way data reaches the screen: the cache, the mirror seed, the live
   answer and the silent confirm pass all come through here. If the new rows
   are identical to what is on screen it does nothing at all. Otherwise it
   swaps them in while keeping everything the visitor has done: page number,
   facet picks, slider ranges, search text, grid + sidebar scroll, the open
   facet panel (with its own search text and scroll), and -- through
   renderPage's renderedKey -- the <img> tags of any card that did not change.
   Returns true if anything was repainted. */
let shownSig=null;
function applyData(list){
  // ~200 rows stringify in well under a millisecond; a field-by-field diff
  // would be more code for no measurable gain.
  const sig=JSON.stringify(list);

  const first=!painted;
  const grid=$('#grid'), side=$('#sidebar');
  const gridTop=grid.scrollTop, sideTop=side.scrollTop;
  const openEl=document.querySelector('#facets .facet.open');

/* Resolves with the first of `promises` to produce a non-empty {rows}, or null
   if none does. Same idea as the D2D page's firstNonEmpty. */
function firstNonEmpty(promises){
  const running=promises.filter(Boolean);
  if(!running.length) return Promise.resolve(null);
  return new Promise(resolve=>{
    let left=running.length;
    const lose=()=>{ if(--left===0) resolve(null); };
    running.forEach(p=>p.then(v=>{ if(v && v.rows && v.rows.length) resolve(v); else lose(); }, lose));
  });

/* ---------- SILENT CONFIRM PASS ----------
   `meta` is what the edge said about the copy the page settled on. When it was
   fresh enough (or came straight from Google) there is nothing to do.
   Otherwise, once the page is idle, ask for the SAME query again insisting on
   a copy no older than __edge.FRESH_S, and swap it in only if it differs. No
   status chip, no bar, no toast either way -- it is a correction, not an event. */
let confirming=false;
function confirmLater(meta){
  if(confirming || !window.__edge || !meta || !meta.url || !window.__edge.isOld(meta)) return;
  confirming=true;
  idle(async()=>{
    try{
      const r=await window.__edge.confirm(meta.url);
      const rows=parseRows(parseGvizText(await r.res.text()));
      if(!rows.length) throw new Error('no rows returned');
      const changed=applyData(rows);
      console.info('[ma] confirm pass: '+(changed?'CHANGED, caught up silently':'unchanged'));
      writeCache(rows);

      console.warn('[ma] confirm pass failed (keeping what is on screen):', e && e.message);
    }

/* ---------- BOOT ----------
   Order of operations for the fastest possible first paint:
   1. Start consuming the live answer the <head> already has in flight.
   2. Cached rows (IndexedDB): paint them IMMEDIATELY, no network wait, and
      keep the status chip away.
   3. No cache (first visit, cleared storage, private window): race the
      deploy-time mirror against the live answer and paint whichever usable
      one lands first. The live one usually wins now that it comes off the
      edge; the mirror is the insurance for a cold edge or a slow Google.
   4. The live answer: soft-repaint if it differs from what is on screen, then
      cache it.

(async function(){
  syncPerPage();
  const t0=performance.now();
  const ms=()=>Math.round(performance.now()-t0)+'ms';
  const liveP=loadAll();

  const rec=await cacheGet();
  let firstSrc=null;

  }else{
    const fromLive=liveP.then(r=>({rows:r.rows, src:'live'}), ()=>null);
    const fromMirror=window.__SHEET.csvUrl
      ? fetchCsv().then(j=>({rows:parseRows(j), src:'mirror'}),
                        e=>{ console.warn('[ma] mirror seed unavailable:', e && e.message); return null; })
      : null;

    if(seed && applyData(seed.rows)){

  try{
    const fresh=await liveP;
    if(!fresh.rows.length) throw new Error('No rows found — is the sheet shared as "Anyone with the link"?');
    /* loadSheet() only answers with the mirror when every live route failed.
       The mirror is a deploy-time copy, so it is no improvement on a cached
       grid from a previous live load -- treat that as the failure it is
       rather than swapping older data in under a "Catalog updated" toast. */
    if(fresh.meta.mirror && firstSrc==='cache') throw new Error('live sheet unreachable');
    if(fresh.meta.mirror) console.warn('[ma] live sheet unreachable -- showing the deploy-time mirror');
    /* Don't step BACKWARDS. The cache is written by every live load and every
       confirm pass, so it can easily be newer than the copy the edge is still
       holding (it was fetched `age` seconds ago). Swapping that older copy in
       would undo the last confirm on screen -- with a "Catalog updated" toast
       -- only for this visit's confirm pass to put it back a moment later. So
       an edge copy older than the cache is not painted; it just triggers the
       confirm pass below, which asks Google for a copy newer than both. */
    const olderThanCache = firstSrc==='cache' && fresh.meta.age>0
      && rec.t > Date.now()-fresh.meta.age*1000;

    if(olderThanCache) console.info('[ma] edge copy is older than the cache -- keeping the cache, confirming');

    // quiet note. The first-visit mirror -> live swap does not: that grid was
    // only ever a placeholder.

    if(!fresh.meta.mirror && !olderThanCache) writeCache(fresh.rows);
    setBar(1); barDone(); setStatus(null);

    }else{
      setStatus('Could not load the sheet: '+esc(err && err.message), false, true);
    }
  }
})();
</script>
</body>
</html>
