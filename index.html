<!-- ===================================================================
     POSTER ROUTING -- runs before anything else in the page.

     Rewrites the src of every <img>, now and as the grid renders more, to
     load through this domain via Netlify's Image CDN instead of straight
     from the image host.

     Two reasons, in order of how much they matter:

     1. Networks that filter on hostname (a work network, some ISPs) block
        images2.vudu.com outright, and the fallback proxies the pages walk
        through -- cdn.statically.io, i0.wp.com, wsrv.nl -- are separate
        hostnames that can be blocked just as easily. Routed through here
        the browser only ever connects to this site, so there is nothing
        for a host-based filter to match. (Confirmed working on a network
        that was blocking Vudu.)

     2. The Image CDN resizes and re-encodes: a poster arrives as ~10KB of
        webp instead of ~40KB of source jpeg.

     Requires the [images] remote_images allowlist in netlify.toml -- a URL
     whose host is not on that list is refused by the Image CDN, so add the
     host there before pointing anything new at it.
     =================================================================== -->
<script>
(function () {
  var PROXY  = "/img";
  var WIDTH  = 300;      // poster cards render ~150px wide; 300 covers retina
  var FORMAT = "webp";   // smaller than the source jpg

  function proxied(u) {
    if (!u) return u;
    u = String(u).trim();
    if (!/^(https?:)?\/\//i.test(u)) return u;              // relative -> leave alone
    if (u.indexOf("/.netlify/images") !== -1) return u;     // already proxied
    if (u.indexOf("//" + location.host) !== -1) return u;   // same-site -> leave alone
    if (u.slice(0, 2) === "//") u = "https:" + u;
    else if (u.slice(0, 5).toLowerCase() === "http:") u = "https:" + u.slice(5);
    return PROXY + "?url=" + encodeURIComponent(u) + "&w=" + WIDTH + "&fm=" + FORMAT;
  }

  function fix(el) {
    if (!el || el.tagName !== "IMG") return;
    var src = el.getAttribute("src");
    var next = proxied(src);
    if (next && next !== src) el.setAttribute("src", next);
  }

  function scan(root) {
    if (!root || root.nodeType !== 1) return;
    fix(root);
    if (root.querySelectorAll) {
      var imgs = root.querySelectorAll("img");
      for (var i = 0; i < imgs.length; i++) fix(imgs[i]);
    }
  }

  new MutationObserver(function (mutations) {
    for (var i = 0; i < mutations.length; i++) {
      var m = mutations[i];
      if (m.type === "attributes") fix(m.target);
      else for (var j = 0; j < m.addedNodes.length; j++) scan(m.addedNodes[j]);
    }
  }).observe(document.documentElement, {
    childList: true, subtree: true, attributes: true, attributeFilter: ["src"]
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { scan(document.body); });
  } else {
    scan(document.body);
  }
})();
</script>

<script>
/* ============ STATIC SNAPSHOT (Netlify) ============
   Deliberately the FIRST script in the document, so the snapshot request is on
   the wire before anything else is even parsed.

   WHY THIS EXISTS
   ---------------
   The early loader below is already about as good as it can get against the
   published Google Sheets CSV -- it streams, it paints from the first 600 rows,
   it revalidates rather than re-downloading. What it cannot fix is the endpoint
   itself:

       Cache-Control: private, max-age=300      <- measured, not assumed
       11.7MB raw / 3.45MB gzipped / ~9.3s cold

   "private" bars every CDN from holding a copy, and 300s means the browser
   re-fetches within a single sitting. So on a first visit -- no IndexedDB
   cache yet -- the page could not show a single cover until megabytes of CSV
   had come down from Google.

   The snapshot is that same collection, rebuilt at deploy time into a compact
   tiered encoding and served by Netlify as an immutable, content-hashed,
   Brotli-compressed file: ~589KB for everything the grid needs to paint.
   Effectively it is a warm cache that a browser gets to use on a page it has
   never visited.

   HOW IT SLOTS IN
   ---------------
   It does NOT replace the live sheet. init() treats a decoded snapshot exactly
   as it treats an IndexedDB cache hit: paint from it, then run the existing
   revalidation probe against the real sheet and catch up if anything moved.
   signature() fingerprints on Title/Date Added/Viewing Status/Quality, all of
   which live in the core tier -- so a snapshot fingerprint is directly
   comparable to a live one and the existing probe logic needs no changes.

   If any of this fails, every path below still works: init() falls through to
   window.__startCsv() exactly as it did before the snapshot existed. */
(function(){
window.__SNAP=true;              // read synchronously by the loader below
var MANIFEST='/data-manifest.json';

function getJson(u){
  return fetch(u,{credentials:'omit'}).then(function(r){
    if(!r.ok) throw new Error(u+' HTTP '+r.status);
    return r.json();
  });
}
/* The manifest is the only non-immutable request: it is what maps a tier name
   onto the current content-hashed filename. Tiny, and fetched once. */
var manifest=getJson(MANIFEST);
function tier(name){
  return manifest.then(function(m){
    if(!m||!m.files||!m.files[name]) throw new Error('manifest has no tier "'+name+'"');
    return getJson('/snapshots/'+m.files[name]);
  });
}

/* Rebuild rows in the sheet's OWN column order, so parseRows() downstream is
   handed exactly the shape it would have got from the CSV and nothing else in
   the page has to know the snapshot exists. */
function decodeCore(p){
  var idx={}, i;
  for(i=0;i<p.cols.length;i++) idx[p.cols[i]]=i;
  var multi={}, single={};
  for(i=0;i<p.multi.length;i++)  multi[p.multi[i]]=1;
  for(i=0;i<p.single.length;i++) single[p.single[i]]=1;
  var nc=p.cols.length, n=p.rows.length, out=new Array(n);
  var iT=idx['Title'], iS=idx['Sort Title'], iI=idx['Img'], iL=idx['Link'];
  for(var r=0;r<n;r++){
    var rec=p.rows[r], row=new Array(nc);
    for(i=0;i<nc;i++) row[i]='';
    /* 0 marks a blank sheet row. It is kept rather than dropped because
       parseRows() derives sheetRow from the array position. */
    if(rec!==0){
      row[iT]=rec[0];
      row[iS]=rec[1]===0?rec[0]:rec[1];   // 0 == "same as Title"
      /* Url encoding, mirrored from encodeImg/encodeLink in the build script.
         The cases are told apart by JSON type, so a literal url (always a
         1-element array) can never be mistaken for an id (always a string)
         or for a prefix flag (always a number). */
      var im=rec[2], lk=rec[3], imgId=null;
      if(typeof im==='string'){ imgId=im; row[iI]=p.imgPrefix+im+p.imgSuffix; }
      else row[iI]=im[0];                                  // literal
      if(lk===0)                 row[iL]=p.linkBrowse+imgId;
      else if(lk===1)            row[iL]=p.linkMovies+imgId;
      else if(typeof lk==='string') row[iL]=p.linkBrowse+lk;
      else if(lk.length===2)     row[iL]=p.linkMovies+lk[1];
      else                       row[iL]=lk[0];            // literal
      for(var k=0;k<p.coreCols.length;k++){
        var c=p.coreCols[k], v=rec[4+k], d=p.dicts[c], s;
        if(multi[c]){ s=''; for(i=0;i<v.length;i++) s+=(i?', ':'')+d[v[i]]; row[idx[c]]=s; }
        else if(single[c]) row[idx[c]]=d[v];
        else row[idx[c]]=v;
      }
    }
    out[r]=row;
  }
  return {cols:p.cols, rows:out, src:'snapshot'};
}

/* Director and Actors carry 7.5k and 29k unique names between them -- about as
   much again as the entire rest of the grid. They are only read when a facet
   panel opens or the search index is built, so they ride separately and are
   patched onto the already-painted rows by sheet position. */
function decodeFacets(p){
  var n=p.rows.length, out=new Array(n);
  for(var r=0;r<n;r++){
    var rec=p.rows[r];
    if(rec===0){ out[r]=null; continue; }
    var o={};
    for(var k=0;k<p.cols.length;k++){
      var c=p.cols[k], v=rec[k], d=p.dicts[c], s='';
      for(var i=0;i<v.length;i++) s+=(i?', ':'')+d[v[i]];
      o[c]=s;
    }
    out[r]=o;
  }
  return out;
}

window.__snapCore   = tier('core').then(decodeCore);
window.__snapFacets = tier('facets').then(decodeFacets);
/* Descriptions are only wanted for search enrichment and the detail view, so
   this tier is not requested until something actually asks. */
var descP=null;
window.__snapDesc=function(){
  if(!descP) descP=tier('desc').then(function(p){ return p.rows; });
  return descP;
};
/* A missing or broken snapshot must never be fatal -- the live sheet is still
   there. Attach handlers now so a failure cannot surface as an unhandled
   rejection while init() is still deciding what to do. */
window.__snapCore.catch(function(e){
  try{ console.warn('[snapshot] core unavailable:', (e&&e.message)||e); }catch(x){}
});
window.__snapFacets.catch(function(e){
  try{ console.warn('[snapshot] facets unavailable:', (e&&e.message)||e); }catch(x){}
});
})();
</script>
<script>
/* ============ EARLY DATA LOADER ============
   Runs before the CSS, the fonts and the body are parsed, so the download is
   already in flight while the browser is still reading the rest of this file.

   WHAT CHANGED, AND WHY THE PAGE USED TO SIT THERE FOR ~10s
   ---------------------------------------------------------
   The old loader asked for the whole sheet as one gviz response, waited for
   every byte, JSON.parsed ~14MB, built 18,883 objects, sorted them, and only
   THEN wrote the first <img> tag. Nothing could be requested for the covers
   until all of that had finished -- so the posters were always ~10s late no
   matter how fast the network was.

   Now the response is READ AS IT ARRIVES. The CSV is parsed incrementally, and
   the moment the first FIRST_ROWS records are decoded they are handed to the
   page, which renders page 1 and starts pulling posters while the remaining
   ~11MB is still downloading. Covers now appear after a few hundred KB instead
   of after the entire sheet.

   WHY "PUBLISHED CSV UNAVAILABLE" USED TO APPEAR WHEN THE CSV WAS FINE
   -------------------------------------------------------------------
   The fallback used to be armed by a flat 4s deadline on `firstDone`, which is
   only set once 600 rows have been DECODED (~445KB) -- so any ordinary slow
   connection, or Google taking a few seconds to generate a 14MB export, tripped
   it and the page announced the CSV was unavailable while it was downloading
   perfectly well. Worse, tripping it fires BOTH gviz sources, so three ~14MB
   downloads of the same sheet then competed for bandwidth and the CSV landed
   even later.

   The deadline now cancels the moment the CSV's response HEADERS come back OK,
   because that is the point at which the published link is provably alive.
   A separate stall watchdog still covers a connection that opens and then goes
   quiet, and the fallback now reports WHY it fired ('error' / 'slow' /
   'stalled') along with the underlying message, instead of blaming the link
   for what is really just a slow network.

   Source order (first success wins):
     1. Published CSV  <-- static, CDN-cached, gzipped, no query engine in
        front of it, and streamable. This is the fast path.
     2. gviz JSON via fetch   } used only if the CSV fails
     3. gviz JSON via JSONP   } (JSONP also covers strict-sandbox embeds)

   Exposes:
     window.__firstRows -> {cols,rows,src,partial}  first slice, ASAP
     window.__allRows   -> {cols,rows,src}          everything
     window.__prog(cb)  -> progress events (replays the latest immediately)  */
(function(){
var SHEET_ID='1IHUqVvrGcjIESpHaClR9uvmjP3jutcz-ReijMqI7x38';
var SHEET_NAME='Movies';
/* Published CSV of the Movies tab. Derived from the pubhtml link by swapping
   "/pubhtml?" for "/pub?" and adding &output=csv. To re-publish:
   File > Share > Publish to web > "Movies" > CSV.
   NOTE: a published CSV can lag live edits by a few minutes. Edits made from
   this page are applied in memory straight away, so you still see them at
   once; they just take a moment to show up for a hard reload. */
var CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vTNcy_TXkl7kRJvIvf4U_q9pZUCdrJ9RsQ8Vgnr5NoX8K679jUhWC6iWZvbCYR2bOaRG2ypgFB13PEB/pub?gid=0&single=true&output=csv';
window.__CSV_URL=CSV_URL;
/* How many rows to decode before handing the page enough to paint page 1.
   Needs to comfortably exceed the largest page size (72) so the first screen
   is stable; the sheet is maintained newest-first, which is also the default
   sort, so these are exactly the rows page 1 wants. */
var FIRST_ROWS=600;
/* How long to wait for the published CSV to ANSWER (not to finish, and not to
   produce 600 rows) before also waking the live-sheet fallback. Cancelled as
   soon as the response headers arrive, so this only ever expires when the link
   genuinely isn't responding. */
var CSV_OPEN_MS=8000;
/* Once the CSV is streaming, how long a gap between chunks counts as dead. */
var CSV_STALL_MS=20000;
var BASE='https://docs.google.com/spreadsheets/d/'+SHEET_ID
  +'/gviz/tq?headers=1&sheet='+encodeURIComponent(SHEET_NAME);
/* ---- REVALIDATION PROBE ---------------------------------------------------
   The full export is ~11.1MB and is re-downloaded on every visit, even when
   nothing in the sheet has moved. This probe answers "has anything changed?"
   for ~955KB instead.

   WHY THESE FOUR COLUMNS AND NOT MORE
   The page's own change test -- signature(), further down -- has always
   compared exactly Title | Date Added | Viewing Status | Quality. Anything
   else (ratings, runtime, genre, poster URL...) already did NOT count as a
   change: the old code downloaded all 11.1MB, hashed those four fields,
   found them equal, and threw the fresh copy away. So probing precisely
   those four columns is not a weaker test than before -- it is the SAME
   test, asked before the download instead of after it.

   Column letters are fixed for this sheet: B=Title, K=Quality,
   M=Viewing Status, X=Date Added. If the tab's columns are ever reordered
   the letters go stale, so the probe checks the header labels it gets back
   and reports 'changed' if they don't match -- which just falls through to
   the ordinary full download. Every failure mode here costs a download; none
   of them can serve stale data.
   Set REVALIDATE=false to switch this off and always pull the whole sheet. */
var REVALIDATE=true;
var PROBE_COLS='select B,K,M,X';
var PROBE_HEAD=['Title','Quality','Viewing Status','Date Added'];
/* If the probe hasn't answered by now, start the full download anyway rather
   than let a slow gviz hold up a sheet that really has changed. */
var PROBE_GRACE_MS=4000;
var PROBE_URL=BASE+'&tq='+encodeURIComponent(PROBE_COLS)+'&tqx=out:csv';
window.__PROBE_HEAD=PROBE_HEAD;
window.__GVIZ_BASE=BASE;
window.__GVIZ_DISPLAY=BASE;
window.__GVIZ_DESC=BASE+'&tq='+encodeURIComponent('select F');

/* ---- progress hub ---------------------------------------------------------
   The indicator subscribes from the main script, which runs later, so the last
   event is replayed to every new subscriber. */
var subs=[], last=null;
window.__prog=function(cb){ subs.push(cb); if(last){ try{cb(last);}catch(e){} } };
function emit(o){ last=o; for(var i=0;i<subs.length;i++){ try{subs[i](o);}catch(e){} } }
window.__emit=emit;
emit({stage:'connect'});

/* Expected download size, remembered from last visit, so the bar can be a real
   percentage instead of a barber pole. gzip means Content-Length is absent. */
try{ window.__expBytes=+(localStorage.getItem('dd_bytes')||0)||0; }catch(e){ window.__expBytes=0; }

/* ---- one-shot promises --------------------------------------------------- */
function defer(){ var d={}; d.p=new Promise(function(a,b){ d.res=a; d.rej=b; }); return d; }
var first=defer(), all=defer();
window.__firstRows=first.p; window.__allRows=all.p;
/* Nothing else in the page listens for a rejection of __firstRows, so swallow
   it here; the real error surfaces on __allRows. */
first.p.catch(function(){});
var firstDone=false, allDone=false;
function gotFirst(v){ if(!firstDone){ firstDone=true; first.res(v); } }
function gotAll(v){ if(!allDone){ allDone=true; gotFirst(v); all.res(v); } }
function failed(e){ if(allDone) return; allDone=true;
  if(!firstDone){ firstDone=true; first.rej(e); }
  all.rej(e); }

/* ---- incremental RFC-4180 CSV parser ------------------------------------
   Fed arbitrary network chunks. Records that are complete are committed and
   dropped; a partial trailing record is carried over and re-scanned with the
   next chunk (bounded by one row, so it is free). Cells are sliced out in one
   go rather than built a character at a time -- on an 11MB export the
   character-by-character version alone costs seconds in garbage. */
function CsvStream(){ this.buf=''; this.rows=[]; }
CsvStream.prototype.push=function(chunk){
  var s=this.buf+chunk, n=s.length, i=0, start=0, commit=0;
  var cell='', dirty=false, q=false, row=[], rows=this.rows, ch;
  while(i<n){
    ch=s.charCodeAt(i);
    if(q){
      if(ch===34){
        if(s.charCodeAt(i+1)===34){ cell+=s.slice(start,i+1); i+=2; start=i; dirty=true; continue; }
        cell+=s.slice(start,i); q=false; dirty=true; i++; start=i; continue;
      }
      i++; continue;
    }
    if(ch===34){ q=true; dirty=true; i++; start=i; continue; }
    if(ch===44){ row.push(dirty?cell+s.slice(start,i):s.slice(start,i)); cell=''; dirty=false; i++; start=i; continue; }
    if(ch===10||ch===13){
      row.push(dirty?cell+s.slice(start,i):s.slice(start,i)); cell=''; dirty=false;
      if(ch===13 && s.charCodeAt(i+1)===10) i++;
      i++; start=i;
      if(row.length>1||row[0]!=='') rows.push(row);
      row=[]; commit=i;
      continue;
    }
    i++;
  }
  this.buf=s.slice(commit);
  return rows;
};
CsvStream.prototype.end=function(){
  var t=this.buf; this.buf='';
  if(t.length) this.push(t.charCodeAt(t.length-1)===10 ? t : t+'\n');
  return this.rows;
};

/* Guards against the two ways a published link can be wrong: not set at all
   (clear CSV_URL above to go back to reading the live sheet), and published
   from the wrong tab. Either way this rejects and the gviz fallback takes over,
   instead of quietly serving an empty or nonsense collection. */
function checkCols(cols){
  for(var i=0;i<cols.length;i++){ if(String(cols[i]).trim()==='Title') return cols; }
  throw new Error('published CSV has no Title column — is the "Movies" tab the one published?');
}

var csvAbort=null;
function streamCsv(){
  if(!CSV_URL) return Promise.reject(new Error('CSV_URL not set'));
  /* Abortable so that a revalidation which lands AFTER the grace timer has
     already opened the download can still stop it mid-flight instead of
     pulling all 11.1MB it has just proved we don't need. */
  var fo={credentials:'omit'};
  try{ csvAbort=new AbortController(); fo.signal=csvAbort.signal; }catch(e){ csvAbort=null; }
  return fetch(CSV_URL,fo).then(function(r){
    if(!r.ok) throw new Error('CSV HTTP '+r.status);
    /* Headers are back and the status is OK: the published link is ALIVE.
       Everything after this point is just transfer speed, which is not the
       link's fault -- so stand the "is it even there?" deadline down and let
       the stall watchdog take over. Without this, a slow 14MB export was
       reported to the user as an unavailable CSV. */
    clearTimeout(timer);
    armStall();
    var cs=new CsvStream(), cols=null;
    function header(){ if(!cols && cs.rows.length){ cols=checkCols(cs.rows.shift()); } }
    /* No streams (very old browser, or a sandbox that strips response.body):
       fall back to one text() read. Still the fast CDN source. There are no
       chunk events on this path, so the stall watchdog can't apply -- the
       headers already told us the link is fine. */
    if(!r.body||!r.body.getReader){
      clearTimeout(stall);
      return r.text().then(function(txt){
        emit({stage:'download', bytes:txt.length, total:txt.length});
        cs.push(txt); var rows=cs.end(); header();
        if(!cols) throw new Error('empty CSV');
        gotAll({cols:cols, rows:rows, src:'csv'});
      });
    }
    var reader=r.body.getReader(), dec=new TextDecoder('utf-8'), bytes=0;
    return (function pump(){
      return reader.read().then(function(res){
        if(res.done){
          clearTimeout(stall);
          var rows=cs.end(); header();
          if(!cols||!rows.length) throw new Error('empty CSV');
          try{ localStorage.setItem('dd_bytes', String(bytes)); }catch(e){}
          emit({stage:'downloaded', bytes:bytes, rows:rows.length});
          gotAll({cols:cols, rows:rows, src:'csv'});
          return;
        }
        bytes+=res.value.byteLength;
        armStall();                       // data is flowing; reset the watchdog
        cs.push(dec.decode(res.value,{stream:true}));
        header();
        emit({stage:'download', bytes:bytes, total:window.__expBytes, rows:cs.rows.length});
        if(cols && !firstDone && cs.rows.length>=FIRST_ROWS){
          gotFirst({cols:cols, rows:cs.rows.slice(0,FIRST_ROWS), src:'csv', partial:true});
        }
        return pump();
      });
    })();
  });
}

/* ---- gviz fallbacks (flattened to the same {cols,rows} shape) ---- */
function gvizToRaw(json){
  if(json && json.status==='error'){
    throw new Error((json.errors&&json.errors[0]&&json.errors[0].detailed_message)||'sheet returned an error');
  }
  var cols=(json.table.cols||[]).map(function(c){ return (c.label||'').trim(); });
  var src=json.table.rows||[], rows=new Array(src.length);
  for(var r=0;r<src.length;r++){
    var c=src[r].c||[], out=new Array(cols.length);
    for(var i=0;i<cols.length;i++){ var x=c[i]; out[i]=(x==null||x.v==null)?'':x.v; }
    rows[r]=out;
  }
  return {cols:cols, rows:rows, src:'gviz'};
}
function direct(url){
  return fetch(url+'&tqx=out:json').then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(txt){
    return JSON.parse(txt.substring(txt.indexOf('(')+1, txt.lastIndexOf(')')));
  });
}
function jsonp(url){
  return new Promise(function(resolve,reject){
    var cb='__gviz_cb_'+Math.random().toString(36).slice(2);
    var timer=setTimeout(function(){ cleanup(); reject(new Error('timed out')); },30000);
    var script=document.createElement('script');
    function cleanup(){ clearTimeout(timer); delete window[cb]; script.remove(); }
    window[cb]=function(json){ cleanup(); resolve(json); };
    script.src=url+'&tqx=out:json;responseHandler:'+cb;
    script.onerror=function(){ cleanup(); reject(new Error('script blocked or sheet not public')); };
    document.head.appendChild(script);
  });
}
/* Kept on window because loadDescriptions() still uses them. */
window.__gvizDirect=function(u){ return direct(u).then(function(j){ return {type:'gviz', json:j}; }); };
window.__gvizJsonp =function(u){ return jsonp(u).then(function(j){ return {type:'gviz', json:j}; }); };

/* ---- source race --------------------------------------------------------
   The CSV goes first on its own. gviz is only woken if the CSV errors, if the
   link never answers within CSV_OPEN_MS, or if a live stream goes quiet for
   CSV_STALL_MS -- so the normal path costs exactly one request, and a merely
   SLOW download no longer wakes two extra 14MB downloads to compete with it.
   The reason is carried through to the status line so a real outage still
   reads as an outage. */
var pending=0, errs=[], noMore=false, gvizStarted=false, timer=null, stall=null;
function armStall(){
  clearTimeout(stall);
  stall=setTimeout(function(){ if(!allDone) startGviz('stalled'); }, CSV_STALL_MS);
}
var cancelled=false;
function check(){ if(cancelled) return;
  if(noMore && pending===0 && !allDone) failed(new Error(errs.join(' | ')||'no data')); }
function attempt(fn){
  pending++;
  fn().then(function(){ pending--; check(); },
            function(e){
              /* A deliberate abort is not an outage. Without this the abort
                 would land in the error path below and start BOTH gviz
                 fallbacks -- two more full downloads of the sheet we just
                 decided we didn't need. */
              if(cancelled){ pending--; return; }
              var msg=(e&&e.message)||String(e);
              errs.push(msg);
              /* The real reason used to be swallowed unless EVERY source died,
                 which made a genuine outage indistinguishable from a slow
                 network. Always leave a breadcrumb in the console. */
              try{ console.warn('[collection] data source failed:', msg); }catch(x){}
              pending--; startGviz('error'); check();
            });
}
function startGviz(reason){
  if(gvizStarted||allDone||cancelled) return;
  gvizStarted=true; clearTimeout(timer); clearTimeout(stall);
  emit({stage:'fallback', reason:reason||'', msg: errs.length?errs[errs.length-1]:''});
  attempt(function(){ return direct(window.__GVIZ_DISPLAY).then(function(j){ gotAll(gvizToRaw(j)); }); });
  attempt(function(){ return jsonp(window.__GVIZ_DISPLAY).then(function(j){ gotAll(gvizToRaw(j)); }); });
  noMore=true; check();
}
/* The full download is now behind a function so the revalidation probe can
   decide whether it is needed at all. Calling it twice is a no-op. */
var csvStarted=false, graceTimer=null;
function beginCsv(){
  if(csvStarted) return;
  csvStarted=true; clearTimeout(graceTimer);
  attempt(streamCsv);
  if(!CSV_URL) startGviz('nocsv');
  else timer=setTimeout(function(){ startGviz('slow'); }, CSV_OPEN_MS);
}
window.__startCsv=beginCsv;
/* Called by init() once revalidation has proved the sheet is unchanged: stop
   anything already in flight and make sure nothing starts it afterwards. */
window.__cancelCsv=function(){
  cancelled=true;
  clearTimeout(graceTimer); clearTimeout(timer); clearTimeout(stall);
  csvStarted=true;
  try{ if(csvAbort) csvAbort.abort(); }catch(e){}
};

/* Is there likely to be a cache worth revalidating against? The real answer
   lives in IndexedDB, which is async and which we do not want to wait on
   here -- so cacheSet() also drops a timestamp in localStorage, which reads
   synchronously in microseconds. Being wrong is cheap in both directions:
   a false positive costs the probe and then starts the download anyway, and
   a false negative just behaves exactly like the old code. */
var cacheFresh=false;
try{
  var ct=+(localStorage.getItem('dd_cache_t')||0);
  cacheFresh = ct>0 && (Date.now()-ct) < 24*60*60*1000;
}catch(e){}

window.__probe=null;
function startProbe(){
  emit({stage:'revalidate'});
  window.__probe=fetch(PROBE_URL,{credentials:'omit'}).then(function(r){
    if(!r.ok) throw new Error('probe HTTP '+r.status);
    return r.text();
  }).then(function(txt){
    var cs=new CsvStream(); cs.push(txt);
    var rows=cs.end(), head=rows.shift()||[];
    for(var i=0;i<PROBE_HEAD.length;i++){
      if(String(head[i]==null?'':head[i]).trim()!==PROBE_HEAD[i]){
        throw new Error('probe columns moved (expected "'+PROBE_HEAD.join('", "')
          +'", got "'+head.join('", "')+'")');
      }
    }
    /* The probe has answered, so the grace timer has nothing left to guard
       against -- from here the decision belongs to init(), which will call
       either __startCsv() (changed) or __cancelCsv() (unchanged). Leaving it
       armed was starting the full download ~4s later even on visits that had
       already proved it was unnecessary. */
    clearTimeout(graceTimer);
    return rows;
  }).catch(function(e){
    try{ console.warn('[collection] revalidation probe unavailable:', (e&&e.message)||e); }catch(x){}
    beginCsv();          // probe is no help -- fall back to the old behaviour
    return null;
  });
}

/* A usable snapshot counts as a warm cache for this decision. Without the
   __SNAP arm, a first visit would see cacheFresh===false and start the full
   3.45MB export in parallel with the snapshot it is about to paint from --
   which is the exact download this whole change exists to avoid. init()
   still has the final say: it calls __startCsv() if the snapshot turns out
   not to have arrived, and __cancelCsv() once the probe says nothing moved. */
if(REVALIDATE && (cacheFresh || window.__SNAP) && CSV_URL){
  startProbe();
  graceTimer=setTimeout(beginCsv, PROBE_GRACE_MS);
}else{
  beginCsv();
}

/* ---- poster route probe -------------------------------------------------
   Every Vudu cover is currently routed through an image CDN because Vudu is
   blocked on some networks. When it ISN'T blocked, that hop is pure latency on
   all 60 covers. So: fire one direct request now, in parallel with the data
   download (it finishes long before the sheet does, for free). Direct URLs are
   only used if that probe positively succeeds -- if it fails, or hasn't
   answered by the time the grid renders, the proxy chain is used exactly as
   before. Any individual cover that still fails walks the same fallback chain.
   Set POSTER_PROBE=false below to switch this off entirely. */
var POSTER_PROBE=true;
var PROBE_URL='https://images2.vudu.com/poster2/4517755-l';
window.__directOk=new Promise(function(res){
  if(!POSTER_PROBE) return res(false);
  var cached=null; try{ cached=sessionStorage.getItem('dd_direct'); }catch(e){}
  if(cached==='1') return res(true);
  if(cached==='0') return res(false);
  var img=new Image(), done=false;
  var t=setTimeout(function(){ finish(false); },2500);
  function finish(v){
    if(done) return; done=true; clearTimeout(t);
    try{ sessionStorage.setItem('dd_direct', v?'1':'0'); }catch(e){}
    res(v);
  }
  img.onload=function(){ finish(img.naturalWidth>0); };
  img.onerror=function(){ finish(false); };
  img.src=PROBE_URL;
});
})();
</script>

/* The sheet spells some people more than one way -- "Shauna Macdonald" and
   "Shauna MacDonald", "D.B. Sweeney" and "D. B. Sweeney", "Chow Yun-Fat" and
   "Chow Yun-fat". Left alone each spelling is its own entry in the Actors list
   holding its own subset of the films, so intersecting two of them returns
   nothing and a person's filmography is split in half.
   The fold is deliberately narrow -- case, accents, and the punctuation that
   separates name parts (. - ') -- because that is the whole of the
   disagreement this collection contains. It runs on every CSV column, but only
   the people columns have anything to fold: genres, studios, services, awards
   and view status collide under no rule at all, so nothing there moves.
   Slashes and "+" are deliberately left alone so that a future "Disney+" can
   never fold into "Disney". */
const FOLD=new Map();
function foldKey(s){
let k=FOLD.get(s);
if(k!==undefined) return k;
let t=s;
// normalize() is the expensive part here and most names never need it.
if(/[^\x00-\x7F]/.test(t)) t=t.normalize('NFD').replace(/[̀-ͯ]/g,'');
k=t.toLowerCase().replace(/[.\-'’]+/g,' ').replace(/\s+/g,' ').trim();
FOLD.set(s,k);
return k;
}
const CANON=new Map();   // folded key -> the one spelling everything displays
const splitCsv=s=>{
const out=[], seen=new Set();
for(const part of String(s??'').split(',')){
const v=part.trim();
if(!v) continue;
const disp=CANON.get(foldKey(v)) || v;
// Folding can leave the same person on a row twice; count them once.
if(seen.has(disp)) continue;
seen.add(disp); out.push(disp);
}
return out;
};
/* Which spelling wins is decided by the collection, not by whichever row
   happened to parse first: the one the sheet uses most often. "D.B. Sweeney"
   appears on 19 titles and "D. B. Sweeney" on one, so the 19 win. Ties fall
   back to the tidier-looking form. */
const CANON_FIELDS=['director','actors','genre','whereWatch','highQ','awards','viewStatus'];
const accents=s=>(s.match(/[^\x00-\x7F]/g)||[]).length;
function tidier(a,b){
const ca=/^\p{Lu}/u.test(a), cb=/^\p{Lu}/u.test(b);
if(ca!==cb) return ca?a:b;                 // "Kate Winslet" over "kate Winslet"
const aa=accents(a), ab=accents(b);
if(aa!==ab) return aa>ab?a:b;              // "Paul Hébert" over "Paul Hebert"
if(a.length!==b.length) return a.length>b.length?a:b;
return a<b?a:b;                            // stable, so a reload cannot flip it
}
/* Rows parsed before the winner was known still hold their own spelling, so
   the arrays are swept once the whole sheet is in. Without this both spellings
   survive side by side and the fold buys nothing. */
function canonicalizeRows(list){
const tally=new Map();                     // folded key -> Map(spelling -> rows)
for(let i=0;i<list.length;i++){
const m=list[i];
for(let f=0;f<CANON_FIELDS.length;f++){
const a=m[CANON_FIELDS[f]];
if(!a) continue;
for(let j=0;j<a.length;j++){
const k=foldKey(a[j]);
if(!k) continue;
let by=tally.get(k);
if(!by){ by=new Map(); tally.set(k,by); }
by.set(a[j],(by.get(a[j])||0)+1);
}
}
}
for(const [k,by] of tally){
if(by.size===1){ CANON.set(k, by.keys().next().value); continue; }
let best=null, bestN=-1;
for(const [v,n] of by){
if(n>bestN || (n===bestN && tidier(v,best)===v)){ best=v; bestN=n; }
}
CANON.set(k,best);
}
for(let i=0;i<list.length;i++){
const m=list[i];
for(let f=0;f<CANON_FIELDS.length;f++){
const a=m[CANON_FIELDS[f]];
if(!a) continue;
let dirty=false;
for(let j=0;j<a.length;j++){
const c=CANON.get(foldKey(a[j]));
if(c!==undefined && c!==a[j]){ a[j]=c; dirty=true; }
}
// Only a rewritten row can have gained a duplicate.
if(dirty && new Set(a).size!==a.length) m[CANON_FIELDS[f]]=[...new Set(a)];
}
}
}
/* Places a fixed-position floating element (the edit modal, the description
   popover) with its top-left near (x,y) -- normally right where the user just
   clicked -- then nudges it back on-screen if that would run it off an edge.
   Measures the element's real rendered size first rather than guessing, so it
   works regardless of content length. */
function positionFloating(el, x, y, margin=12){
el.style.left='0px'; el.style.top='0px';
const r=el.getBoundingClientRect();
let left=x, top=y;
if(left + r.width + margin > window.innerWidth) left = window.innerWidth - r.width - margin;
if(top + r.height + margin > window.innerHeight) top = window.innerHeight - r.height - margin;
if(left < margin) left = margin;
if(top < margin) top = margin;
el.style.left = left+'px';
el.style.top = top+'px';
}

/* ---------- TOP PROGRESS BAR ----------
The bar is already on screen (it is in the static HTML, styled by the critical
CSS block), so this only has to drive it. Indeterminate until there is a real
percentage to show; the expected download size is remembered from the previous
visit, because gzipped responses carry no Content-Length. */
const topbarEl=$('#topbar'), barFill=$('#topfill');
let barPct=0;
function setBar(p){
if(p==null){ topbarEl.classList.add('indet'); return; }
p=Math.max(0,Math.min(1,p));
if(p<barPct) return;              // never let the bar run backwards
barPct=p;
topbarEl.classList.remove('indet');
barFill.style.width=(p*100).toFixed(1)+'%';
}
function barDone(){
topbarEl.classList.remove('indet');
barFill.style.width='100%';
topbarEl.classList.add('done');
}

const fmtN  = n => n.toLocaleString();
// Bar budget: download is the bulk of the wait, so it owns 0-70%; parsing and
// indexing share the rest.
function progressFromLoader(o){
if(o.stage==='connect'){ setStatus('Connecting to the collection…'); setBar(null); }
else if(o.stage==='download'){
setStatus('Loading collection… '+fmtMB(o.bytes)+(o.rows?' · '+fmtN(o.rows)+' titles':''));
setBar(o.total ? Math.min(0.70, o.bytes/o.total*0.70) : null);
}
else if(o.stage==='revalidate'){ setStatus('Checking the sheet for changes…'); setBar(0.45); }
else if(o.stage==='downloaded'){ setStatus('Loaded '+fmtN(o.rows)+' titles — indexing…'); setBar(0.72); }
else if(o.stage==='fallback'){
// The fallback now says WHY it fired. Only 'error' means the published link
// itself is at fault; 'slow' and 'stalled' are network conditions, and
// blaming the link for those is what made this message so misleading.
const why=o.reason||'';
const detail=o.msg ? ' <span style="opacity:.7">('+esc(o.msg)+')</span>' : '';
setStatus(
why==='error'   ? 'Published CSV unavailable'+detail+' — trying the live sheet…' :
why==='stalled' ? 'Published CSV stopped responding — also trying the live sheet…' :
why==='nocsv'   ? 'Reading the live sheet…' :

/* ---------- POSTER PROXYING ----------
Vudu posters are blocked outright on some networks, so they go through an
image proxy. The chain used to be walked for EVERY poster, and each miss
cost a full round-trip before the next was tried. Now the first proxy that
returns an image is remembered and every later poster starts there.
Order below is YOUR original tested order -- statically.io first. Reorder it
if the poster test shows a different one is faster on your network.
Two things this handles that the first version got wrong:
- the walk WRAPS AROUND, so a poster starting at proxy 2 still gets to try
0 and 1 rather than giving up at the end of the list;
- a failure at the remembered proxy releases the lock, so one bad
remembered choice can't strand every cover for the whole session. */
const stripScheme = u => u.replace(/^https?:\/\//,'');
const PROXY_W = 300; // width requested from the proxy
const VUDU_PROXIES = [
u => 'https://cdn.statically.io/img/' + stripScheme(u) + '?w=' + PROXY_W,
u => 'https://i0.wp.com/' + stripScheme(u) + '?w=' + PROXY_W,
u => 'https://wsrv.nl/?w=' + PROXY_W + '&url=' + encodeURIComponent(u),
u => 'https://images1-focus-opensocial.googleusercontent.com/gadgets/proxy?container=focus&resize_w=' + PROXY_W + '&url=' + encodeURIComponent(u),
];
const NPROXY = VUDU_PROXIES.length;
const isVudu = u => /vudu\.com/i.test(u);
let proxyIdx=0, proxyLocked=false;
try{
const saved=sessionStorage.getItem('dd_proxy');
if(saved!==null && +saved>=0 && +saved<NPROXY){ proxyIdx=+saved; proxyLocked=true; }
}catch(e){}
function lockProxy(i){
proxyIdx=i; proxyLocked=true;
try{ sessionStorage.setItem('dd_proxy', String(i)); }catch(e){}
}
function unlockProxy(){
proxyLocked=false;
try{ sessionStorage.removeItem('dd_proxy'); }catch(e){}
}
/* Direct-route probe. Resolved by the early loader in <head>, in parallel with
the data download, so it has almost always settled before the grid renders. It
is only ever allowed to make things faster: direct URLs are used ONLY on a
positive result, and a direct cover that fails still walks the full proxy chain
below. `null` = not answered yet, treat as "use the proxy". */
let directOk=null;
window.__directOk.then(v=>{ directOk=v; });
// data-pidx = which proxy this <img> is using.
//   >= 0  index into VUDU_PROXIES
//    -1   a direct, non-Vudu URL
//    -2   a direct Vudu URL (probe said the network allows it)
// data-n = how many routes have been tried for this cover so far.
const proxied = u => VUDU_PROXIES[proxyIdx](u);
const firstSrc = u => !u ? '' : (isVudu(u) ? (directOk===true ? u : proxied(u)) : u);
const firstIdx = u => (u && isVudu(u)) ? (directOk===true ? -2 : proxyIdx) : -1;
function posterOk(img){
const p=+(img.getAttribute('data-pidx'));
// Only a real proxy index is worth remembering. The old version's condition
// parsed as (p>=0 && p!==proxyIdx) || !proxyLocked, so a direct URL loading
// first could lockProxy(-1) -- after which VUDU_PROXIES[-1] is undefined and
// every remaining Vudu cover on the page threw instead of loading.
if(p>=0 && (!proxyLocked || p!==proxyIdx)) lockProxy(p);
}
function posterError(img){
const orig=img.getAttribute('data-src')||'';
const n=(+(img.getAttribute('data-n')||'0'))+1;
let pidx=+(img.getAttribute('data-pidx'));
if(pidx===-2){
// Direct Vudu route failed after the probe said it would work (blocked
// mid-session, or this one poster is genuinely gone). Stand the whole
// session's direct routing down and hand this cover to the proxy chain.
directOk=false;
try{ sessionStorage.setItem('dd_direct','0'); }catch(e){}
img.setAttribute('data-pidx',proxyIdx);
img.setAttribute('data-n',n);
img.src=proxied(orig);
return;
}
if(!isVudu(orig)){
// Direct URL failed once: try wsrv, then give up.
if(n<2){
img.setAttribute('data-n',n);
img.src='https://wsrv.nl/?w='+PROXY_W+'&url='+encodeURIComponent(orig);
return;
}
}else if(n<NPROXY){
if(pidx===proxyIdx) unlockProxy(); // the remembered choice just failed
pidx=(pidx+1)%NPROXY; // wrap around instead of running out
img.setAttribute('data-pidx',pidx);
img.setAttribute('data-n',n);
img.src=VUDU_PROXIES[pidx](orig);
return;
}
const p=img.parentNode, t=(img.alt||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---------- PARSE ----------
Consumes the flat {cols, rows} shape the loader produces. Both sources -- the
streamed CSV and the gviz fallbacks -- are flattened to that same shape up
there, so there is now ONE parser instead of two code paths.
The old version wrapped every cell in a {v:...} object on the way from CSV to
the gviz shape: 18,883 rows x 24 columns = ~450,000 throwaway objects before a
single movie was built. Rows are read straight out of the string arrays now.
Only the fields the grid needs are computed here. The comma-splitting for seven
facet columns and the search index (another ~11MB of strings) are deferred to
enrich(), which runs after the first paint. */
let COLIDX=null;
function mapCols(cols){

for(let i=0;i<cols.length;i++){ const k=COLMAP[String(cols[i]).trim()]; if(k && idx[k]==null) idx[k]=i; }

const RE_YMD=/^(\d{4})-(\d{1,2})-(\d{1,2})/, RE_MDY=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/;

if(v==null||v==='') return null;
if(typeof v==='number') return v>1e11?v:null;      // already epoch ms
const str=String(v); let m;
if(str.charCodeAt(0)===68 && str.startsWith('Date(')){
const q=str.slice(5,-1).split(',');
return new Date(+q[0], +q[1]||0, +q[2]||1).getTime();
}
if((m=RE_YMD.exec(str))) return new Date(+m[1], +m[2]-1, +m[3]).getTime();
if((m=RE_MDY.exec(str))) return new Date(+m[3], +m[1]-1, +m[2]).getTime();
const d=new Date(str); return isNaN(d)?null:d.getTime();
}

/* Builds the whole collection in idle slices, so the first page of covers --

function parseAllSliced(cols, rows, onProgress){
return new Promise((resolve,reject)=>{

function enrichRow(m){

function enrich(){
return new Promise(resolve=>{

// each slice comfortably under one frame.

/* Wrapped like every other sessionStorage call in this file. Unguarded, a
   browser with site data blocked throws here at parse-run time and takes the
   whole rest of the script with it -- including the grid -- over a token that
   only the owner ever uses. */
let sessionToken='';
try{ sessionToken = sessionStorage.getItem('dd_token') || ''; }catch(e){}
function jsonpSave(payload){
return new Promise((resolve,reject)=>{
const cb='__save_cb_'+Math.random().toString(36).slice(2);
const timer=setTimeout(()=>{ cleanup(); reject(new Error('save timed out')); },30000);
function cleanup(){ clearTimeout(timer); delete window[cb]; tag.remove(); }
window[cb]=d=>{ cleanup(); resolve(d); };
const tag=document.createElement('script');
tag.src=APPS_SCRIPT_URL+'?callback='+cb+'&payload='+encodeURIComponent(JSON.stringify(payload));
tag.onerror=()=>{ cleanup(); reject(new Error('request blocked — check the Apps Script is deployed with access set to "Anyone"')); };
document.head.appendChild(tag);
});
}
async function saveToSheet(payload){
try{
const res=await fetch(APPS_SCRIPT_URL,{
method:'POST',
headers:{'Content-Type':'text/plain;charset=utf-8'},
body:JSON.stringify(payload)
});
return await res.json();
}catch(e){
return await jsonpSave(payload); // sandbox blocked the POST — go around it
}
}

   Replaces the old description popover. The ⓘ on a poster opens a full-width
   bar between the pager and the wall carrying the title (COLUMN C, Sort
   Title -- column B is the padded sort key, "00028 Days Later"), the
   description, and the director and cast as clickable headshot tiles. It is
   NOT a modal: nothing behind it is blocked, and it closes on its ✕, on Esc,
   or on a second click of the same ⓘ. Clicking outside deliberately does not
   close it -- you are meant to be able to work the filters and the pager with
   the bar still open.

   Descriptions load lazily (see loadDescriptions), so a click that lands
   before they arrive shows a loading line and is filled in below. */

/* Director/Actors are split into arrays by enrich(), which runs after the
   first paint. A click that lands before that gets the raw cell split on the
   spot rather than an empty cast list. */
function peopleOf(m,key){
const a=m[key];
if(a) return a;
return splitCsv(key==='director'?m.directorRaw:m.actorsRaw);
}

/* "3 titles" under a face = how many rows in the whole collection that person
   is on, which is exactly what buildFacetValues() has already counted. Read
   from there when it's built, walking the collection only in the window
   before it is. facetTotals[key] holds the whole-collection counts -- facetValues
is re-counted off the visible rows now, which is the wrong number for a face --
and is replaced wholesale on every rebuild, so
   holding the array itself is a sufficient cache key. */
const personCounts={};
function titleCount(name,key){
const fv=facetTotals[key];
if(fv && fv.length){
if(!personCounts[key] || personCounts[key].src!==fv) personCounts[key]={src:fv, map:new Map(fv)};
return personCounts[key].map.get(name)||0;
}
let n=0;
for(const m of movies) if(peopleOf(m,key).includes(name)) n++;
return n;
}

function personTile(name,key){
const url=knownHead(name);
const face=url?`<img src="${esc(url)}" decoding="async" loading="lazy" alt="">`:esc(initials(name));
const n=titleCount(name,key);
return `<div class="brow${selected[key].has(name)?' active':''}" data-name="${esc(name)}" data-pkey="${key}"
title="Show ${esc(name)}&#39;s titles">
<div class="face" data-face="${esc(name)}">${face}</div>
<div class="who">${esc(name)}</div>
<div class="n">${n.toLocaleString()} title${n===1?'':'s'}</div></div>`;
}

/* ---------- HEADSHOTS ----------
   Lifted from the Data page, including its localStorage key: a visitor who
   has been to /data already has most of these faces cached, and faces
   resolved here warm that page in return. Names are looked up by exact
   article title, 50 per request, which is one call for a whole cast. */
const WIKI_API='https://en.wikipedia.org/w/api.php';
const HEAD_BATCH=50;
const headCache=new Map();
let headStore={};
try{ headStore=JSON.parse(localStorage.getItem('dd_heads2')||'{}'); }catch(e){}
let headSaveTimer=null;
function saveHeadStore(){
clearTimeout(headSaveTimer);
headSaveTimer=setTimeout(()=>{ try{ localStorage.setItem('dd_heads2',JSON.stringify(headStore)); }catch(e){} },800);
}
function initials(name){ return name.split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase(); }
function knownHead(name){
const c=headCache.get(name); if(c) return c;
if(headStore[name]){ headCache.set(name,headStore[name]); return headStore[name]; }
return null;
}
function wikiBatch(titles){
const url=WIKI_API+'?action=query&format=json&origin=*&redirects=1'
+'&prop=pageimages&piprop=thumbnail&pithumbsize=320&pilimit='+HEAD_BATCH
+'&titles='+encodeURIComponent(titles.join('|'));
return fetch(url).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }).then(j=>{
const q=j.query||{}, alias=new Map(), out=new Map();
// Map what we asked for back through normalisation and redirects to the
// title the API actually answered under.
(q.normalized||[]).forEach(n=>alias.set(n.to,n.from));
(q.redirects||[]).forEach(rd=>alias.set(rd.to, alias.get(rd.from)||rd.from));
const pages=q.pages||{};
for(const k in pages){
const p=pages[k]; if(!p||!p.title) continue;
const asked=alias.get(p.title)||p.title;
if(p.thumbnail&&p.thumbnail.source) out.set(asked,p.thumbnail.source);
}
return out;
});
}
async function resolveHeads(names){
// null in the cache means "asked for, no article" -- still a hit, so it is
// never asked for twice.
const want=[...new Set(names)].filter(n=>n && !knownHead(n) && !headCache.has(n));
if(!want.length) return;
want.forEach(n=>headCache.set(n,null));
for(let i=0;i<want.length;i+=HEAD_BATCH){
const chunk=want.slice(i,i+HEAD_BATCH);
let got=new Map();
try{ got=await wikiBatch(chunk); }catch(e){ /* those names keep their initials */ }
chunk.forEach(n=>{ const u=got.get(n); if(u) applyHead(n,u); });
}
}
function applyHead(name,url){
headCache.set(name,url); headStore[name]=url; saveHeadStore();
document.querySelectorAll('.face').forEach(f=>{
if(f.dataset.face===name && !f.querySelector('img')){
// Decoded off-document first, so a face that 404s just keeps its initials
// instead of leaving a broken-image box in the bar.
const img=new Image();
img.decoding='async'; img.alt='';
img.onload=()=>{ if(f.isConnected && !f.querySelector('img')){ f.textContent=''; f.appendChild(img); } };
img.src=url;
}
});
}

/* ---------- DESCRIPTIONS (lazy second request) ----------
Same tab, same row order, no WHERE clause — so the Nth returned row is the
Nth row of the display request. Merged by position against sheetRow. */
async function loadDescriptions(){
if(DESCRIPTIONS==='never' || descriptionsLoaded) return;
/* Prefer the snapshot's description tier: it is a static, immutable CDN file,
   whereas __GVIZ_DESC below is another multi-megabyte query against the live
   sheet. Both return one entry per sheet row in sheet order, so the
   merge-by-position is identical either way. */
if(window.__snapDesc){
try{
const rows=await window.__snapDesc();
for(let ri=0;ri<rows.length;ri++){
const m=rowIndex.get(ri+2);
if(m) m.desc=rows[ri]||'';
}
descriptionsLoaded=true;
if(enriched) rebuildSearchIndex();
return;
}catch(e){
console.warn('[collection] snapshot descriptions unavailable, trying live sheet:', e && e.message);
}
}
try{
const url=window.__GVIZ_DESC;
const d=await Promise.any([window.__gvizDirect(url), window.__gvizJsonp(url)]);
const rows=d.json.table.rows||[];
rows.forEach((r,ri)=>{
const m=rowIndex.get(ri+2);
if(!m) return;
const c=r.c && r.c[0];
m.desc = c && c.v!=null ? String(c.v) : '';
});
descriptionsLoaded=true;
if(enriched) rebuildSearchIndex();
}catch(e){
// Search simply stays limited to title/director/actors/genre.
console.warn('[collection] descriptions unavailable:', e && e.message);
}
}
/* ---------- INIT ----------
Staged, so that something useful is on screen at every point:
  0 ms    static shell + top progress bar + placeholder tiles (needs no JS)
  ~30 ms  cached collection, if this browser has one -> complete grid at once
  ~400 ms first ~600 streamed rows -> page 1 renders, POSTERS START LOADING
  ~2-4 s  the rest of the sheet lands and is parsed in idle slices
  then    facets + sliders built, search index built, cache written
The old version had exactly one stage: wait for every byte of the sheet, parse
all of it, sort all of it, and only then write the first <img>. That is why the
page sat there looking static for ~10s -- the covers could not even be
requested until all of that was done. Nothing has been dropped; the same work
still happens, just no longer in front of the posters. */
(async function init(){
const t0=performance.now();
let cachedSig=null, painted=false;
const paint=(soft)=>{
// Built with a plain loop. new Map(movies.map(...)) allocated a 19,000-entry
// array of 19,000 two-element arrays first, and paint() runs up to four times
// during startup.
rowIndex=new Map();
for(let i=0;i<movies.length;i++) rowIndex.set(movies[i].sheetRow, movies[i]);
syncPerPage();
applyFilters(true, soft);
painted=true;
};
// Everything the sidebar needs, off the critical path.
const buildSidebar=()=>idle(()=>{
buildFacetValues();
buildSliders();
buildFacets();
$('#sidebar').classList.remove('pending');
});
try{
// 1a. The small head record: page 1 straight out of IndexedDB, before the
//     full cache (let alone the network) has been touched.
const head=await cacheGet('head');
if(head){
movies=head.d;
partialData=true;
paint();
setStatus('Loading the rest of the collection…'); setBar(0.35);
}
// 1b. The full cached copy.
const rec=await cacheGet();
if(rec){
movies=rec.d;
cachedSig=rec.sig;
descriptionsLoaded = !!rec.hasDesc || DESCRIPTIONS==='never';
partialData=false;
paint(true);   // soft: the head record already put these very covers on screen
setStatus('Checking for changes…'); setBar(0.55);
await enrich();
buildSidebar();
}
/* 1b-bis. NO IndexedDB CACHE -> fall back to the Netlify snapshot.
   This is the first-visit path, and it is the one that was slow: with no
   cache there was nothing to paint and nothing to revalidate against, so the
   page had no choice but to pull the whole 3.45MB export from Google before
   it could request a single cover.

   The snapshot is the same collection at ~589KB from an immutable CDN URL, so
   a browser that has never seen this site still gets to start from a complete
   grid. From here on it is treated EXACTLY like a cache hit -- same paint,
   same signature, same probe, same catch-up -- because signature() only
   fingerprints Title/Date Added/Viewing Status/Quality, all of which are in
   the core tier. Nothing below this block needed to change. */
let snapUsed=false;
if(!rec && window.__snapCore){
try{
const snap=await window.__snapCore;
const built=await parseAllSliced(snap.cols, snap.rows, (i,n)=>setBar(0.20+0.30*(i/n)));
if(built.length){
movies=built;
partialData=false;
// The snapshot's core tier deliberately carries no Description, and its
// Director/Actors arrive separately below -- so this is not a "has
// descriptions" state and must not be cached as one.
descriptionsLoaded=false;
cachedSig=signature(movies);
snapUsed=true;
paint();
setStatus('Checking for changes…'); setBar(0.55);
/* Director and Actors ride in the second tier. enrich() builds the search
   index and buildSidebar() builds the facet lists, and both read those two
   fields -- so they are patched in first, by sheet position rather than by
   array index, because parseRows() drops blank rows and the two sequences
   are therefore not aligned. */
try{
const fac=await window.__snapFacets;
for(const m of movies){
const f=fac[m.sheetRow-2];
if(f){ m.directorRaw=f['Director']||''; m.actorsRaw=f['Actors']||''; }
}
}catch(e){
// Facets missing just means those two panels start empty; the live
// catch-up below fills them in when the sheet download lands.
console.warn('[collection] snapshot facets unavailable:', e && e.message);
}
await enrich();
buildSidebar();
}
}catch(e){
// Snapshot is an optimisation, never a dependency. Falling through here
// leaves cachedSig null, which makes the revalidate step below call
// __startCsv() -- i.e. exactly the behaviour from before it existed.
console.warn('[collection] snapshot unavailable, using live sheet:', e && e.message);
}
}
/* 1c. REVALIDATE.
   At this point the grid is already painted from the cache. The old code went
   straight on to pull all 11.1MB purely to find out whether any of it was
   different -- and on the overwhelmingly common "nothing changed" visit, threw
   the whole download away again (see the `unchanged` branch below).

   The probe answers that same question for ~955KB, using exactly the four
   columns signature() has always compared. Three outcomes:
     match      -> the sheet is unchanged; the download is never started at all
     mismatch   -> start the full download and carry on exactly as before
     no answer  -> ditto; the probe never gets to decide anything on its own */
let revalidated=false;
if(window.__probe){
if(!cachedSig){
// localStorage said there was a cache but IndexedDB disagreed (cleared, private
// mode, quota). Nothing to compare against, so stop waiting and just download.
window.__startCsv();
}else{
const probeRows=await window.__probe;
if(probeRows){
const probeSig=probeSigFromRows(probeRows);
const localSig=probeSigFromMovies(movies);
revalidated = probeSig===localSig;
console.info('[collection] revalidation: '+(revalidated?'unchanged':'CHANGED')
  +' (sheet '+probeSig+' vs cached '+localSig+')');
}
if(!revalidated) window.__startCsv();
}
}

if(revalidated){
// Unchanged: the painted grid is already correct and complete. Stop the full
// export if the grace timer managed to open it while the probe was still in
// the air, and make sure nothing can start it after this point.
window.__cancelCsv();
if(!descriptionsLoaded) await loadDescriptions();
// Re-stamp the cache so a collection that is simply not changing doesn't
// expire out from under the 24h TTL and force a cold download anyway.
idle(()=>cacheSet(movies, cachedSig, descriptionsLoaded));
barDone(); setStatus(null);
console.info(`[collection] ${movies.length} titles in ${Math.round(performance.now()-t0)}ms`
  + ` (source: cache + revalidation probe, full download skipped,`
  + ` posters: ${directOk===true?'direct':'proxy '+proxyIdx})`);
return;
}

// 2. First slice of the live sheet. This is the change that moves the needle:
//    page 1 is rendered from the first rows off the wire, so the browser starts
//    pulling covers while the other ~11MB is still arriving. The sheet is kept
//    newest-first, which is also the default sort, so these are the rows page 1
//    actually wants. Skipped when the cache already painted a full grid.
if(!painted){
try{
const head=await window.__firstRows;
if(head.partial){
partialData=true;
movies=parseRows(head.cols, head.rows, 0, head.rows.length, []);
paint();
}
}catch(e){ /* the real failure surfaces on __allRows, just below */ }
}
// 3. The whole sheet.
const d=await window.__allRows;
setStatus('Indexing '+d.rows.length.toLocaleString()+' rows…');
const fresh=await parseAllSliced(d.cols, d.rows, (i,n)=>setBar(0.72+0.08*(i/n)));
if(!fresh.length) throw new Error('no rows returned');
const hasDesc = d.src==='csv' || DESCRIPTIONS==='eager';
partialData=false;
// signature() walks every row, so it is only computed when there is actually a
// cached fingerprint to compare it against.
let freshSig=null;
const unchanged = !!cachedSig && descriptionsLoaded && (freshSig=signature(fresh))===cachedSig;
if(unchanged){
// Nothing changed — leave the painted grid alone, just refresh the pager.
renderPage({ifChanged:true});
}else{
movies=fresh;
enriched=false;
descriptionsLoaded=hasDesc;
// Soft render: if the streamed first page and the final first page hold the
// same covers (the normal case), the <img> tags are left exactly as they are
// rather than being rewritten, so posters already half-downloaded are kept.
paint(true);
await enrich();
buildSidebar();
}
// 4. Descriptions, if they weren't in the payload.
if(!descriptionsLoaded) await loadDescriptions();
idle(()=>{
if(freshSig===null) freshSig=signature(movies);
cacheSet(movies, freshSig, descriptionsLoaded);
});
barDone(); setStatus(null);
console.info(`[collection] ${movies.length} titles in ${Math.round(performance.now()-t0)}ms`
+ ` (source: ${d.src}, cache: ${cachedSig?(unchanged?'hit':'stale'):'miss'},`
+ ` posters: ${directOk===true?'direct':'proxy '+proxyIdx},`
+ ` urls: ${FIX_POSTER_SUFFIX?'rewritten':'as-stored'})`);
}catch(err){
barDone();
if(movies.length){
partialData=false;
renderPage();
setStatus('Showing the collection that loaded — refresh failed', false, true);
}else{
setStatus('Could not load the sheet.<br><small>'
+'1. Check the published CSV link at the top of this embed is still live:<br>'
+'&nbsp;&nbsp;&nbsp;&nbsp;in the Sheet, File &rarr; Share &rarr; Publish to web &rarr; &ldquo;Movies&rdquo; tab &rarr; CSV.<br>'
+'2. Check the spreadsheet is also shared as &ldquo;Anyone with the link &ndash; Viewer&rdquo;,<br>'
+'&nbsp;&nbsp;&nbsp;&nbsp;which is what the live-sheet fallback needs.<br>'
+'<span style="color:#607d8b">('+esc(err.message)+')</span></small>', false, true);
}
}
})();
</script>
</body>
</html>
