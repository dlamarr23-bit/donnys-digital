<!-- ===================================================================
     POSTER ROUTING -- runs before anything else in the page.

     Rewrites the src of every <img>, now and as the grid renders more, to
     load through this domain via this site's own /img proxy instead of straight
     from the image host.

     Two reasons, in order of how much they matter:

     1. Networks that filter on hostname (a work network, some ISPs) block
        images2.vudu.com outright, and the fallback proxies the pages walk
        through -- cdn.statically.io, i0.wp.com, wsrv.nl -- are separate
        hostnames that can be blocked just as easily. Routed through here
        the browser only ever connects to this site, so there is nothing
        for a host-based filter to match. (Confirmed working on a network
        that was blocking Vudu.)

     2. Resizing: this USED to also re-encode, when the proxy was Netlify's
        Image CDN -- a poster arrived as ~10KB of webp instead of ~40KB of
        source jpeg. On Cloudflare Pages there is no image-processing step,
        so the &w= and &fm= below are sent and ignored, and posters arrive
        at their original size and format. See README.md "Posters".

     The host allowlist lives in functions/img.js -- a URL whose host is not
     on that list is refused, so add the host there before pointing anything
     new at it. (It used to be [images] remote_images in netlify.toml, which
     Cloudflare does not read.)
     =================================================================== -->
<script>
(function () {
  var PROXY  = "/img";
  var WIDTH  = 300;      // poster cards render ~150px wide; 300 covers retina
  var FORMAT = "webp";   // smaller than the source jpg

  function proxied(u) {
    if (!u) return u;
    u = String(u).trim();
    if (!/^(https?:)?\/\//i.test(u)) return u;              // relative -> leave alone
    if (u.indexOf(PROXY + "?url=") === 0) return u;         // already proxied
    if (u.indexOf("//" + location.host) !== -1) return u;   // same-site -> leave alone
    if (u.slice(0, 2) === "//") u = "https:" + u;
    else if (u.slice(0, 5).toLowerCase() === "http:") u = "https:" + u.slice(5);
    return PROXY + "?url=" + encodeURIComponent(u) + "&w=" + WIDTH + "&fm=" + FORMAT;
  }

  function fix(el) {
    if (!el || el.tagName !== "IMG") return;
    var src = el.getAttribute("src");
    var next = proxied(src);
    if (next && next !== src) el.setAttribute("src", next);
  }

  function scan(root) {
    if (!root || root.nodeType !== 1) return;
    fix(root);
    if (root.querySelectorAll) {
      var imgs = root.querySelectorAll("img");
      for (var i = 0; i < imgs.length; i++) fix(imgs[i]);
    }
  }

  new MutationObserver(function (mutations) {
    for (var i = 0; i < mutations.length; i++) {
      var m = mutations[i];
      if (m.type === "attributes") fix(m.target);
      else for (var j = 0; j < m.addedNodes.length; j++) scan(m.addedNodes[j]);
    }
  }).observe(document.documentElement, {
    childList: true, subtree: true, attributes: true, attributeFilter: ["src"]
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { scan(document.body); });
  } else {
    scan(document.body);
  }
})();
</script>
<script>
/* ============ EDGE SHEET CACHE (functions/sheet.js) ============
   Shared by every page. Same block in each file -- keep them in step.

   Google takes 0.5-14s to answer a sheet request and forbids CDNs from keeping
   a copy, which is why every page used to show its cached grid and then sit
   on "Checking for changes..." for several seconds. /sheet keeps that copy at
   Cloudflare's edge instead.

     __edge.fast(url)     -> the edge's copy, however old, in ~50ms
     __edge.confirm(url)  -> a copy no older than FRESH_S, waiting on Google
                             only if the edge has nothing that recent
     __edge.isOld(r)      -> true when a fast answer still needs confirming

   Each resolves to {res, age, how}: `res` is the fetch Response (body unread,
   so callers can stream it), `age` its age in seconds, `how` where it came
   from. The pages paint the fast answer straight away and run the confirm
   pass silently behind it, so the data is still live -- it just no longer
   holds anything up.

   If /sheet is missing (local preview, a host without Functions) or fails,
   this goes straight to Google exactly as the pages always did. */
(function(){
  var FRESH_S=60;
  var off=false;
  function opts(signal){ var o={credentials:'omit'}; if(signal) o.signal=signal; return o; }
  function direct(url, signal){
    return fetch(url,opts(signal)).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return {res:r, age:0, how:'DIRECT'};
    });
  }
  function viaEdge(url, fresh, signal){
    if(off) return direct(url, signal);
    var u='/sheet?u='+encodeURIComponent(url)+(fresh==null?'':'&fresh='+fresh);
    return fetch(u,opts(signal)).then(function(r){
      var how=r.headers.get('X-Sheet-Cache');
      /* No header means this was not the function answering (a 404 page, a
         static server) -- stop asking it for the rest of this visit. */
      if(!how){ off=true; return direct(url, signal); }
      if(!r.ok) throw new Error('sheet HTTP '+r.status);
      return {res:r, age:+(r.headers.get('X-Sheet-Age')||0), how:how};
    }).catch(function(e){
      if(off || (e && e.name==='AbortError')) throw e;
      try{ console.warn('[edge] /sheet unavailable, using Google directly:', (e&&e.message)||e); }catch(x){}
      return direct(url, signal);
    });
  }
  window.__edge={
    FRESH_S:FRESH_S,
    fast:function(url,signal){ return viaEdge(url,null,signal); },
    confirm:function(url,maxAge,signal){ return viaEdge(url, maxAge==null?FRESH_S:maxAge, signal); },
    isOld:function(r){ return !!r && (r.age>FRESH_S || r.how==='ERROR-STALE'); },
    text:function(p){ return p.then(function(r){ return r.res.text().then(function(t){ r.text=t; return r; }); }); }
  };
})();
</script>

<script>
/* ============ EARLY DATA LOADER ============
   Starts the sheet download before the CSS, the fonts and the main script are
   even parsed. The old page had no early fetch at all -- the request only went
   out once the whole stylesheet and the blocking font CSS had been handled.

   THE BIG ONE: 88% OF THE DOWNLOAD WAS BEING THROWN AWAY
   The MD2D tab holds 8,773 rows, but 7,284 of them are Own = TRUE and the page
   discards every one of those in the browser. It also pulled five columns it
   never reads (Genre(s), Amazon Price, Updated, Barcode Link, and the blank
   column A). gviz can do both cuts server-side:

       select B,C,D,E,F,G,H,I,J,K,M,N,O,Q,R where B is null or B <> 'TRUE'

   Measured against the real export, that takes the response from ~2.7MB raw /
   353KB gzipped down to ~324KB raw / 48KB gzipped -- an 88% cut before
   anything crosses the wire.

   `B is null or ...` matters: in SQL a NULL never satisfies <>, so a blank
   Own cell would be silently dropped without it. The page keeps blank-Own
   rows, so the query has to as well.

   If Google rejects the query it walks down a ladder of progressively simpler
   ones and finally the plain tab, so the page can never go dark over a schema
   change -- worst case it just downloads more than it needs. */
(function(){
  var SHEET_ID   = '1FGmx-wRGHXE80uyxbZWVeal4b6vOEr9JJ9Hr_VA668U';
  var SHEET_NAME = 'MD2D';

  /* Columns this page actually reads (see COLMAP below). Safe to prune here
     because the parser looks columns up BY HEADER NAME, not by position. */
  var COLS  = 'B,C,D,E,F,G,H,I,J,K,M,N,O,Q,R';

  var base='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?headers=1'
          +(SHEET_NAME?'&sheet='+encodeURIComponent(SHEET_NAME):'');
  var q = function(tq){ return base+'&tq='+encodeURIComponent(tq); };

  /* Own is text ("TRUE"/"FALSE") today. If it ever becomes a real checkbox
     column gviz types it as boolean and the string compare becomes an invalid
     query -- rung 2 covers that case, and it still keeps the column prune. */
  var LADDER = [
    q('select '+COLS+" where B is null or B <> 'TRUE'"),  // text Own  (normal)
    q('select '+COLS+' where B is null or B = false'),    // checkbox Own
    q('select '+COLS),                                    // columns pruned only
    base                                                  // whole tab
  ];
  var slim = LADDER[0];

  window.__MD={id:SHEET_ID, name:SHEET_NAME, base:base, slim:slim, ladder:LADDER};

  /* ---- progress hub: the indicator subscribes later, gets the last event ---- */
  var subs=[], last=null;
  window.__MD_PROG=function(cb){ subs.push(cb); if(last){ try{cb(last);}catch(e){} } };
  function emit(o){ last=o; for(var i=0;i<subs.length;i++){ try{subs[i](o);}catch(e){} } }
  emit({stage:'connect'});

  try{ window.__MD_EXP = +(localStorage.getItem('md2d_bytes')||0) || 0; }catch(e){ window.__MD_EXP=0; }

  /* Reads the response as a stream so the bar shows real bytes, not a guess. */
  function readWithProgress(res){
    if(!res.body || !res.body.getReader) return res.text();
    var reader=res.body.getReader(), dec=new TextDecoder('utf-8'), out='', bytes=0;
    return (function pump(){
      return reader.read().then(function(r){
        if(r.done){
          try{ localStorage.setItem('md2d_bytes', String(bytes)); }catch(e){}
          emit({stage:'downloaded', bytes:bytes});
          return out;
        }
        bytes+=r.value.byteLength;
        out+=dec.decode(r.value,{stream:true});
        emit({stage:'download', bytes:bytes, total:window.__MD_EXP});
        return pump();
      });
    })();
  }
  /* Every rung goes through the edge cache (__edge.fast, defined in the block
     above): the answer is Cloudflare's last copy of THIS query, in ~50ms,
     however old it is. How old is passed on as {age, how} with the text, so
     init can run a silent confirm pass against Google afterwards when the
     copy was stale -- see confirmLater() at the end of the main script.
     __edge falls back to fetching Google directly by itself if /sheet is
     missing, so this path never gets worse than the old plain fetch(). */
  function openSheet(url){
    if(window.__edge) return window.__edge.fast(url);
    return fetch(url).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return {res:r, age:0, how:'DIRECT'};
    });
  }
  function get(url){
    return openSheet(url).then(function(m){
      return readWithProgress(m.res).then(function(txt){
        /* A rejected query does NOT come back as an HTTP error -- Google
           answers 200 with an error payload. Catch that here so the retry
           below fires on the first attempt instead of three round trips
           later. The edge refuses to store such a payload, but it can still
           relay one (or answer non-200, which __edge turns into a direct
           try), so the check has to stay on this side too. */
        if(/"status"\s*:\s*"error"/.test(txt)) throw new Error('query rejected');
        return {text:txt, url:url, age:m.age, how:m.how};
      });
    });
  }

  /* Walk the ladder: first rung that answers wins. Rungs 2-4 only ever run if
     the sheet's shape changed, so the normal path is still a single request.
     Resolves to {text, url, age, how}: `url` is the rung that answered, which
     is the one the confirm pass has to re-ask. */
  function tryFrom(i){
    return get(LADDER[i]+'&tqx=out:json').catch(function(err){
      if(i+1 >= LADDER.length) throw err;
      emit({stage:'retry'});
      return tryFrom(i+1);
    });
  }
  var early=null;
  try{
    early=tryFrom(0);
    early.catch(function(){});             // swallow here; handled properly later
  }catch(e){}
  window.__MD.early=early;
})();
</script>

/* ================= CONFIGURATION =================
   The sheet id / tab name and the server-side query live in the tiny inline
   script in <head> (window.__MD) so the download can start before anything
   else on the page — edit them there. */
const SHEET_ID   = window.__MD.id;
const SHEET_NAME = window.__MD.name;
const IMG_BASE   = 'https://images2.vudu.com/poster2/';                          // + Content ID + '-l'
const LINK_BASE  = 'https://athome.fandango.com/content/browse/details/title/';  // + Content ID

//

// and every paint from it is followed by a live refresh anyway. A short TTL
// just turned "a few days since the last visit" into a cold, empty-grid load.
const IDB_NAME = 'dd-cache', IDB_STORE = 'kv', IDB_KEY = 'd2d:v1';
const LEGACY_CACHE_KEY = 'md2d:v2:' + SHEET_ID + ':' + SHEET_NAME;

(mobileMq.addEventListener ? mobileMq.addEventListener('change', ()=>{ syncPerPage(); if(typeof renderPage==='function' && movies.length) renderPage(); })

// File > Share > Publish to web > select the MD2D tab > CSV, then paste the link here:
/* The mirrored CSV shipped with the deploy. This was empty, so the published-CSV
   fallback in loadData() below could never fire. It now points at a
   byte-for-byte copy of the MD2D tab rebuilt at deploy time and served from

  {label:'Studio',    key:'studio'},
  {label:'Disc',      key:'disc'},
  {label:'Quality',   key:'quality'},
  {label:'MA',        key:'ma'},
  {label:'Comments',  key:'comments'},
];

  {label:'Release Year',    key:'year',   min:1900, max:2026, step:1},
  {label:'Rotten Tomatoes', key:'rt',     min:0,    max:100,  step:1},
  {label:'IMDb',            key:'imdb',   min:0,    max:10,   step:0.1},
  {label:'iTunes Price ($)',key:'itunes', min:0,    max:20,   step:0.01},
  {label:'GP Price ($)',    key:'gp',     min:0,    max:20,   step:0.01},
];

// Lookups are BY NAME, which is why the server-side column pruning in <head>
// is safe — the order the columns come back in doesn't matter.
const COLMAP = {
  'Own':'own','Content ID':'contentId','Title':'title','Year':'year','Studio':'studio',
  'Disc':'disc','Quality':'quality','MA':'ma','RT':'rt','IMDb':'imdb',
  'Vudu Price':'vudu','iTunes Price':'itunes','GP Price':'gp','UPC':'upc','Comments':'comments'
};
let movies=[], filtered=[], page=0;
const selected={};           // facetKey -> Set of values
const facetValues={};        // facetKey -> [ [value,count], ... ] for the visible titles
const rangeState={};         // sliderKey -> {lo,hi}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- STATUS + TOP PROGRESS BAR ----------
   #status is a chip at the top now, not a full-page cover, so the sidebar,
   the pager and the grid are visible from the first frame. */
function setStatus(html, spinning=true, isErr=false){
  const s=$('#status');
  if(html===null){ s.classList.add('hidden'); return; }
  s.classList.remove('hidden');
  s.classList.toggle('err', isErr);
  s.querySelector('.spin').style.display = spinning ? '' : 'none';
  $('#statusTxt').innerHTML = html;
}
const topbarEl=$('#topbar'), barFill=$('#topfill');
let barPct=0;
function setBar(p){
  if(p==null){ topbarEl.classList.add('indet'); return; }
  p=Math.max(0,Math.min(1,p));
  if(p<barPct) return;                        // never let it run backwards
  barPct=p;
  topbarEl.classList.remove('indet');
  barFill.style.width=(p*100).toFixed(1)+'%';
}
function barDone(){ topbarEl.classList.remove('indet'); barFill.style.width='100%'; topbarEl.classList.add('done'); }
const fmtSize = b => b<1048576 ? Math.round(b/1024)+' KB' : (b/1048576).toFixed(1)+' MB';
/* Progress from the <head> loader. Only narrated while the grid is still
   empty: once something is painted the download is a background refresh, and
   a chip announcing it is exactly the "it updates several seconds later"
   noise this page is trying not to make. The top bar still moves. */
window.__MD_PROG(o=>{
  if(painted){
    if(o.stage==='download') setBar(o.total ? Math.min(0.7, o.bytes/o.total*0.7) : null);
    return;
  }
  if(o.stage==='connect'){ setStatus('Connecting to the sheet…'); setBar(null); }
  else if(o.stage==='download'){
    setStatus('Loading collection… '+fmtSize(o.bytes));
    setBar(o.total ? Math.min(0.7, o.bytes/o.total*0.7) : null);
  }
  else if(o.stage==='downloaded'){ setStatus('Building the grid…'); setBar(0.75); }
  else if(o.stage==='retry'){ setStatus('Retrying without the server-side filter…'); setBar(null); }
});
// ---- POSTER PROXYING ----
// Posters come from images2.vudu.com, which some networks block outright, so
// for Vudu URLs we walk a list of routes and the first that answers wins.
// Non-Vudu posters load directly, then fall back to Photon.
const stripScheme = u => u.replace(/^https?:\/\//,'');
// Every entry here is handed to the /img proxy by the POSTER ROUTING shim at
// the top of the page, so a route only works if its HOST is in the allowlist
// in functions/img.js AND the upstream actually answers. The old chain
// failed both tests on every single entry:
//
//   cdn.statically.io  -> 400, host not allowlisted (and 403 direct: Statically
//                         disabled its /img/ endpoint)
//   i0.wp.com          -> 400, host not allowlisted
//   wsrv.nl            -> 400, host not allowlisted (and 404 direct: vudu
//                         refuses wsrv's fetcher)
//   .../gadgets/proxy  -> allowlisted via googleusercontent.com, but 404 upstream
//
// So no cover could ever load: all four routes were tried and all four failed,
// leaving the text placeholder. The one URL the Image CDN will fetch is the
// direct Vudu one, which is what index.html discovers via its direct probe and
// why the movies page kept working. Direct goes first; Photon's shards stay as
// a real fallback (wp.com added to remote_images alongside this change).
const VUDU_PROXIES = [
  u => u,                                                        // direct: the allowlisted route
  u => 'https://i0.wp.com/' + stripScheme(u) + '?w=400',         // Photon
  u => 'https://i1.wp.com/' + stripScheme(u) + '?w=400',         // Photon, 2nd shard
];
const isVudu = u => /vudu\.com/i.test(u);
const firstSrc = u => isVudu(u) ? VUDU_PROXIES[0](u) : u;
function posterError(img){
  const orig = img.getAttribute('data-src') || '';
  const step = (+(img.getAttribute('data-try') || '0')) + 1;
  const chain = isVudu(orig)
    ? VUDU_PROXIES.map(fn=>fn(orig))
    : [orig, 'https://i0.wp.com/' + stripScheme(orig) + '?w=400'];
  if(step < chain.length){ img.setAttribute('data-try', step); img.src = chain[step]; return; }
  const p = img.parentNode, t = (img.alt || '').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  img.remove();
  if(p) p.insertAdjacentHTML('afterbegin', '<div class="ph">' + t + '</div>');
}
/* ---------- LOAD DATA FROM GOOGLE SHEET ---------- */
/* Resolves to {rows, meta}. `meta` is what the edge said about the copy
   ({url, age, how}) when the answer came through __edge -- confirmLater()
   uses it to decide whether a silent second pass is needed. The JSONP and
   mirror fallbacks have no meta: JSONP is a <script> tag and cannot go
   through /sheet, and the mirror is a deploy-time copy, not the live sheet. */
async function loadData(){
  const errors=[];
  // The <head> script has (usually) already started this download.
  const early=window.__MD && window.__MD.early;
  if(early){
    window.__MD.early=null;                    // one-shot
    try{
      const r=await early;
      return {rows:parseGviz(unwrap(r.text)), meta:r};
    }catch(e){ errors.push('early: '+(e&&e.message)); }
  }
  try{ const r=await fetchGviz(window.__MD.slim); return {rows:parseGviz(r.json), meta:r.meta}; }
  catch(e){ errors.push('fetch: '+e.message); }
  try{ return {rows:parseGviz(await jsonpGviz(window.__MD.slim)), meta:null}; }
  catch(e){ errors.push('jsonp: '+e.message); }
  try{ return {rows:parseGviz(await jsonpGviz(window.__MD.base)), meta:null}; }
  catch(e){ errors.push('jsonp-plain: '+e.message); }
  if(PUBLISHED_CSV_URL){
    try{ const txt=await (await fetch(PUBLISHED_CSV_URL)).text(); return {rows:parseGviz(parseCsvData(txt)), meta:null}; }
    catch(e){ errors.push('csv: '+e.message); }
  }
  throw new Error(errors.join(' | '));
}
function unwrap(txt){
  const json=JSON.parse(txt.substring(txt.indexOf('(')+1, txt.lastIndexOf(')')));
  if(json && json.status==='error')
    throw new Error((json.errors&&json.errors[0]&&json.errors[0].detailed_message)||'sheet error');
  return json;
}
// Through the edge cache like the <head> ladder; __edge already throws on a
// non-OK answer and falls back to Google itself if /sheet is unavailable.
async function fetchGviz(url){
  const full=url+'&tqx=out:json';
  const r=await window.__edge.fast(full);
  return {json:unwrap(await r.res.text()), meta:{url:full, age:r.age, how:r.how}};
}
function jsonpGviz(url){
  return new Promise((resolve,reject)=>{
    const cb='__gviz_cb_'+Math.random().toString(36).slice(2);
    const timer=setTimeout(()=>{ cleanup(); reject(new Error('timed out')); },45000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; script.remove(); }
    window[cb]=json=>{
      cleanup();
      if(json && json.status==='error'){
        reject(new Error((json.errors&&json.errors[0]&&json.errors[0].detailed_message)||'sheet returned an error'));
      } else resolve(json);
    };
    const script=document.createElement('script');
    script.src=url+'&tqx=out:json;responseHandler:'+cb;
    script.onerror=()=>{ cleanup(); reject(new Error('script blocked or sheet not public')); };
    document.head.appendChild(script);
  });
}
/* --- minimal RFC-4180 CSV parser (only used by the optional CSV fallback) --- */
function parseCsvText(text){
  const rows=[]; let row=[], cell='', inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else inQ=false; }
      else cell+=ch;
    }else{
      if(ch==='"') inQ=true;
      else if(ch===','){ row.push(cell); cell=''; }
      else if(ch==='\n'||ch==='\r'){
        if(ch==='\r'&&text[i+1]==='\n') i++;
        row.push(cell); cell='';
        if(row.length>1||row[0]!=='') rows.push(row);
        row=[];
      }
      else cell+=ch;
    }
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function parseCsvData(text){
  const rows=parseCsvText(text);
  if(!rows.length) throw new Error('empty CSV');
  const headers=rows[0].map(h=>String(h).trim());
  return {table:{
    cols:headers.map(h=>({label:h})),
    rows:rows.slice(1).map(r=>({c:r.map(v=>({v:v===''?null:v}))}))
  }};
}
function parsePrice(raw){
  const n=parseFloat(String(raw??'').replace(/[^0-9.]/g,''));
  return isNaN(n)?null:n;
}
function parseGviz(json){
  const cols=json.table.cols.map(c=>(c.label||'').trim());
  const idx={}; cols.forEach((c,i)=>{ if(COLMAP[c]) idx[COLMAP[c]]=i; });
  const out=[];
  (json.table.rows||[]).forEach(r=>{
    const cell=k=>{ const i=idx[k]; if(i==null) return null;
      const c=r.c && r.c[i]; return c==null?null:(c.v==null?null:c.v); };
    const title=cell('title');
    if(!title) return;
    const num=k=>{ const v=cell(k); const n=typeof v==='number'?v:parseFloat(v); return isNaN(n)?null:n; };
    // --- Ownership: exclude TRUE, relabel FALSE -> UNOWNED ---
    // The server-side query already drops these, but the check stays: it keeps
    // the page correct if the query is ever bypassed (fallback path, CSV, or a
    // schema change that makes the where clause a no-op).
    const ownRaw=cell('own');
    let ownStr = (typeof ownRaw==='boolean') ? (ownRaw?'TRUE':'FALSE')
                                             : String(ownRaw??'').trim().toUpperCase();
    if(ownStr==='TRUE') return;                       // owned -> excluded entirely
    const ownLabel = ownStr==='FALSE' ? 'UNOWNED' : ownStr;   // '' stays '', UPGRADE stays
    const contentId=String(cell('contentId')??'').trim();
    // Rotten Tomatoes: "60%" / 60 / 0.6 -> 60
    const rtRaw=cell('rt');
    let rtN = typeof rtRaw==='number' ? rtRaw : parseFloat(String(rtRaw??'').replace('%',''));
    if(!isNaN(rtN) && rtN>0 && rtN<=1) rtN=Math.round(rtN*100);
    const vuduRaw=String(cell('vudu')??'').trim();
    const m={
      title:String(title),
      sortTitle:String(title).replace(/^(the|a|an)\s+/i,''),
      own:ownLabel,
      studio:String(cell('studio')||'').trim(),
      disc:String(cell('disc')||'').trim(),
      quality:String(cell('quality')||'').trim(),
      ma:String(cell('ma')||'').trim(),
      year:num('year'),
      rt:isNaN(rtN)?null:rtN,
      imdb:num('imdb'),
      vudu:parsePrice(vuduRaw),
      vuduRaw,
      itunes:parsePrice(cell('itunes')),
      gp:parsePrice(cell('gp')),
      upc:String(cell('upc')||'').trim(),
      comments:String(cell('comments')||'').trim(),
      contentId,
      img: contentId?IMG_BASE+contentId+'-l':'',
      link: contentId?LINK_BASE+contentId:'',
      color:'', search:''
    };
    m.search=[m.title,m.year,m.studio,m.disc,m.quality,m.ma,m.comments,m.contentId]
      .join(' ').toLowerCase();
    out.push(m);
  });
  return out;
}
/* ---------- FACET UI ---------- */
/* Option lists are counted off the titles currently on screen, the same rule
   the Collection page follows: pick a studio and every other list shrinks to
   what that studio actually has, so nothing on offer can only ever return zero.
   A facet with picks of its own is the exception. Counting Studio off a list
   already narrowed to one studio would leave it as the only choice and no way
   to tick a second one, so it counts off everything-but-itself instead. */
function countFacets(rows,list){
  list.forEach(f=>{
    const counts=new Map();
    rows.forEach(m=>{
      [m[f.key]].filter(Boolean).forEach(v=>counts.set(v,(counts.get(v)||0)+1));
    });
    // A -> Z with the shared collator, like the Collection page. None of
    // these facets has a natural order of its own (Quality is SD/HD/UHD, but
    // A -> Z is what it has always shown here).
    facetValues[f.key]=[...counts.entries()].sort((a,b)=>collator.compare(a[0],b[0]));
  });
}
// The whole-catalog pass, run before every build: buildFacets() sizes its
// panels off it, and a stale selection is checked against it. applyFilters()
// narrows the lists from there.
function buildFacetValues(){
  countFacets(movies,FACETS);
  FACETS.forEach(f=>{
    if(!selected[f.key]) selected[f.key]=new Set();
    // Drop any selection that no longer exists after a background refresh, so a
    // stale value can't silently filter everything out.
    const counts=new Map(facetValues[f.key]);
    selected[f.key]=new Set([...selected[f.key]].filter(v=>counts.has(v)));
  });
}
function refreshFacetValues(q){
  const shared=[], own=[];
  FACETS.forEach(f=>(selected[f.key].size?own:shared).push(f));
  countFacets(filtered,shared);
  own.forEach(f=>countFacets(movies.filter(m=>rowMatches(m,q,f.key)),[f]));
}
// Set once the sidebar exists. A search typed while the sheet is still
// loading has nothing to count yet.
let facetsReady=false;
function refreshFacetsNow(){
  if(!facetsReady) return;
  refreshFacetValues($('#searchBox').value.trim().toLowerCase());
  // Counts and option lists just moved under the sidebar, so every badge and
  // whichever panel is open both need redoing.
  document.querySelectorAll('#facets .facet').forEach(el=>{
    updateBadge(el,el.dataset.key);
    if(el.classList.contains('open') && el._render) el._render();
  });
}
function buildFacets(){
  const host=$('#facets'); host.innerHTML='';
  FACETS.forEach(f=>{
    const el=document.createElement('div');
    el.className='facet'; el.dataset.key=f.key;
    const many=facetValues[f.key].length>12;
    el.innerHTML=`
      <button class="facet-btn">
        <span>${esc(f.label)}</span>
        <span class="count-badge" style="display:none">0</span>
        <span class="icon">${many?'+':'▾'}</span>
      </button>
      <div class="facet-panel">
        ${facetValues[f.key].length>10?'<input class="opt-search" placeholder="Search…">':''}
        <div class="opt-list"></div>
        <button class="facet-clear">Clear</button>
      </div>`;
    host.appendChild(el);
    const list=el.querySelector('.opt-list');
    const search=el.querySelector('.opt-search');
    // A re-render starts at the top -- the panel has just been opened, or had
    // its list recounted underneath it -- except straight after a tick, when
    // the list barely moves and the next box you want is still under the cursor.
    let keepScroll=false;
    const render=()=>{
      const ql=search?search.value.trim().toLowerCase():'';
      const prev=list.scrollTop;
      const items=facetValues[f.key].filter(([v])=>!ql||v.toLowerCase().includes(ql));
      const shown=items.slice(0,250);
      list.innerHTML=(shown.length?shown.map(([v,n])=>`
        <label><input type="checkbox" value="${esc(v)}" ${selected[f.key].has(v)?'checked':''}>
        <span>${esc(v)}</span><span class="n">${n}</span></label>`).join('')
        :'<div class="opt-more">Nothing left to narrow by.</div>')
        +(items.length>250?`<div class="opt-more">${items.length-250} more — type to narrow down</div>`:'');
      list.scrollTop = keepScroll ? prev : 0;
      keepScroll=false;
    };
    el._render=render;
    el.querySelector('.facet-btn').addEventListener('click',()=>{
      const was=el.classList.contains('open');
      document.querySelectorAll('.facet.open').forEach(x=>x.classList.remove('open'));
      if(!was){ el.classList.add('open'); render(); if(search) search.focus(); }
    });
    if(search) search.addEventListener('input',render);
    list.addEventListener('change',e=>{
      if(e.target.type!=='checkbox') return;
      const v=e.target.value;
      e.target.checked?selected[f.key].add(v):selected[f.key].delete(v);
      keepScroll=true;
      applyFilters();
    });
    el.querySelector('.facet-clear').addEventListener('click',()=>{
      selected[f.key].clear(); if(search) search.value='';
      applyFilters();
    });
    updateBadge(el,f.key);
  });
  facetsReady=true;
  // Bound once. The old version re-registered this on every rebuild, stacking
  // up a duplicate document listener each time the catalog refreshed.
  if(!buildFacets._outsideBound){
    document.addEventListener('click',e=>{
      if(!e.target.closest('.facet')) document.querySelectorAll('.facet.open').forEach(x=>x.classList.remove('open'));
    });
    buildFacets._outsideBound=true;
  }
}
function updateBadge(el,key){
  const b=el.querySelector('.count-badge'), n=selected[key].size;
  b.style.display=n?'inline-block':'none'; b.textContent=n;
}
/* ---------- SLIDERS ---------- */
/* A rebuild after a background refresh must not throw away a range the
   visitor set -- the grid is still filtered by it -- so an ADJUSTED slider
   keeps its lo/hi, clamped to the new bounds. Same rule as the Collection
   page's `keep`. Only adjusted ones: the old version preserved every slider,
   so one sitting at its full span whose data grew (a new 2026 release, a
   pricier title) came back pinned to the OLD max and silently started
   filtering out exactly the rows that had just arrived. */
let slidersRebuilding=false;
function buildSliders(){
  const host=$('#sliders');
  slidersRebuilding=true;              // see manual() below
  try{ host.innerHTML=''; }finally{ slidersRebuilding=false; }
  SLIDERS.forEach(s=>{
    const prev=s._active && rangeState[s.key] ? rangeState[s.key] : null;
    // A plain loop instead of Math.min(...vals): spreading thousands of
    // arguments is both slow and a stack-overflow risk.
    let mn=Infinity,mx=-Infinity,any=false;
    for(const m of movies){ const v=m[s.key]; if(v==null) continue; any=true; if(v<mn)mn=v; if(v>mx)mx=v; }
    if(any){
      const q=s.step<1?100:1;
      s.min=Math.min(s.min,Math.floor(mn*q)/q);
      s.max=Math.max(s.max,Math.ceil(mx*q)/q);
    }
    let startLo=s.min, startHi=s.max;
    if(prev){
      startLo=Math.max(s.min,Math.min(s.max,prev.lo));
      startHi=Math.max(s.min,Math.min(s.max,prev.hi));
    }
    rangeState[s.key]={lo:startLo,hi:startHi};
    const el=document.createElement('div');
    el.className='slider-group';
    el.innerHTML=`
      <div class="sl-title">${esc(s.label)}</div>
      <div class="range-wrap">
        <div class="rail"></div><div class="fill"></div>
        <input type="range" class="lo" min="${s.min}" max="${s.max}" step="${s.step}" value="${startLo}">
        <input type="range" class="hi" min="${s.min}" max="${s.max}" step="${s.step}" value="${startHi}">
      </div>
      <div class="sl-vals">
        <input class="v-lo" type="number" min="${s.min}" max="${s.max}" step="${s.step}" value="${startLo}" title="Type a value">
        <input class="v-hi" type="number" min="${s.min}" max="${s.max}" step="${s.step}" value="${startHi}" title="Type a value">
      </div>`;
    host.appendChild(el);
    const lo=el.querySelector('.lo'), hi=el.querySelector('.hi'),
          fill=el.querySelector('.fill'), vlo=el.querySelector('.v-lo'), vhi=el.querySelector('.v-hi');
    const fmt=v=>s.step<1?(+v).toFixed(s.step<0.1?2:1):String(v);
    const paint=()=>{
      const a=+lo.value,b=+hi.value;
      let mnv=Math.min(a,b),mxv=Math.max(a,b);
      if(mnv < s.min + s.step/2) mnv = s.min;
      if(mxv > s.max - s.step/2) mxv = s.max;
      rangeState[s.key]={lo:mnv,hi:mxv};
      const pct=v=>(v-s.min)/(s.max-s.min)*100;
      fill.style.left=pct(mnv)+'%'; fill.style.width=(pct(mxv)-pct(mnv))+'%';
      vlo.value=fmt(mnv); vhi.value=fmt(mxv);
      /* Deliberately the same test rowMatches() uses to decide whether this
         slider filters anything, so the blue can never disagree with the grid. */
      s._active = mnv>s.min || mxv<s.max;
      el.classList.toggle('active', s._active);
    };
    paint();
    let t;
    const onInput=()=>{ paint(); clearTimeout(t); t=setTimeout(applyFilters,150); };
    lo.addEventListener('input',onInput); hi.addEventListener('input',onInput);
    const manual=(inputEl,rangeEl)=>{
      /* A background refresh rebuilds the sliders. If this field had focus,
         Chrome fires blur -- and with it 'change' -- on the element as it is
         being removed (it is still connected at that moment), and running
         applyFilters() from that dying copy sent the visitor back to page 1
         in the middle of a silent catch-up. The rebuilt slider already
         carries the range, so the old one stays quiet. */
      if(slidersRebuilding || !inputEl.isConnected) return;
      let v=parseFloat(inputEl.value);
      if(isNaN(v)){ paint(); return; }
      v=Math.max(s.min,Math.min(s.max,v));
      rangeEl.value=v; paint(); applyFilters();
    };
    vlo.addEventListener('change',()=>manual(vlo,lo));
    vhi.addEventListener('change',()=>manual(vhi,hi));
    vlo.addEventListener('keydown',e=>{ if(e.key==='Enter') vlo.blur(); });
    vhi.addEventListener('keydown',e=>{ if(e.key==='Enter') vhi.blur(); });
    s._reset=()=>{ lo.value=s.min; hi.value=s.max; paint(); };
  });
}
/* ---------- FILTER + SORT + RENDER ---------- */
// `skipKey` leaves one facet out, which is how a facet with picks of its own
// gets its option list counted (see refreshFacetValues).
function rowMatches(m,q,skipKey){
  if(q && !m.search.includes(q)) return false;
  for(const f of FACETS){
    if(f.key===skipKey) continue;
    const sel=selected[f.key]; if(!sel.size) continue;
    if(!sel.has(m[f.key])) return false;
  }
  for(const s of SLIDERS){
    const r=rangeState[s.key];
    if(!r) continue;
    if(r.lo>s.min || r.hi<s.max){
      const v=m[s.key];
      if(v==null || v<r.lo || v>r.hi) return false;
    }
  }
  return true;
}
// soft=true is the background-refresh path: the grid is only touched where
// the cards actually differ (see renderPage).
function applyFilters(keepPage, soft){
  const q=$('#searchBox').value.trim().toLowerCase();
  filtered=movies.filter(m=>rowMatches(m,q,null));
  refreshFacetsNow();
  renderChips();
  sortNow();
  if(!keepPage) page=0;
  renderPage(soft?{ifChanged:true}:null);
}
/* Same semantics as the Collection page's sortNow(): blanks last whichever
   way a column is sorted, and ties broken A -> Z by title with the shared
   collator (so equal-priced titles no longer come out in sheet order, and
   "Rocky 2" sorts before "Rocky 10"). sortTitle has the leading The/A/An
   dropped, so "The Matrix" files under M. */
function sortNow(){
  const [key,dir]=$('#sortSel').value.split('|');
  const mul=dir==='desc'?-1:1;
  const alphaTitle=(a,b)=>collator.compare(a.sortTitle||a.title||'', b.sortTitle||b.title||'');
  filtered.sort((a,b)=>{
    if(key==='sortTitle') return mul*alphaTitle(a,b);
    const x=a[key], y=b[key];
    if(x==null&&y==null) return alphaTitle(a,b);
    if(x==null) return 1;            // blanks last either direction
    if(y==null) return -1;
    if(x===y) return alphaTitle(a,b);
    return mul*(x-y);
  });
}
/* ---------- CARDS ----------
   A background refresh used to rewrite the whole grid with innerHTML, which
   restarts every <img> -- 150 posters reloaded (and visibly flashed) because
   one price somewhere changed. Now each card carries a key built from
   everything it displays; renderPage() keeps the existing element for any
   card whose key is unchanged and only builds markup for the ones that are
   new or different. Moving an <img> element does not restart its load, so a
   catch-up only ever touches the cards that actually changed. */
function cardKey(m){

function cardHtml(m,i,k){

  // the grid fills straight away; everything below stays lazy. width/height

       title="${esc(m.title)}${m.year?' ('+m.year+')':''}"
       style="background:${esc(m.color)||'var(--bg-soft)'}">
      ${m.img?`<img loading="${i<20?'eager':'lazy'}" ${i<10?'fetchpriority="high"':''} decoding="async"

// Fingerprint of what the grid is showing, so a refresh that changes nothing
// on this page (the normal case) costs one string compare and no DOM work.
let renderedKey=null;
function renderPage(opts){
  const total=filtered.length;
  const pages=Math.max(1,Math.ceil(total/PER_PAGE));
  page=Math.min(page,pages-1);
  const start=page*PER_PAGE, end=Math.min(start+PER_PAGE,total);
  const label= total? `${start+1} - ${end} / ${total}` : '0 results';
  $('#pgLabel').textContent=label;

  $('#prevPg').disabled=atFirst;  $('#nextPg').disabled=atLast;
  if(window.syncBottomPager) syncBottomPager(page,pages);

  const keys=slice.map(cardKey);
  const k=keys.join('\u0002');
  if(opts && opts.ifChanged && k===renderedKey) return;   // identical -> touch nothing
  renderedKey=k;

  // identical, and each element can only be placed once).

function toTop(){

/* ---- BOTTOM PAGER ----------------------------------------------------------
   A second set of controls parked at the foot of the wall, revealed only once
   #grid -- which is the scroll container on this page, not the window -- has
   been scrolled to its end.

   The middle of the bar is the jump control. It shows "Page 67 of 127"; click
   it and it becomes a field you type a page number into, because the <select>
   this replaced meant scrolling a 127-item menu to get anywhere, which is a
   list rather than a jump. Enter commits, Escape or clicking away cancels, and
   anything out of range is clamped rather than rejected.

(function(){
  const grid=document.getElementById('grid'),
        prevB=document.getElementById('prevPgB'), nextB=document.getElementById('nextPgB'),
        label=document.getElementById('pgJump'), form=document.getElementById('pgJumpForm'),
        field=document.getElementById('pgJumpIn'), ofTxt=document.getElementById('pgJumpOf');

  // every repaint rewrites the grid's children, which drops it off the end.
  const pagerB=document.getElementById('pagerBottom');
  const parkPager=function(){ if(grid.lastElementChild!==pagerB) grid.appendChild(pagerB); };
  new MutationObserver(parkPager).observe(grid,{childList:true});

    field.value=String(cur+1);
    label.hidden=true; form.hidden=false;
    field.focus(); field.select();
  }
  function closeJump(){ if(!form.hidden){ form.hidden=true; label.hidden=false; } }
  // The arrows run the same goPrev/goNext as the top bar, so a flip from the
  // foot of the wall lands exactly where a flip from the head does.
  prevB.addEventListener('click',goPrev);
  nextB.addEventListener('click',goNext);
  label.addEventListener('click',openJump);

     half a pixel short never shows the bar.

     it is one read, and the class is only written when the answer changes
     (twice per trip down the wall), so there is no layout thrash to batch. */

       toTop() moves the scroll after it, so re-measure once both are done.
       A timeout rather than rAF: this has to settle even when the tab is
       throttled, and reading scrollHeight forces the layout it needs. */
    setTimeout(function(){ shown=null; atEnd(); },0);
  };

})();

/* The visible sort control, copied from the Collection page. #sortSel stays

/* ---------- CACHE (IndexedDB) ----------

   block the main thread on a big JSON.stringify, and it stores the rows as

let idbConn=null;

    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE); };

function writeCache(list, sig, asOf){

/* Cheap fingerprint of a row list, to tell "the same data again" (the normal

function signature(list){
  const str=JSON.stringify(list);

   of them does. Promise.any is nearly this, but it would count a source that
   "succeeded" with zero rows as the winner and paint an empty grid. Rejected
   and empty are treated the same: not an answer, wait for the other one. */
function firstNonEmpty(promises){
  const running = promises.filter(Boolean);
  if(!running.length) return Promise.resolve(null);
  return new Promise(resolve=>{
    let left = running.length;
    const lose = () => { if(--left === 0) resolve(null); };
    running.forEach(p => p.then(v => { if(v && v.length) resolve(v); else lose(); }, lose));

/* The confirm pass. `meta` is what the edge said about the copy this visit

    }

(async function init(){

                   once Cloudflare compresses it -- see _headers).

        +'<span style="color:#607d8b">('+esc(err.message)+')</span></small>', false, true);
    }
  }
})();
</script>
