<!-- ===================================================================
     POSTER ROUTING -- runs before anything else in the page.

     Rewrites the src of every <img>, now and as the grid renders more, to
     load through this domain via Netlify's Image CDN instead of straight
     from the image host.

     Two reasons, in order of how much they matter:

     1. Networks that filter on hostname (a work network, some ISPs) block
        images2.vudu.com outright, and the fallback proxies the pages walk
        through -- cdn.statically.io, i0.wp.com, wsrv.nl -- are separate
        hostnames that can be blocked just as easily. Routed through here
        the browser only ever connects to this site, so there is nothing
        for a host-based filter to match. (Confirmed working on a network
        that was blocking Vudu.)

     2. The Image CDN resizes and re-encodes: a poster arrives as ~10KB of
        webp instead of ~40KB of source jpeg.

     Requires the [images] remote_images allowlist in netlify.toml -- a URL
     whose host is not on that list is refused by the Image CDN, so add the
     host there before pointing anything new at it.
     =================================================================== -->
<script>
(function () {
  var PROXY  = "/img";
  var WIDTH  = 300;      // poster cards render ~150px wide; 300 covers retina
  var FORMAT = "webp";   // smaller than the source jpg

  function proxied(u) {
    if (!u) return u;
    u = String(u).trim();
    if (!/^(https?:)?\/\//i.test(u)) return u;              // relative -> leave alone
    if (u.indexOf("/.netlify/images") !== -1) return u;     // already proxied
    if (u.indexOf("//" + location.host) !== -1) return u;   // same-site -> leave alone
    if (u.slice(0, 2) === "//") u = "https:" + u;
    else if (u.slice(0, 5).toLowerCase() === "http:") u = "https:" + u.slice(5);
    return PROXY + "?url=" + encodeURIComponent(u) + "&w=" + WIDTH + "&fm=" + FORMAT;
  }

  function fix(el) {
    if (!el || el.tagName !== "IMG") return;
    var src = el.getAttribute("src");
    var next = proxied(src);
    if (next && next !== src) el.setAttribute("src", next);
  }

  function scan(root) {
    if (!root || root.nodeType !== 1) return;
    fix(root);
    if (root.querySelectorAll) {
      var imgs = root.querySelectorAll("img");
      for (var i = 0; i < imgs.length; i++) fix(imgs[i]);
    }
  }

  new MutationObserver(function (mutations) {
    for (var i = 0; i < mutations.length; i++) {
      var m = mutations[i];
      if (m.type === "attributes") fix(m.target);
      else for (var j = 0; j < m.addedNodes.length; j++) scan(m.addedNodes[j]);
    }
  }).observe(document.documentElement, {
    childList: true, subtree: true, attributes: true, attributeFilter: ["src"]
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { scan(document.body); });
  } else {
    scan(document.body);
  }
})();
</script>

<script>
/* ============ EARLY DATA LOADER ============
   Starts the sheet download before the CSS, the fonts and the main script are
   even parsed. The old page had no early fetch at all -- the request only went
   out once the whole stylesheet and the blocking font CSS had been handled.

   THE BIG ONE: 88% OF THE DOWNLOAD WAS BEING THROWN AWAY
   The MD2D tab holds 8,773 rows, but 7,284 of them are Own = TRUE and the page
   discards every one of those in the browser. It also pulled five columns it
   never reads (Genre(s), Amazon Price, Updated, Barcode Link, and the blank
   column A). gviz can do both cuts server-side:

       select B,C,D,E,F,G,H,I,J,K,M,N,O,Q,R where B is null or B <> 'TRUE'

   Measured against the real export, that takes the response from ~2.7MB raw /
   353KB gzipped down to ~324KB raw / 48KB gzipped -- an 88% cut before
   anything crosses the wire.

   `B is null or ...` matters: in SQL a NULL never satisfies <>, so a blank
   Own cell would be silently dropped without it. The page keeps blank-Own
   rows, so the query has to as well.

   If Google rejects the query it walks down a ladder of progressively simpler
   ones and finally the plain tab, so the page can never go dark over a schema
   change -- worst case it just downloads more than it needs. */
(function(){
  var SHEET_ID   = '1FGmx-wRGHXE80uyxbZWVeal4b6vOEr9JJ9Hr_VA668U';
  var SHEET_NAME = 'MD2D';

  /* Columns this page actually reads (see COLMAP below). Safe to prune here
     because the parser looks columns up BY HEADER NAME, not by position. */
  var COLS  = 'B,C,D,E,F,G,H,I,J,K,M,N,O,Q,R';

  var base='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?headers=1'
          +(SHEET_NAME?'&sheet='+encodeURIComponent(SHEET_NAME):'');
  var q = function(tq){ return base+'&tq='+encodeURIComponent(tq); };

  /* Own is text ("TRUE"/"FALSE") today. If it ever becomes a real checkbox
     column gviz types it as boolean and the string compare becomes an invalid
     query -- rung 2 covers that case, and it still keeps the column prune. */
  var LADDER = [
    q('select '+COLS+" where B is null or B <> 'TRUE'"),  // text Own  (normal)
    q('select '+COLS+' where B is null or B = false'),    // checkbox Own
    q('select '+COLS),                                    // columns pruned only
    base                                                  // whole tab
  ];
  var slim = LADDER[0];

  window.__MD={id:SHEET_ID, name:SHEET_NAME, base:base, slim:slim, ladder:LADDER};

  /* ---- progress hub: the indicator subscribes later, gets the last event ---- */
  var subs=[], last=null;
  window.__MD_PROG=function(cb){ subs.push(cb); if(last){ try{cb(last);}catch(e){} } };
  function emit(o){ last=o; for(var i=0;i<subs.length;i++){ try{subs[i](o);}catch(e){} } }
  emit({stage:'connect'});

  try{ window.__MD_EXP = +(localStorage.getItem('md2d_bytes')||0) || 0; }catch(e){ window.__MD_EXP=0; }

  /* Reads the response as a stream so the bar shows real bytes, not a guess. */
  function readWithProgress(res){
    if(!res.body || !res.body.getReader) return res.text();
    var reader=res.body.getReader(), dec=new TextDecoder('utf-8'), out='', bytes=0;
    return (function pump(){
      return reader.read().then(function(r){
        if(r.done){
          try{ localStorage.setItem('md2d_bytes', String(bytes)); }catch(e){}
          emit({stage:'downloaded', bytes:bytes});
          return out;
        }
        bytes+=r.value.byteLength;
        out+=dec.decode(r.value,{stream:true});
        emit({stage:'download', bytes:bytes, total:window.__MD_EXP});
        return pump();
      });
    })();
  }
  function get(url){
    return fetch(url).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return readWithProgress(r);
    }).then(function(txt){
      /* A rejected query does NOT come back as an HTTP error -- Google answers
         200 with an error payload. Catch that here so the retry below fires on
         the first attempt instead of three round trips later. */
      if(/"status"\s*:\s*"error"/.test(txt)) throw new Error('query rejected');
      return txt;
    });
  }

  /* Walk the ladder: first rung that answers wins. Rungs 2-4 only ever run if
     the sheet's shape changed, so the normal path is still a single request. */
  function tryFrom(i){
    return get(LADDER[i]+'&tqx=out:json').catch(function(err){
      if(i+1 >= LADDER.length) throw err;
      emit({stage:'retry'});
      return tryFrom(i+1);
    });
  }
  var early=null;
  try{
    early=tryFrom(0);
    early.catch(function(){});             // swallow here; handled properly later
  }catch(e){}
  window.__MD.early=early;
})();
</script>

<body>
<!-- ==== SHARED NAV =========================================================
     Google Sites drew this bar; on Netlify the pages own it. Inlined rather
     than pulled from a stylesheet so it paints in the first frame with no
     extra round trip -- it is under 1KB and never changes independently.
     ==================================================================== -->
<style>
:root{--dd-nav-h:52px}
.dd-nav{position:fixed;top:0;left:0;right:0;height:var(--dd-nav-h);z-index:150;
  display:flex;align-items:center;gap:4px;padding:0 18px;background:#000;
  border-bottom:1px solid #23292e;
  font-family:'Poppins','Segoe UI',system-ui,sans-serif;font-weight:700}
.dd-brand{display:flex;align-items:center;gap:9px;margin-right:22px;flex:0 0 auto;
  color:#fff;text-decoration:none;font-size:16px;letter-spacing:.6px;white-space:nowrap}
/* Transparent PNG, so it needs no plate behind it -- it sits straight on the
   bar. object-fit:contain keeps the whole avatar rather than cropping the
   popcorn out of the bottom-left corner. */
.dd-brand-img{width:32px;height:32px;flex:0 0 auto;object-fit:contain}
.dd-links{display:flex;align-items:center;gap:2px;overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none}
.dd-links::-webkit-scrollbar{display:none}
.dd-links a{color:#eceff1;text-decoration:none;font-size:15px;letter-spacing:.3px;

/* ---------- STATUS + TOP PROGRESS BAR ----------

const fmtSize = b => b<1048576 ? Math.round(b/1024)+' KB' : (b/1048576).toFixed(1)+' MB';

  if(o.stage==='connect'){ setStatus('Connecting to the sheet…'); setBar(null); }

// ---- POSTER PROXYING ----
// Posters come from images2.vudu.com, which some networks block outright, so
// for Vudu URLs we walk a list of routes and the first that answers wins.
// Non-Vudu posters load directly, then fall back to Photon.
const stripScheme = u => u.replace(/^https?:\/\//,'');
// Every entry here is handed to the Image CDN by the POSTER ROUTING shim at the
// top of the page, so a route only works if its HOST is in the remote_images
// allowlist in netlify.toml AND the upstream actually answers. The old chain
// failed both tests on every single entry:
//
//   cdn.statically.io  -> 400, host not allowlisted (and 403 direct: Statically
//                         disabled its /img/ endpoint)
//   i0.wp.com          -> 400, host not allowlisted
//   wsrv.nl            -> 400, host not allowlisted (and 404 direct: vudu
//                         refuses wsrv's fetcher)
//   .../gadgets/proxy  -> allowlisted via googleusercontent.com, but 404 upstream
//
// So no cover could ever load: all four routes were tried and all four failed,
// leaving the text placeholder. The one URL the Image CDN will fetch is the
// direct Vudu one, which is what index.html discovers via its direct probe and
// why the movies page kept working. Direct goes first; Photon's shards stay as
// a real fallback (wp.com added to remote_images alongside this change).
const VUDU_PROXIES = [
  u => u,                                                        // direct: the allowlisted route
  u => 'https://i0.wp.com/' + stripScheme(u) + '?w=400',         // Photon
  u => 'https://i1.wp.com/' + stripScheme(u) + '?w=400',         // Photon, 2nd shard
];
const isVudu = u => /vudu\.com/i.test(u);
const firstSrc = u => isVudu(u) ? VUDU_PROXIES[0](u) : u;
function posterError(img){
  const orig = img.getAttribute('data-src') || '';
  const step = (+(img.getAttribute('data-try') || '0')) + 1;
  const chain = isVudu(orig)
    ? VUDU_PROXIES.map(fn=>fn(orig))
    : [orig, 'https://i0.wp.com/' + stripScheme(orig) + '?w=400'];
  if(step < chain.length){ img.setAttribute('data-try', step); img.src = chain[step]; return; }
  const p = img.parentNode, t = (img.alt || '').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  img.remove();
  if(p) p.insertAdjacentHTML('afterbegin', '<div class="ph">' + t + '</div>');
}
/* ---------- LOAD DATA FROM GOOGLE SHEET ---------- */
async function loadData(){
  const errors=[];
  // The <head> script has (usually) already started this download.
  const early=window.__MD && window.__MD.early;
  if(early){
    window.__MD.early=null;                    // one-shot
    try{
      const txt=await early;
      return parseGviz(unwrap(txt));
    }catch(e){ errors.push('early: '+(e&&e.message)); }
  }
  try{ return parseGviz(await fetchGviz(window.__MD.slim)); }
  catch(e){ errors.push('fetch: '+e.message); }
  try{ return parseGviz(await jsonpGviz(window.__MD.slim)); }
  catch(e){ errors.push('jsonp: '+e.message); }
  try{ return parseGviz(await jsonpGviz(window.__MD.base)); }
  catch(e){ errors.push('jsonp-plain: '+e.message); }
  if(PUBLISHED_CSV_URL){
    try{ const txt=await (await fetch(PUBLISHED_CSV_URL)).text(); return parseGviz(parseCsvData(txt)); }
    catch(e){ errors.push('csv: '+e.message); }
  }
  throw new Error(errors.join(' | '));
}
function unwrap(txt){
  const json=JSON.parse(txt.substring(txt.indexOf('(')+1, txt.lastIndexOf(')')));
  if(json && json.status==='error')
    throw new Error((json.errors&&json.errors[0]&&json.errors[0].detailed_message)||'sheet error');
  return json;
}
async function fetchGviz(url){
  const res=await fetch(url+'&tqx=out:json');
  if(!res.ok) throw new Error('HTTP '+res.status);
  return unwrap(await res.text());
}
function jsonpGviz(url){
  return new Promise((resolve,reject)=>{
    const cb='__gviz_cb_'+Math.random().toString(36).slice(2);
    const timer=setTimeout(()=>{ cleanup(); reject(new Error('timed out')); },45000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; script.remove(); }
    window[cb]=json=>{
      cleanup();
      if(json && json.status==='error'){
        reject(new Error((json.errors&&json.errors[0]&&json.errors[0].detailed_message)||'sheet returned an error'));
      } else resolve(json);
    };
    const script=document.createElement('script');
    script.src=url+'&tqx=out:json;responseHandler:'+cb;
    script.onerror=()=>{ cleanup(); reject(new Error('script blocked or sheet not public')); };
    document.head.appendChild(script);
  });
}
/* --- minimal RFC-4180 CSV parser (only used by the optional CSV fallback) --- */
function parseCsvText(text){
  const rows=[]; let row=[], cell='', inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else inQ=false; }
      else cell+=ch;
    }else{
      if(ch==='"') inQ=true;
      else if(ch===','){ row.push(cell); cell=''; }
      else if(ch==='\n'||ch==='\r'){
        if(ch==='\r'&&text[i+1]==='\n') i++;
        row.push(cell); cell='';
        if(row.length>1||row[0]!=='') rows.push(row);
        row=[];
      }
      else cell+=ch;
    }
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function parseCsvData(text){
  const rows=parseCsvText(text);
  if(!rows.length) throw new Error('empty CSV');
  const headers=rows[0].map(h=>String(h).trim());
  return {table:{
    cols:headers.map(h=>({label:h})),
    rows:rows.slice(1).map(r=>({c:r.map(v=>({v:v===''?null:v}))}))
  }};
}
function parsePrice(raw){
  const n=parseFloat(String(raw??'').replace(/[^0-9.]/g,''));
  return isNaN(n)?null:n;
}
function parseGviz(json){
  const cols=json.table.cols.map(c=>(c.label||'').trim());
  const idx={}; cols.forEach((c,i)=>{ if(COLMAP[c]) idx[COLMAP[c]]=i; });
  const out=[];
  (json.table.rows||[]).forEach(r=>{
    const cell=k=>{ const i=idx[k]; if(i==null) return null;
      const c=r.c && r.c[i]; return c==null?null:(c.v==null?null:c.v); };
    const title=cell('title');
    if(!title) return;
    const num=k=>{ const v=cell(k); const n=typeof v==='number'?v:parseFloat(v); return isNaN(n)?null:n; };
    // --- Ownership: exclude TRUE, relabel FALSE -> UNOWNED ---
    // The server-side query already drops these, but the check stays: it keeps
    // the page correct if the query is ever bypassed (fallback path, CSV, or a
    // schema change that makes the where clause a no-op).
    const ownRaw=cell('own');
    let ownStr = (typeof ownRaw==='boolean') ? (ownRaw?'TRUE':'FALSE')
                                             : String(ownRaw??'').trim().toUpperCase();
    if(ownStr==='TRUE') return;                       // owned -> excluded entirely
    const ownLabel = ownStr==='FALSE' ? 'UNOWNED' : ownStr;   // '' stays '', UPGRADE stays
    const contentId=String(cell('contentId')??'').trim();
    // Rotten Tomatoes: "60%" / 60 / 0.6 -> 60
    const rtRaw=cell('rt');
    let rtN = typeof rtRaw==='number' ? rtRaw : parseFloat(String(rtRaw??'').replace('%',''));
    if(!isNaN(rtN) && rtN>0 && rtN<=1) rtN=Math.round(rtN*100);
    const vuduRaw=String(cell('vudu')??'').trim();
    const m={
      title:String(title),
      sortTitle:String(title).replace(/^(the|a|an)\s+/i,''),
      own:ownLabel,
      studio:String(cell('studio')||'').trim(),
      disc:String(cell('disc')||'').trim(),
      quality:String(cell('quality')||'').trim(),
      ma:String(cell('ma')||'').trim(),
      year:num('year'),
      rt:isNaN(rtN)?null:rtN,
      imdb:num('imdb'),
      vudu:parsePrice(vuduRaw),
      vuduRaw,
      itunes:parsePrice(cell('itunes')),
      gp:parsePrice(cell('gp')),
      upc:String(cell('upc')||'').trim(),
      comments:String(cell('comments')||'').trim(),
      contentId,
      img: contentId?IMG_BASE+contentId+'-l':'',
      link: contentId?LINK_BASE+contentId:'',
      color:'', search:''
    };
    m.search=[m.title,m.year,m.studio,m.disc,m.quality,m.ma,m.comments,m.contentId]
      .join(' ').toLowerCase();
    out.push(m);
  });
  return out;
}
/* ---------- FACET UI ---------- */
function buildFacetValues(){
  FACETS.forEach(f=>{
    const counts=new Map();
    movies.forEach(m=>{
      [m[f.key]].filter(Boolean).forEach(v=>counts.set(v,(counts.get(v)||0)+1));
    });
    facetValues[f.key]=[...counts.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
    if(!selected[f.key]) selected[f.key]=new Set();
    // Drop any selection that no longer exists after a background refresh, so a
    // stale value can't silently filter everything out.
    selected[f.key]=new Set([...selected[f.key]].filter(v=>counts.has(v)));
  });
}
function buildFacets(){
  const host=$('#facets'); host.innerHTML='';
  FACETS.forEach(f=>{
    const el=document.createElement('div');
    el.className='facet'; el.dataset.key=f.key;
    const many=facetValues[f.key].length>12;
    el.innerHTML=`
      <button class="facet-btn">
        <span>${esc(f.label)}</span>
        <span class="count-badge" style="display:none">0</span>
        <span class="icon">${many?'+':'▾'}</span>
      </button>
      <div class="facet-panel">
        ${facetValues[f.key].length>10?'<input class="opt-search" placeholder="Search…">':''}
        <div class="opt-list"></div>
        <button class="facet-clear">Clear</button>
      </div>`;
    host.appendChild(el);
    const list=el.querySelector('.opt-list');
    const search=el.querySelector('.opt-search');
    const render=(q='')=>{
      const ql=q.toLowerCase();
      const items=facetValues[f.key].filter(([v])=>!ql||v.toLowerCase().includes(ql));
      const shown=items.slice(0,250);
      list.innerHTML=shown.map(([v,n])=>`
        <label><input type="checkbox" value="${esc(v)}" ${selected[f.key].has(v)?'checked':''}>
        <span>${esc(v)}</span><span class="n">${n}</span></label>`).join('')
        +(items.length>250?`<div class="opt-more">${items.length-250} more — type to narrow down</div>`:'');
    };
    el.querySelector('.facet-btn').addEventListener('click',()=>{
      const was=el.classList.contains('open');
      document.querySelectorAll('.facet.open').forEach(x=>x.classList.remove('open'));
      if(!was){ el.classList.add('open'); render(search?search.value:''); if(search) search.focus(); }
    });
    if(search) search.addEventListener('input',()=>render(search.value));
    list.addEventListener('change',e=>{
      if(e.target.type!=='checkbox') return;
      const v=e.target.value;
      e.target.checked?selected[f.key].add(v):selected[f.key].delete(v);
      updateBadge(el,f.key); applyFilters();
    });
    el.querySelector('.facet-clear').addEventListener('click',()=>{
      selected[f.key].clear(); render(search?search.value:''); updateBadge(el,f.key); applyFilters();
    });
    updateBadge(el,f.key);
  });

  // up a duplicate document listener each time the catalog refreshed.
  if(!buildFacets._outsideBound){
    document.addEventListener('click',e=>{
      if(!e.target.closest('.facet')) document.querySelectorAll('.facet.open').forEach(x=>x.classList.remove('open'));
    });
    buildFacets._outsideBound=true;
  }
}
function updateBadge(el,key){
  const b=el.querySelector('.count-badge'), n=selected[key].size;
  b.style.display=n?'inline-block':'none'; b.textContent=n;
}
/* ---------- SLIDERS ---------- */
// preserve=true keeps the current lo/hi (clamped to the new min/max) so a
// background refresh can't reset a filter under the user.
function buildSliders(preserve){
  const host=$('#sliders'); host.innerHTML='';
  SLIDERS.forEach(s=>{
    const prev=preserve?rangeState[s.key]:null;
    // A plain loop instead of Math.min(...vals): spreading thousands of
    // arguments is both slow and a stack-overflow risk.
    let mn=Infinity,mx=-Infinity,any=false;
    for(const m of movies){ const v=m[s.key]; if(v==null) continue; any=true; if(v<mn)mn=v; if(v>mx)mx=v; }
    if(any){
      const q=s.step<1?100:1;
      s.min=Math.min(s.min,Math.floor(mn*q)/q);
      s.max=Math.max(s.max,Math.ceil(mx*q)/q);
    }
    let startLo=s.min, startHi=s.max;
    if(prev){
      startLo=Math.max(s.min,Math.min(s.max,prev.lo));
      startHi=Math.max(s.min,Math.min(s.max,prev.hi));
    }
    rangeState[s.key]={lo:startLo,hi:startHi};
    const el=document.createElement('div');
    el.className='slider-group';
    el.innerHTML=`
      <div class="sl-title">${esc(s.label)}</div>
      <div class="range-wrap">
        <div class="rail"></div><div class="fill"></div>
        <input type="range" class="lo" min="${s.min}" max="${s.max}" step="${s.step}" value="${startLo}">
        <input type="range" class="hi" min="${s.min}" max="${s.max}" step="${s.step}" value="${startHi}">
      </div>
      <div class="sl-vals">
        <input class="v-lo" type="number" min="${s.min}" max="${s.max}" step="${s.step}" value="${startLo}" title="Type a value">
        <input class="v-hi" type="number" min="${s.min}" max="${s.max}" step="${s.step}" value="${startHi}" title="Type a value">
      </div>`;
    host.appendChild(el);
    const lo=el.querySelector('.lo'), hi=el.querySelector('.hi'),
          fill=el.querySelector('.fill'), vlo=el.querySelector('.v-lo'), vhi=el.querySelector('.v-hi');
    const fmt=v=>s.step<1?(+v).toFixed(s.step<0.1?2:1):String(v);
    const paint=()=>{
      const a=+lo.value,b=+hi.value;
      let mnv=Math.min(a,b),mxv=Math.max(a,b);
      if(mnv < s.min + s.step/2) mnv = s.min;
      if(mxv > s.max - s.step/2) mxv = s.max;
      rangeState[s.key]={lo:mnv,hi:mxv};
      const pct=v=>(v-s.min)/(s.max-s.min)*100;
      fill.style.left=pct(mnv)+'%'; fill.style.width=(pct(mxv)-pct(mnv))+'%';
      vlo.value=fmt(mnv); vhi.value=fmt(mxv);
    };
    paint();
    let t;
    const onInput=()=>{ paint(); clearTimeout(t); t=setTimeout(applyFilters,150); };
    lo.addEventListener('input',onInput); hi.addEventListener('input',onInput);
    const manual=(inputEl,rangeEl)=>{
      let v=parseFloat(inputEl.value);
      if(isNaN(v)){ paint(); return; }
      v=Math.max(s.min,Math.min(s.max,v));
      rangeEl.value=v; paint(); applyFilters();
    };
    vlo.addEventListener('change',()=>manual(vlo,lo));
    vhi.addEventListener('change',()=>manual(vhi,hi));
    vlo.addEventListener('keydown',e=>{ if(e.key==='Enter') vlo.blur(); });
    vhi.addEventListener('keydown',e=>{ if(e.key==='Enter') vhi.blur(); });
    s._reset=()=>{ lo.value=s.min; hi.value=s.max; paint(); };
  });
}
/* ---------- FILTER + SORT + RENDER ---------- */
function applyFilters(keepPage){
  const q=$('#searchBox').value.trim().toLowerCase();
  filtered=movies.filter(m=>{
    if(q && !m.search.includes(q)) return false;
    for(const f of FACETS){
      const sel=selected[f.key]; if(!sel.size) continue;
      if(!sel.has(m[f.key])) return false;
    }
    for(const s of SLIDERS){
      const r=rangeState[s.key];
      if(!r) continue;
      if(r.lo>s.min || r.hi<s.max){
        const v=m[s.key];
        if(v==null || v<r.lo || v>r.hi) return false;
      }
    }
    return true;
  });
  sortNow();
  if(!keepPage) page=0;
  renderPage();
}
function sortNow(){
  const [key,dir]=$('#sortSel').value.split('|');
  const mul=dir==='desc'?-1:1;
  filtered.sort((a,b)=>{
    if(key==='sortTitle'){
      const x=(a.sortTitle||'').toLowerCase(), y=(b.sortTitle||'').toLowerCase();
      return mul*(x<y?-1:x>y?1:0);
    }
    const x=a[key], y=b[key];
    if(x==null&&y==null) return 0;
    if(x==null) return 1;
    if(y==null) return -1;
    return mul*(x-y);
  });
}
function renderPage(){
  const total=filtered.length;
  const pages=Math.max(1,Math.ceil(total/PER_PAGE));
  page=Math.min(page,pages-1);
  const start=page*PER_PAGE, end=Math.min(start+PER_PAGE,total);
  const label= total? `${start+1} - ${end} / ${total}` : '0 results';
  $('#pgLabel').textContent=label;
  const atFirst=page===0, atLast=page>=pages-1;
  $('#prevPg').disabled=atFirst;  $('#nextPg').disabled=atLast;
  const grid=$('#grid');
  // The first ~20 covers load eagerly with a high fetch priority so the top of
  // the grid fills straight away; everything below stays lazy.
  grid.innerHTML=filtered.slice(start,end).map((m,i)=>{
    const ownCls = m.own==='UPGRADE' ? 'upgrade' : m.own==='UNOWNED' ? 'unowned' : '';
    const ownTag = ownCls ? `<span class="own-tag ${ownCls}">${esc(m.own)}</span>` : '';
    return `
    <a class="card" href="${esc(m.link)||'#'}" target="_blank" rel="noopener"
       title="${esc(m.title)}${m.year?' ('+m.year+')':''}"
       style="background:${esc(m.color)||'var(--bg-soft)'}">
      ${m.img?`<img loading="${i<20?'eager':'lazy'}" ${i<10?'fetchpriority="high"':''} decoding="async"
        src="${esc(firstSrc(m.img))}" data-src="${esc(m.img)}" alt="${esc(m.title)}"
        onerror="posterError(this)">`
        :`<div class="ph">${esc(m.title)}</div>`}
      ${ownTag}
      ${m.vuduRaw?`<span class="price-tag">${esc(m.vuduRaw)}</span>`:''}
    </a>`;
  }).join('');
}
function toTop(){
  $('#grid').scrollTop=0;
  $('#pagerTop').scrollIntoView({behavior:'smooth', block:'start'});
}
function goPrev(){ if(page>0){ page--; renderPage(); toTop(); } }
function goNext(){ page++; renderPage(); toTop(); }
$('#prevPg').addEventListener('click',goPrev);
$('#nextPg').addEventListener('click',goNext);
let st; $('#searchBox').addEventListener('input',()=>{clearTimeout(st);st=setTimeout(applyFilters,220);});
$('#sortSel').addEventListener('change',()=>{sortNow();page=0;renderPage();});
function setSbCollapsed(v){
  document.body.classList.toggle('sbCollapsed',v);
  try{ localStorage.setItem('md2d_sb', v?'1':'0'); }catch(e){}
  syncPerPage();
  if(movies.length) renderPage();
}
$('#sbCollapse').addEventListener('click',()=>setSbCollapsed(true));
$('#sbExpand').addEventListener('click',()=>setSbCollapsed(false));
try{ if(localStorage.getItem('md2d_sb')==='1') document.body.classList.add('sbCollapsed'); }catch(e){}
$('#mobileFilterBtn').addEventListener('click',()=>{
  const open=document.body.classList.toggle('filtersOpen');
  $('#mobileFilterBtn').innerHTML = open ? '&#10005; Hide filters' : '&#9776; Filters &amp; search';
});
$('#resetAll').addEventListener('click',()=>{
  $('#searchBox').value='';
  FACETS.forEach(f=>selected[f.key].clear());
  document.querySelectorAll('.facet').forEach(el=>updateBadge(el,el.dataset.key));
  SLIDERS.forEach(s=>s._reset&&s._reset());
  applyFilters();
});
/* ---------- CACHE ----------
   localStorage first (survives the tab closing), sessionStorage as a fallback
   for embeds where localStorage is blocked. */
function cacheStores(){
  const out=[];
  try{ if(window.localStorage) out.push(window.localStorage); }catch(e){}
  try{ if(window.sessionStorage) out.push(window.sessionStorage); }catch(e){}
  return out;
}
function readCache(){
  for(const store of cacheStores()){
    try{
      const raw=store.getItem(CACHE_KEY);
      if(!raw) continue;
      const c=JSON.parse(raw);
      if(!c || !Array.isArray(c.d) || !c.d.length) continue;
      if(Date.now()-c.t > CACHE_TTL) continue;
      return c.d;
    }catch(e){ /* try the next store */ }
  }
  return null;
}
function writeCache(list){
  /* {timeout} matters: requestIdleCallback only fires when the page really
     goes idle, and a grid still streaming posters may never get there. On
     /sales the same code left the cache unwritten indefinitely, so every
     visit was a cold load. The timeout makes the browser run it anyway. */
  const rIC = window.requestIdleCallback;
  const idle = rIC ? (cb=>rIC(cb,{timeout:2000})) : (cb=>setTimeout(cb,1));
  idle(()=>{
    let payload;
    try{ payload=JSON.stringify({t:Date.now(), d:list}); }catch(e){ return; }
    for(const store of cacheStores()){
      try{ store.setItem(CACHE_KEY, payload); return; }catch(e){}
    }
  });
}
/* ---------- INIT ----------
   1. Cached rows paint immediately, with no network wait at all.
   2. The live sheet (already downloading since <head>) replaces them when it
      lands, keeping filters, sliders and the current page. */

/* First of these promises to hand back a non-empty list wins; null if none
   of them does. Promise.any is nearly this, but it would count a source that
   "succeeded" with zero rows as the winner and paint an empty grid. Rejected
   and empty are treated the same: not an answer, wait for the other one. */
function firstNonEmpty(promises){
  const running = promises.filter(Boolean);
  if(!running.length) return Promise.resolve(null);
  return new Promise(resolve=>{
    let left = running.length;
    const lose = () => { if(--left === 0) resolve(null); };
    running.forEach(p => p.then(v => { if(v && v.length) resolve(v); else lose(); }, lose));
  });
}

(async function init(){
  syncPerPage();
  let cached=readCache();
  /* No local cache yet (first visit, cleared storage, private window). Two
     things can paint the first screen and there is no telling in advance
     which arrives first, so race them:

       the mirror  /mirror/d2d.csv, the whole tab, from the edge. Fast and
                   predictable, but it is the entire 1.27MB export (~250KB
                   once Cloudflare compresses it -- see _headers).
       the live    the column-pruned, Own-filtered gviz query the <head>
                   script fired before this script even parsed. ~54KB, but
                   behind Google's TTFB, measured anywhere from 0.5s to 11s.

     This used to `await` the mirror unconditionally and only then look at the
     live request -- so on the runs where the live answer was already sitting
     there, the page downloaded and parsed 1.27MB it had no use for. Racing
     costs nothing extra and takes whichever route is quicker today.

     Both are parsed by this page's OWN parseCsvData/parseGviz, so there is no
     second parser to keep in step. loadData() still runs below either way. */
  if(!cached || !cached.length){
    const early = window.__MD && window.__MD.early;
    const fromLive = early ? early.then(txt=>parseGviz(unwrap(txt))) : null;
    const fromMirror = fetch(PUBLISHED_CSV_URL,{credentials:'omit'})
      .then(r=>{ if(!r.ok) throw new Error('mirror HTTP '+r.status); return r.text(); })
      .then(txt=>parseGviz(parseCsvData(txt)));
    const seed = await firstNonEmpty([fromLive, fromMirror]);
    if(seed) cached=seed;
    else console.warn('[md2d] no seed available; waiting on the live sheet');
  }
  if(cached && cached.length){
    movies=cached;
    buildFacetValues(); buildFacets(); buildSliders();
    applyFilters();
    setStatus('Checking for updates…'); setBar(0.4);
  }
  try{
    const fresh=await loadData();
    if(!fresh.length) throw new Error('no rows returned');
    setBar(0.9);
    const changed = !cached || !cached.length || JSON.stringify(fresh)!==JSON.stringify(movies);
    if(changed){
      const keepPage=page;
      movies=fresh;
      buildFacetValues(); buildFacets(); buildSliders(!!(cached&&cached.length));
      applyFilters(true);
      page=keepPage; renderPage();
    }
    writeCache(fresh);
    setBar(1); barDone(); setStatus(null);
    console.info(`[md2d] ${fresh.length} titles`);
  }catch(err){
    barDone();
    if(cached && cached.length){
      setStatus(null);
    }else{
      setStatus('Could not load the sheet.<br><small>'
        +'1. Check the spreadsheet is shared as &ldquo;Anyone with the link &ndash; Viewer&rdquo;.<br>'
        +'2. If it still fails, in the Sheet use File &rarr; Share &rarr; Publish to web &rarr; the MD2D tab &rarr; CSV,<br>'
        +'&nbsp;&nbsp;&nbsp;&nbsp;then paste that link into PUBLISHED_CSV_URL near the top of this embed code.<br>'
        +'<span style="color:#607d8b">('+esc(err.message)+')</span></small>', false, true);
    }
  }
})();
</script>
