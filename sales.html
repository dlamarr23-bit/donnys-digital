<!-- ===================================================================
     POSTER ROUTING -- runs before anything else in the page.

     Rewrites the src of every <img>, now and as the grid renders more, to
     load through this domain via this site's own /img proxy instead of straight
     from the image host.

     Two reasons, in order of how much they matter:

     1. Networks that filter on hostname (a work network, some ISPs) block
        images2.vudu.com outright, and the fallback proxies the pages walk
        through -- cdn.statically.io, i0.wp.com, wsrv.nl -- are separate
        hostnames that can be blocked just as easily. Routed through here
        the browser only ever connects to this site, so there is nothing
        for a host-based filter to match. (Confirmed working on a network
        that was blocking Vudu.)

     2. Resizing: this USED to also re-encode, when the proxy was Netlify's
        Image CDN -- a poster arrived as ~10KB of webp instead of ~40KB of
        source jpeg. On Cloudflare Pages there is no image-processing step,
        so the &w= and &fm= below are sent and ignored, and posters arrive
        at their original size and format. See README.md "Posters".

     The host allowlist lives in functions/img.js -- a URL whose host is not
     on that list is refused, so add the host there before pointing anything
     new at it. (It used to be [images] remote_images in netlify.toml, which
     Cloudflare does not read.)
     =================================================================== -->
<script>
(function () {
  var PROXY  = "/img";
  var WIDTH  = 300;      // poster cards render ~150px wide; 300 covers retina
  var FORMAT = "webp";   // smaller than the source jpg

  function proxied(u) {
    if (!u) return u;
    u = String(u).trim();
    if (!/^(https?:)?\/\//i.test(u)) return u;              // relative -> leave alone
    if (u.indexOf(PROXY + "?url=") === 0) return u;         // already proxied
    if (u.indexOf("//" + location.host) !== -1) return u;   // same-site -> leave alone
    if (u.slice(0, 2) === "//") u = "https:" + u;
    else if (u.slice(0, 5).toLowerCase() === "http:") u = "https:" + u.slice(5);
    return PROXY + "?url=" + encodeURIComponent(u) + "&w=" + WIDTH + "&fm=" + FORMAT;
  }

  function fix(el) {
    if (!el || el.tagName !== "IMG") return;
    var src = el.getAttribute("src");
    var next = proxied(src);
    if (next && next !== src) el.setAttribute("src", next);
  }

  function scan(root) {
    if (!root || root.nodeType !== 1) return;
    fix(root);
    if (root.querySelectorAll) {
      var imgs = root.querySelectorAll("img");
      for (var i = 0; i < imgs.length; i++) fix(imgs[i]);
    }
  }

  new MutationObserver(function (mutations) {
    for (var i = 0; i < mutations.length; i++) {
      var m = mutations[i];
      if (m.type === "attributes") fix(m.target);
      else for (var j = 0; j < m.addedNodes.length; j++) scan(m.addedNodes[j]);
    }
  }).observe(document.documentElement, {
    childList: true, subtree: true, attributes: true, attributeFilter: ["src"]
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { scan(document.body); });
  } else {
    scan(document.body);
  }
})();
</script>
<script>
/* ============ EDGE SHEET CACHE (functions/sheet.js) ============
   Shared by every page. Same block in each file -- keep them in step.

   Google takes 0.5-14s to answer a sheet request and forbids CDNs from keeping
   a copy, which is why every page used to show its cached grid and then sit
   on "Checking for changes..." for several seconds. /sheet keeps that copy at
   Cloudflare's edge instead.

     __edge.fast(url)     -> the edge's copy, however old, in ~50ms
     __edge.confirm(url)  -> a copy no older than FRESH_S, waiting on Google
                             only if the edge has nothing that recent
     __edge.isOld(r)      -> true when a fast answer still needs confirming

   Each resolves to {res, age, how}: `res` is the fetch Response (body unread,
   so callers can stream it), `age` its age in seconds, `how` where it came
   from. The pages paint the fast answer straight away and run the confirm
   pass silently behind it, so the data is still live -- it just no longer
   holds anything up.

   If /sheet is missing (local preview, a host without Functions) or fails,
   this goes straight to Google exactly as the pages always did. */
(function(){
  var FRESH_S=60;
  var off=false;
  function opts(signal){ var o={credentials:'omit'}; if(signal) o.signal=signal; return o; }
  function direct(url, signal){
    return fetch(url,opts(signal)).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return {res:r, age:0, how:'DIRECT'};
    });
  }
  function viaEdge(url, fresh, signal){
    if(off) return direct(url, signal);
    var u='/sheet?u='+encodeURIComponent(url)+(fresh==null?'':'&fresh='+fresh);
    return fetch(u,opts(signal)).then(function(r){
      var how=r.headers.get('X-Sheet-Cache');
      /* No header means this was not the function answering (a 404 page, a
         static server) -- stop asking it for the rest of this visit. */
      if(!how){ off=true; return direct(url, signal); }
      if(!r.ok) throw new Error('sheet HTTP '+r.status);
      return {res:r, age:+(r.headers.get('X-Sheet-Age')||0), how:how};
    }).catch(function(e){
      if(off || (e && e.name==='AbortError')) throw e;
      try{ console.warn('[edge] /sheet unavailable, using Google directly:', (e&&e.message)||e); }catch(x){}
      return direct(url, signal);
    });
  }
  window.__edge={
    FRESH_S:FRESH_S,
    fast:function(url,signal){ return viaEdge(url,null,signal); },
    confirm:function(url,maxAge,signal){ return viaEdge(url, maxAge==null?FRESH_S:maxAge, signal); },
    isOld:function(r){ return !!r && (r.age>FRESH_S || r.how==='ERROR-STALE'); },
    text:function(p){ return p.then(function(r){ return r.res.text().then(function(t){ r.text=t; return r; }); }); }
  };
})();
</script>

/* ============ CRITICAL CSS ============
   Only the loading indicator, inlined ahead of everything else so the bar and
   spinner are on screen in the first painted frame -- before the main
   stylesheet, the fonts, or a single tab of data. */
html,body{margin:0;padding:0;background:#171C20}
#topbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:200;
  background:rgba(255,255,255,.09);overflow:hidden}
#topbar.done{opacity:0;transition:opacity .4s .25s}
#topfill{height:100%;width:0;background:linear-gradient(90deg,#004A75,#007BC4,#4FA8E0);
  transition:width .3s ease-out}
#topbar.indet #topfill{width:38%;animation:ddslide 1.15s ease-in-out infinite}
@keyframes ddslide{0%{transform:translateX(-110%)}100%{transform:translateX(275%)}}
#status{position:fixed;top:23px;left:50%;transform:translateX(-50%);z-index:201;
  display:flex;flex-direction:row;gap:10px;align-items:center;
  background:#263238;border-radius:20px;padding:8px 17px 8px 13px;
  font:700 12.5px 'Poppins','Segoe UI',system-ui,sans-serif;letter-spacing:.5px;color:#cfd8dc;
  box-shadow:0 4px 16px rgba(0,0,0,.55);max-width:min(92vw,520px)}
#status.hidden{display:none}
#status.err{background:#b71c1c;color:#fff;border-radius:10px;text-align:left}
#status small{font-weight:700;line-height:1.6;display:block}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.22);border-top-color:#fff;
  border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{border-radius:6px;height:0;padding-bottom:150%;background:#1f262b;
  animation:ddpulse 1.5s ease-in-out infinite}
@keyframes ddpulse{0%,100%{opacity:.5}50%{opacity:.92}}
@media(prefers-reduced-motion:reduce){
  .spin,.skel{animation:none}
  #topbar.indet #topfill{animation:none;width:100%}
}
</style>

<style>
:root{
  --bg:#171C20;
  --bg-soft:#1f262b;
  --pill:#ffffff;
  --pill-text:#37474f;
  --bar:#8a9096;
  --bar-text:#ffffff;
  --accent:#007BC4;
  /* Same hue, lifted, for the places where --accent has to carry meaning as a
     thin line or small text on the dark sidebar rather than as a filled pill
     (an adjusted slider). Same value as the Collection page. */
  --accent-bright:#3AA0E3;
  --track:#4a565e;
  --track-fill:#eceff1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg)}
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{
  background:var(--bg);
  font-family:'Poppins','Segoe UI',sans-serif;
  font-weight:700;
  color:#eceff1;
  overflow:hidden;
}
/* One typeface, one weight, everywhere. Form controls don't inherit font by
   default, so they're named explicitly rather than left to the UA stylesheet. */
body, input, select, textarea, button, optgroup, option{
  font-family:'Poppins','Segoe UI',sans-serif;
  font-weight:700;
}
#app{display:flex;height:100%}
/* ---------- SIDEBAR ---------- */
#sidebar{
  width:250px;min-width:250px;
  padding:16px 12px 30px 14px;
  height:100%;
  overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:#4a565e transparent;
}
#sidebar::-webkit-scrollbar{width:6px}
#sidebar::-webkit-scrollbar-thumb{background:#4a565e;border-radius:3px}
/* Every colour here is declared outright, as on the Collection page. With
   color-scheme:dark on the page a field that leans on the browser's default
   form-control white turns dark grey, leaving dark text and a dark caret on a
   dark box -- never let a control's legibility depend on a UA default. */
/* Same white pill as the facet buttons below it, pinned to the light scheme
   with its colours set explicitly. */
#searchBox{
  width:100%;padding:5px 9px;border:none;border-radius:8px;
  background:var(--pill);color:var(--pill-text);color-scheme:light;
  font:700 12.5px 'Poppins',sans-serif;letter-spacing:.6px;
  caret-color:var(--pill-text);
  margin-bottom:12px;outline:none;transition:box-shadow .15s;
}
#searchBox::placeholder{color:#78909c;text-transform:uppercase;letter-spacing:1.2px}
#searchBox:hover{box-shadow:0 0 0 2px rgba(255,255,255,.25)}
/* outline:none removes the browser's focus ring, so give the field its own. */
#searchBox:focus{box-shadow:0 0 0 2px var(--accent)}
.facet{position:relative;margin-bottom:10px}
.facet-btn{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  background:var(--pill);color:var(--pill-text);
  border:none;border-radius:8px;padding:5px 7px;cursor:pointer;
  font:700 12.5px 'Poppins',sans-serif;letter-spacing:1.2px;text-transform:uppercase;
  transition:box-shadow .15s;
}
.facet-btn:hover{box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.facet-btn .icon{font-size:13px;color:#607d8b;transition:transform .2s}
.facet.open .facet-btn .icon{transform:rotate(180deg)}
.facet-btn .count-badge{
  background:var(--accent);color:#fff;border-radius:10px;
  font-size:10px;padding:1px 7px;margin-left:auto;margin-right:8px;
}
.facet-panel{
  display:none;position:relative;z-index:30;
  background:#fff;border-radius:8px;margin-top:5px;
  box-shadow:0 8px 22px rgba(0,0,0,.45);
  padding:8px;color:var(--pill-text);
}
.facet.open .facet-panel{display:block}
/* On a white panel, so it is pinned to the light scheme and given its colours
   explicitly -- the same UA-default trap as #searchBox, inverted: with
   color-scheme:dark inherited from the page it would render as a dark grey
   box in the middle of a white popover. */
.facet-panel input.opt-search{
  width:100%;padding:6px 9px;margin-bottom:6px;
  border:1px solid #cfd8dc;border-radius:5px;font:700 12.5px 'Poppins',sans-serif;outline:none;
  color-scheme:light;background:#ffffff;color:var(--pill-text);
}
.facet-panel input.opt-search::placeholder{color:#90a4ae}
.opt-list{max-height:240px;overflow-y:auto;scrollbar-width:thin}
.opt-list label{
  display:flex;align-items:center;gap:8px;
  font:700 13px 'Poppins',sans-serif;padding:5px 6px;border-radius:4px;cursor:pointer;
}
.opt-list label:hover{background:#eceff1}
.opt-list input{accent-color:var(--accent)}
.opt-list .n{margin-left:auto;color:#90a4ae;font-size:11px}
.opt-more{font-size:11px;color:#90a4ae;padding:5px 6px}
.facet-clear{
  display:block;width:100%;margin-top:6px;padding:6px;
  background:#eceff1;border:none;border-radius:5px;cursor:pointer;
  font:700 11px 'Poppins',sans-serif;letter-spacing:1px;text-transform:uppercase;color:#546e7a;
}
.facet-clear:hover{background:#cfd8dc}
/* Shown at the top of a facet panel that intersects rather than unions. Sales
   has no such facet today; kept identical to the Collection page so one can be
   added without restyling. */
.facet-hint{
  font:700 10px 'Poppins','Segoe UI',sans-serif;color:#78909c;
  letter-spacing:.2px;line-height:1.45;padding:0 2px 7px;
}
/* Sidebar controls are inert until the sales have been indexed -- ticking a
   facet built off the skeleton would filter nothing. */
#sidebar.pending #facets,#sidebar.pending #sliders{opacity:.45;pointer-events:none}
/* The quick filters sit on a white pill, so their checkboxes are pinned to the
   light scheme -- color-scheme:dark would draw them as dark squares on white. */
#quickFilters{
  background:var(--pill);border-radius:8px;padding:4px 10px;margin-bottom:10px;
  color-scheme:light;
}
#quickFilters .quick-check{
  display:flex;align-items:center;gap:8px;padding:4px 1px;cursor:pointer;
  font:700 12px 'Poppins',sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--pill-text);
}
#quickFilters .quick-check:first-child{border-bottom:1px solid #eceff1}
#quickFilters .quick-check input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
/* sort -- copied from the Collection page.
   The native <select> is kept for state (and for keyboard/AT users) but is
   never painted: Chrome on Windows draws a select's dropdown list with the OS
   menu font, so the options came out in Segoe UI no matter what font-family
   the select carried. The list below is plain markup, so it honours Poppins. */
#sortWrap{position:relative;margin-bottom:10px}
#sortSel{
  position:absolute;width:1px;height:1px;padding:0;margin:0;border:0;
  opacity:0;pointer-events:none;clip:rect(0 0 0 0);overflow:hidden;
}
#sortBtn{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--pill);color:var(--pill-text);text-align:left;
  border:none;border-radius:8px;padding:5px 6px;cursor:pointer;
  font:700 12.5px 'Poppins','Segoe UI',sans-serif;letter-spacing:1.2px;text-transform:uppercase;
  outline:none;transition:box-shadow .15s;
}
#sortBtn:hover{box-shadow:0 0 0 2px rgba(255,255,255,.25)}
#sortBtn .icon{font-size:13px;color:#607d8b;transition:transform .2s;flex:none}
#sortWrap.open #sortBtn .icon{transform:rotate(180deg)}
#sortLabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#sortPanel{
  display:none;position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:60;
  background:#fff;border-radius:8px;box-shadow:0 8px 22px rgba(0,0,0,.45);
  padding:6px;max-height:340px;overflow-y:auto;scrollbar-width:thin;
}
#sortWrap.open #sortPanel{display:block}
#sortPanel button{
  display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
  padding:7px 9px;border-radius:5px;color:var(--pill-text);
  font:700 11.5px 'Poppins','Segoe UI',sans-serif;letter-spacing:.4px;
  text-transform:uppercase;white-space:nowrap;
}
#sortPanel button:hover{background:#eceff1}
#sortPanel button[aria-selected="true"]{background:var(--accent);color:#fff}
/* sliders */
.slider-group{margin:11px 2px 3px;text-align:center}
.slider-group .sl-title{
  font:700 13px 'Poppins',sans-serif;letter-spacing:1.6px;text-transform:uppercase;
  color:#eceff1;margin-bottom:2px;
}
.range-wrap{position:relative;height:22px}
.range-wrap .rail{
  position:absolute;top:9px;left:0;right:0;height:3px;border-radius:2px;background:var(--track);
}
.range-wrap .fill{
  position:absolute;top:9px;height:3px;border-radius:2px;background:var(--track-fill);
}
.range-wrap input[type=range]{
  position:absolute;top:0;left:0;width:100%;height:22px;
  -webkit-appearance:none;appearance:none;background:transparent;pointer-events:none;margin:0;
}
.range-wrap input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;pointer-events:auto;
  width:14px;height:14px;border-radius:50%;background:#fff;
  border:none;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.5);
}
.range-wrap input[type=range]::-moz-range-thumb{
  pointer-events:auto;width:14px;height:14px;border-radius:50%;
  background:#fff;border:none;cursor:pointer;
}
.sl-vals{display:flex;justify-content:space-between;margin-top:2px}
.sl-vals input{
  background:transparent;border:none;border-bottom:1px solid #eceff1;
  color:#eceff1;font:700 13px 'Poppins',sans-serif;text-align:center;
  width:56px;padding:1px 2px;outline:none;color-scheme:dark;cursor:text;
}
/* A slider pulled off its ends is narrowing the wall, and nothing used to say
   so: the two numbers underneath read as "the range of the data", not as "a
   filter you set". So an adjusted slider goes blue -- title, fill, both thumbs
   and both value fields -- exactly as on the Collection page. --accent-bright
   rather than --accent: a 3px #007BC4 line on the #4a565e rail reads as
   "slightly different track", not as blue. */
.slider-group.active .sl-title{color:var(--accent-bright)}
.slider-group.active .fill{background:var(--accent-bright)}
.slider-group.active input[type=range]::-webkit-slider-thumb{background:var(--accent-bright)}
.slider-group.active input[type=range]::-moz-range-thumb{background:var(--accent-bright)}
.slider-group.active .sl-vals input{color:var(--accent-bright);
  border-bottom-color:var(--accent-bright)}
.sl-vals input:focus{border-bottom-color:#fff;background:rgba(255,255,255,.08)}
.sl-vals input::-webkit-outer-spin-button,
.sl-vals input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sl-vals input[type=number]{-moz-appearance:textfield;appearance:textfield}
/* Green, as on the Collection page. #157A60 rather than a lighter green: white
   11px bold text on it clears 4.5:1 (5.27:1); the hover stays above it too. */
#resetAll{
  margin-top:22px;width:100%;padding:5px;border:1px solid #157A60;border-radius:8px;
  background:#157A60;color:#ffffff;cursor:pointer;
  font:700 11px 'Poppins',sans-serif;letter-spacing:1.5px;text-transform:uppercase;
}
#resetAll:hover{background:#168264;border-color:#168264;color:#ffffff;
  box-shadow:0 0 0 2px rgba(255,255,255,.25)}
/* collapse control (desktop only) */
/* Every button that talks about filters is the Reset-all green. */
#sbCollapse{
  width:100%;margin-bottom:10px;padding:8px;border:1px solid #157A60;border-radius:8px;
  background:#157A60;color:#ffffff;cursor:pointer;
  font:700 11px 'Poppins',sans-serif;letter-spacing:1.5px;text-transform:uppercase;
}
#sbCollapse:hover{background:#168264;border-color:#168264;color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
#sbExpand{
  display:none;width:34px;min-width:34px;height:100%;
  background:#157A60;border:none;cursor:pointer;color:#ffffff;font-size:17px;
  align-items:center;justify-content:center;
}
#sbExpand:hover{background:#168264;color:#fff}
@media(min-width:761px){
  body.sbCollapsed #sidebar{display:none}
  body.sbCollapsed #sbExpand{display:flex}
  body.sbCollapsed #grid{grid-template-columns:repeat(12,1fr)}
}
@media(max-width:760px){
  #sbCollapse,#sbExpand{display:none !important}
}
/* ---------- MAIN ---------- */
#main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;padding:14px 10px 14px 4px;position:relative}
.pagerBar{
  display:flex;align-items:center;
  background:var(--bar);border-radius:6px;height:52px;
  user-select:none;
}
#pagerTop{margin-bottom:12px}
.pagerBar .pg-arrow{
  width:132px;height:100%;display:flex;align-items:center;justify-content:center;
  background:transparent;border:none;color:#fff;font-size:39px;cursor:pointer;border-radius:6px;
}
/* Hover makes the arrow itself bigger instead of lighting a box behind it;
   the button keeps its size, so the bar never moves. */
.pagerBar .pg-arrow{transition:font-size .12s ease}
.pagerBar .pg-arrow:hover:not(:disabled){font-size:56px}
.pagerBar .pg-arrow:disabled{opacity:.35;cursor:default}
.pagerBar .pg-label{
  flex:1;text-align:center;
  font:700 clamp(19px,4.2vw,34px) 'Poppins',sans-serif;letter-spacing:1.4px;color:var(--bar-text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* Every active facet pick, shown above the wall so it is still obvious what the
   grid is narrowed to once the facet panel is shut or the whole sidebar is
   collapsed. Same CSS as the Collection page: the facet name is set smaller
   and half-transparent rather than given its own colour, and only the value
   may shrink, so a long studio name ellipses instead of pushing the ✕ off. */
#chipRow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}

<script>
/* ================= CONFIGURATION ================= */
const SHEET_ID = '1Sb1-8n4CL1of7YR7kUzP9uh3VQtUMr1du2Y_hQgqw7U';
// ---- Server-side row filter -------------------------------------------------
// Every tab carries its formulas dragged down thousands of rows past the last
// real title, so a plain request hands back ~118,000 rows to deliver ~1,400
// with a title in them. gviz speaks a SQL-ish dialect, so the blanks can be
// dropped by Google before anything crosses the wire. Each tab below declares
// which COLUMN LETTER holds its Title, and that letter is what the query
// tests. Nothing is added to the spreadsheet itself.
//   daily movies / Fanflix -> Title is column F
//   daily TV / Mix & Match -> Title is column G
// Load the page with ?nofilter to turn this off and compare.
const SHEET_QUERY_FILTER = !/[?&]nofilter\b/.test(location.search);
// ---- Poster sizing ----------------------------------------------------------
// Vudu poster URLs end in a pixel width: .../poster2/<id>-168. The old code
// asked the image proxies to render those at w=400, which upscales a 168px
// source: more bytes, more proxy CPU, not one pixel of extra detail. Now the
// source width and the requested width are the same number, set once here.
// 168 is what the sheet's own Image URL column uses, so it's known-good. Try
// 340 if you want sharper posters on a hi-dpi screen.
const POSTER_W = 168;
const IMG_BASE   = 'https://images2.vudu.com/poster2/';
const LINK_BASE  = 'https://athome.fandango.com/content/movies/details/title/';
// ---- Covers per page --------------------------------------------------------
// The grid is 10 columns with the sidebar open and 12 with it hidden, so these
// are exactly 10 full rows either way -- no half-empty last row.
// Posters past the first ~20 are loading="lazy", so raising these does not
// delay the first covers appearing; it only means more images to pull if you
// scroll the whole page.
const PAGE_SIZES = { mobile:148, wide:120, normal:100 };
// ---- Caching ----------------------------------------------------------------
// The last visit's rows are kept so a revisit paints instantly instead of
// waiting on 46 tabs. Fresh data still loads behind it every time; the cache
// only removes the wait before first paint.
//
// Kept in IndexedDB now, in the SAME database the Collection page uses
// ('dd-cache' v1, object store 'kv') under this page's own key. localStorage
// was the previous home (and sessionStorage before that, which died with the
// tab): it is synchronous, so JSON.parse of ~1,400 titles ran on the main
// thread in front of the first paint, and it shares a ~5MB quota with
// everything else on the origin. IndexedDB stores the structured rows as-is,
// off the main thread.
//
// What is stored is the PARSED ROWS PER TAB, each stamped with how old its
// data was when it arrived -- not the merged grid. That is what lets every
// source (this cache, the deploy-time snapshot, the edge's fast copy, the
// confirm pass) be combined tab by tab, newest wins, and what lets a tab that
// fails to load keep its last known rows instead of punching a hole in the
// grid. The merge itself is cheap and simply re-run.
//
// TTL for PAINTING from it is long (7 days) on purpose: a refresh always runs
// right behind the paint, so an old cache costs a second of yesterday's sales,
// never wrong data.
const IDB_NAME = 'dd-cache', IDB_STORE = 'kv';
const IDB_KEY  = 'sales:v1';
const CACHE_TTL = 7 * 24 * 60 * 60 * 1000;
// The previous localStorage cache (merged items, not per tab). Read ONCE as a
// fallback so the first visit after this change still paints instantly, and
// removed after the first successful IndexedDB write so there are never two
// copies of the same thing.
const LEGACY_CACHE_KEY = 'donnys-sales:v3';
// Sidebar collapse is remembered per page (the Collection page has its own).
const SB_KEY = 'dd_sb_sales';
// ---- First paint ------------------------------------------------------------
// When on, the two Today tabs load first and paint by themselves before the
// other 42 arrive. In practice Today holds only a handful of titles and the
// default sort is cheapest-first across EVERYTHING, so that early grid gets
// almost entirely reordered a second later -- it reads as a flash rather than
// as progress. Off by default: the grid stays empty behind a live tab counter
// and paints once, complete. Turn it back on if Today's tab grows enough to
// carry a first screen on its own.
const EARLY_PAINT = false;
// How many tabs to have in flight at once. docs.google.com is HTTP/2, so these
// multiplex over one connection rather than queueing. Measured against the live
// sheet, all 44 tabs: pool 8 -> 5.4s, pool 20 -> 2.7s, pool 40 -> 2.5s. The
// curve is flat past ~20 because Google, not the connection, is the limit.
//
// 32 DID push into that ceiling: Google answered 429 on two of the 46 tabs,
// and before the retry in loadTab() those two were dropped in silence. 16
// keeps nearly all the speed (the curve is close to flat from 8 up) and stops
// provoking the limit in the first place; the retry is the safety net, not
// the plan. Raise this only alongside a check that failedTabs stays empty.
const POOL = 16;
// There used to be a REFRESH_DELAY_MS here: with a cache on screen the refresh
// waited for window load plus an idle slot, because 46 requests to Google
// competed with the covers for bandwidth for several seconds. Through the edge
// (__edge.fast) the same 46 answers are a few KB each and come back in tens
// of milliseconds, so there is nothing left to get out of the way of -- the
// refresh now starts right after the cached paint, and the only wait left is
// one task so that paint is committed first. The slow part -- making sure the
// edge's copy is not too old -- is the silent confirm pass, which runs once the
// page is idle (see confirmLater()).
// Tab groups. Each entry carries a name, a "where" label, a type, the tag
// shown on the card, the column letter holding its Title, and (where known)
// the numeric #gid= from the sheet URL. Fetching by gid is unambiguous;
// fetching by NAME through gviz can silently fall back to the first tab --
// which is exactly why "Today TV" once returned the "Today" tab's data.
// `priority` marks the two tabs the default view is built from: they load
// first and paint on their own, then everything else merges in behind them.
const TABS = [];
// gid for EVERY tab, read off the live workbook. This is not a micro-optimisation:
// three tabs are named with a trailing space ("Today TV ", "T TV ", "W TV "), and
// when gviz cannot resolve a name it does not fail -- it silently answers with the
// FIRST tab in the workbook. So `sheet=T TV` was returning the *Today movies* tab,
// the schema guard in parseTabRows correctly threw the rows away, and 142 rows of
// Tuesday TV never reached the page. Fetching by gid is exact, so those rows are
// back, and the "try the name, then name+space, then collapsed spaces" retry chain
// (up to 3 requests for a tab that resolves wrong) is gone.
[['Today','Today','1086343653'],['M','Mon','1876860810'],['T','Tue','967611835'],
 ['W','Wed','1842298070'],['Th','Thu','615215644'],['F','Fri','180674901'],
 ['Sat','Sat','1457107899'],['Sun','Sun','864620682']]
  .forEach(([t,d,gid])=>TABS.push({name:t, gid, where:'Daily Sales', type:'Movies', tag:d,
                                   titleCol:'F', priority:t==='Today'}));
[['Today TV','Today','1848983867'],['M TV','Mon','1477357018'],['T TV','Tue','1511704700'],
 ['W TV','Wed','1889687096'],['Th TV','Thu','647897415'],['F TV','Fri','792440283'],

/* ---------- POSTER PROXYING ----------
   Vudu poster URLs are blocked outright on some networks, so an image proxy is
   kept as a fallback. Both of the proxies that used to be tried FIRST are now
   dead, and they were being tried on every poster of every fresh visit:

     wsrv.nl            -> 404 ("The requested URL returned error: 403").
                           images2.vudu.com refuses wsrv's fetcher outright.
     cdn.statically.io  -> 403. Statically disabled its /img/ endpoint entirely
                           ("Due to abuse and high traffic...").

   So every cover paid two failed round-trips (~1.2s of pure waste, measured)
   before reaching the one that works. The chain is now ordered by what actually
   answers: Vudu's own CDN first (no proxy hop at all), then Photon (i0/i1.wp.com)
   for networks that block vudu.com.

   The winner is also remembered in localStorage rather than sessionStorage --
   sessionStorage dies with the tab, so discovery was being repeated on every
   genuine visit. And a locked proxy that later starts failing now unlocks
   itself, so a future outage costs one round of discovery, not every poster. */
const stripScheme = u => u.replace(/^https?:\/\//,'');
const VUDU_PROXIES = [
  u => u,                                                            // direct: fastest when reachable
  u => 'https://i0.wp.com/' + stripScheme(u) + '?w=' + POSTER_W,      // Photon
  u => 'https://i1.wp.com/' + stripScheme(u) + '?w=' + POSTER_W,      // Photon, second shard
];
const isVudu = u => /vudu\.com/i.test(u);
// Rewrite any Vudu poster URL to the width we actually display, whether it
// came from the sheet's Image URL column or was built from a Content ID.
const sizePoster = u => u ? u.replace(/(\/poster2\/\d+)-\d+/, '$1-'+POSTER_W) : '';
const PROXY_KEY = 'donnys-sales:proxy2';   // new key: the old one holds a now-invalid index
let proxyIdx = 0, proxyLocked = false;
function proxyStore(){
  try{ if(window.localStorage) return window.localStorage; }catch(e){}
  try{ if(window.sessionStorage) return window.sessionStorage; }catch(e){}
  return null;
}
try{
  const saved = proxyStore() && proxyStore().getItem(PROXY_KEY);
  if(saved!==null && saved!==undefined){ proxyIdx = Math.min(+saved, VUDU_PROXIES.length-1); proxyLocked = true; }
}catch(e){}
function proxyChain(orig){
  return isVudu(orig)
    ? VUDU_PROXIES.map(fn=>fn(orig))
    : [orig, 'https://i0.wp.com/' + stripScheme(orig) + '?w=' + POSTER_W];
}
function lockProxy(i){
  if(proxyLocked && proxyIdx===i) return;
  proxyIdx = i; proxyLocked = true;
  try{ const s=proxyStore(); if(s) s.setItem(PROXY_KEY, String(i)); }catch(e){}
}
// A remembered proxy that has started failing must not keep being handed to
// every new poster. The first cover to fall past it reopens discovery.
function unlockProxy(){
  if(!proxyLocked) return;
  proxyLocked = false;
  try{ const s=proxyStore(); if(s) s.removeItem(PROXY_KEY); }catch(e){}
}
function makePoster(m){
  const img=document.createElement('img');
  const orig=m.img;
  // Lazy until renderPage() knows where the card sits: it flips the first 20 of
  // a page to eager (and the first 10 to fetchpriority=high) before the card
  // is attached, the same split the Collection page uses. 250x375 is the same
  // intrinsic box index declares -- it only fixes the 2:3 ratio; the source
  // pixel width is still POSTER_W.
  img.loading='lazy'; img.decoding='async';
  img.width=250; img.height=375;
  img.alt=m.title;
  const start = isVudu(orig) ? proxyIdx : 0;
  img.dataset.try = String(start);
  img.src = proxyChain(orig)[start];
  img.addEventListener('load', ()=>{ if(isVudu(orig)) lockProxy(+img.dataset.try); }, {once:true});
  img.addEventListener('error', ()=>{
    // The proxy we had remembered just failed. Stop handing it to new posters.
    if(isVudu(orig) && +img.dataset.try === proxyIdx) unlockProxy();
    const chain = proxyChain(orig);
    const next = (+img.dataset.try) + 1;
    if(next < chain.length){ img.dataset.try = String(next); img.src = chain[next]; return; }
    const parent = img.parentNode;
    img.remove();
    if(parent){
      const ph=document.createElement('div');
      ph.className='ph'; ph.textContent=m.title;
      parent.insertBefore(ph, parent.firstChild);
    }
  });
  return img;
}

function gvizUrl(tab, sel){
  const base=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?headers=${tab.headerRows||1}`;
  const target = /^\d+$/.test(sel) ? `&gid=${sel}` : `&sheet=${encodeURIComponent(sel)}`;
  const col=tab.titleCol;
  const q = (SHEET_QUERY_FILTER && col && !tab._noFilter)
    ? '&tq=' + encodeURIComponent(`select * where ${col} is not null and ${col} <> ''`)
    : '';
  /* NO cache-buster on this URL any more. It used to end in &_=<five-minute
     bucket> to step past the browser's copy, but the URL is now also the
     edge's cache KEY (functions/sheet.js keys on the full Google URL), so a
     bucket would hand the edge a brand-new key every five minutes -- a
     guaranteed miss that waits on Google, which is the exact cost /sheet
     exists to remove. The edge answers no-store and stamps X-Sheet-Age, so
     the browser never holds a stale copy of it anyway. The JSONP fallback,
     which talks to Google directly, still adds the bucket (see bust()). */
  return `${base}${target}${q}`;
}
// Only for requests that go straight to Google (the JSONP <script>), where the
// browser's own cache is the thing to step past.
const bust = url => url + '&_=' + Math.floor(Date.now()/300000);
/* Every fetch() of the sheet goes through the edge (functions/sheet.js):
     confirm=false  __edge.fast    -- whatever copy the edge has, in ~50ms
     confirm=true   __edge.confirm -- a copy no older than __edge.FRESH_S
   __edge itself falls back to Google directly if /sheet is unavailable.
   Resolves to {json, meta}; meta is {age, how} as the edge reported it, which
   is how a tab's answer gets stamped with how old its data really is and how
   the page knows which tabs still need the confirm pass. */
async function fetchGviz(url, confirm){
  const full=url+'&tqx=out:json';
  const e=await (confirm ? window.__edge.confirm(full) : window.__edge.fast(full));
  const txt=await e.res.text();
  const json=JSON.parse(txt.substring(txt.indexOf('(')+1, txt.lastIndexOf(')')));
  if(json && json.status==='error')
    throw new Error((json.errors&&json.errors[0]&&json.errors[0].detailed_message)||'sheet error');
  return {json, meta:{age:e.age, how:e.how}};
}
// JSONP cannot go through /sheet (it is a <script> tag, and the edge answers
// text/plain). It is Google directly, so its answer is as fresh as it gets.
function jsonpGviz(url){
  return new Promise((resolve,reject)=>{
    const cb='__gviz_cb_'+Math.random().toString(36).slice(2);
    const timer=setTimeout(()=>{ cleanup(); reject(new Error('timed out')); },20000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; script.remove(); }
    window[cb]=json=>{
      cleanup();
      if(json && json.status==='error'){
        reject(new Error((json.errors&&json.errors[0]&&json.errors[0].detailed_message)||'sheet returned an error'));
      } else resolve({json, meta:{age:0, how:'JSONP'}});
    };
    const script=document.createElement('script');
    script.src=bust(url)+'&tqx=out:json;responseHandler:'+cb;
    script.onerror=()=>{ cleanup(); reject(new Error('script blocked or sheet not public')); };
    document.head.appendChild(script);
  });
}
/* ---------- TRANSPORT ----------
   This used to start at null, meaning "race fetch() and JSONP, keep whichever
   answers first". The intent was one race on one tab -- but the pool starts
   every worker at the same instant, so all of them entered the race before any
   of them had set TRANSPORT. Measured against the live sheet: 44 tabs cost 66
   network requests at a pool of 20, and 78 at a pool of 32. The race was
   scaling with the pool, not running once.

   gviz answers with `Access-Control-Allow-Origin` echoing the caller (verified
   against the live sheet), so a plain fetch() works from any real origin. That
   makes 'fetch' the correct starting point and costs ONE request per tab.

   JSONP is still the fallback, and still the thing that saves a page opened
   straight off disk (a file:// page has a null origin, which Google rejects).
   After three consecutive fetch failures the remaining tabs stop paying for a
   doomed fetch each and go to JSONP directly. */
let TRANSPORT = 'fetch';
let fetchFails = 0;
function raceGviz(url, confirm){
  if(TRANSPORT==='fetch'){
    return fetchGviz(url, confirm).then(v=>{ fetchFails=0; return v; })
                         .catch(()=>{ if(++fetchFails>=3) TRANSPORT='jsonp'; return jsonpGviz(url); });
  }
  if(TRANSPORT==='jsonp') return jsonpGviz(url).catch(()=>fetchGviz(url, confirm));
  return new Promise((resolve,reject)=>{
    let done=false, left=2; const errs=[];
    const ok=mode=>v=>{ if(!done){ done=true; TRANSPORT=mode; resolve(v); } };
    const fail=e=>{ errs.push(e&&e.message||String(e)); if(--left===0 && !done) reject(new Error(errs.join(' | '))); };
    fetchGviz(url, confirm).then(ok('fetch'),fail);
    jsonpGviz(url).then(ok('jsonp'),fail);
  });
}
// Every tab now carries a gid, so this is one request in the normal case. The
// name-based fallbacks are still here for a tab whose gid is changed out from
// under us (deleting and recreating a tab issues a new gid), but they are a
// genuine last resort rather than the primary path -- and they are only reached
// after the gid request has actually FAILED, never when it merely answers with
// the wrong tab, which is what used to lose "T TV" and "W TV".
/* Google answers 429 when 46 tab requests go out at once -- seen twice in a
   single load at POOL 32. A 429 says nothing about the tab; it is transient and
   clears on a retry. The old code could not tell it apart from "tab missing or
   renamed", so it returned null, loadTabs() dropped the rows on the floor, and
   the page still reported "822 titles from 46 tabs" while two of those tabs had
   contributed nothing at all. Missing sales that announce themselves as a full
   load are worse than a slow load. */
const TAB_RETRY_MS = [400, 1200, 3000];
// Tabs that never answered on the MOST RECENT load pass (fast or confirm).
let failedTabs = [];
// Resolves to {json, meta} or null.
async function loadTabOnce(tab, confirm){
  const attempts = tab.gid ? [tab.gid] : [];
  attempts.push(tab.name, tab.name+' ', tab.name.replace(/\s+/g,' '));
  const tried=new Set();
  for(const v of attempts){
    if(tried.has(v)) continue; tried.add(v);
    try{ return await raceGviz(gvizUrl(tab, v), confirm); }
    catch(e){
      // A rejected query means this tab's Title column letter is wrong for its
      // layout. Retry it unfiltered rather than losing the tab entirely.
      if(!tab._noFilter && SHEET_QUERY_FILTER && tab.titleCol){
        tab._noFilter=true;
        try{ return await raceGviz(gvizUrl(tab, v), confirm); }catch(e2){}
      }
    }
  }
  return null; // tab missing/renamed/empty -- skip it
}
/* One attempt is not enough under a 429. Back off and try the whole attempt
   chain again; only after that does a tab count as genuinely gone, and when it
   does it is RECORDED rather than quietly skipped. (Through the edge a 429
   mostly stops happening -- the edge answers from its copy and asks Google at
   most once per tab -- but a cold edge still forwards all 46, so this stays.) */
async function loadTab(tab, confirm, failed){
  for(let a=0; a<=TAB_RETRY_MS.length; a++){
    const got = await loadTabOnce(tab, confirm);
    if(got) return got;
    if(a<TAB_RETRY_MS.length){
      // Jittered, so 46 tabs that all tripped the same limit do not all come
      // back in the same instant and trip it again.
      await new Promise(r=>setTimeout(r, TAB_RETRY_MS[a] + Math.random()*250));
    }
  }
  failed.push(tab.name);
  return null;
}

  //        A:''   B:Owned  C:Quality  D:MD2D  E:MA  F:Title  G:Year  H:Quality  I:Vudu Quality  J:Providers  K:Studio  L:RT  M:IMDb  N:Content ID
  flix: { owned:1, ownedQ:2, d2d:3, ma:4, title:5, year:6, priceQual:7, saleQ:8, provider:9, studio:10, tomato:11, imdb:12, contentId:13 },

function parseBundleRows(json, tab){
  const map=BUNDLE_COLS[tab.bundle];
  const rowCell=(r,i)=>{ if(i==null) return null; const c=r.c && r.c[i]; return c==null?null:(c.v==null?null:c.v); };
  // "Content ID" is unambiguous as a header on these tabs (unlike "Quality",
  // which is reused twice), so look it up by name and fall back to position.
  const cols=(json.table.cols||[]).map(c=>(c.label||'').trim());
  const namedContentIdIdx=cols.findIndex(c=>c==='Content ID');
  const namedVuduIdIdx=cols.findIndex(c=>c==='Vudu Content ID');
  const namedUrlIdx=cols.findIndex(c=>c==='URL');
  const namedImgIdx=cols.findIndex(c=>c==='Image URL');
  const out=[];
  (json.table.rows||[]).forEach(r=>{
    const title=clean(rowCell(r,map.title));
    if(!title) return;
    const tomN=tomatoVal(rowCell(r,map.tomato));
    let imdbN=rowCell(r,map.imdb);
    imdbN=typeof imdbN==='number'?imdbN:parseFloat(String(imdbN??''));
    let yearN=rowCell(r,map.year);
    yearN=typeof yearN==='number'?yearN:parseInt(String(yearN??''),10);
    const {price,quality}=parsePriceQuality(rowCell(r,map.priceQual));
    const lowest=map.lowestRaw!=null?parseLowestPrice(rowCell(r,map.lowestRaw)):null;
    const contentId=clean(namedContentIdIdx>=0?rowCell(r,namedContentIdIdx):null)
      || clean(namedVuduIdIdx>=0?rowCell(r,namedVuduIdIdx):null)
      || clean(rowCell(r,map.contentId));
    out.push({
      title,
      sortTitle:title.replace(/^(the|a|an)\s+/i,'').toLowerCase(),
      year:isNaN(yearN)?null:yearN,
      provider:(map.provider!=null?clean(rowCell(r,map.provider)):'')||'—',
      owned:ownState(rowCell(r,map.owned)),
      ownedQ:ownedQState(rowCell(r,map.ownedQ)),
      d2d:ownState(rowCell(r,map.d2d)),
      ma:ownState(rowCell(r,map.ma)),
      saleQ:quality || (map.saleQ!=null?saleQState(rowCell(r,map.saleQ)):'—') || '—',
      bestQ:'—',
      studio:clean(rowCell(r,map.studio))||'—',
      price, lowest,
      tomato:tomN,
      imdb:isNaN(imdbN)?null:imdbN,
      url:clean(namedUrlIdx>=0?rowCell(r,namedUrlIdx):null)||(contentId?LINK_BASE+contentId:''),
      img:sizePoster(clean(namedImgIdx>=0?rowCell(r,namedImgIdx):null)||(contentId?IMG_BASE+contentId+'-'+POSTER_W:'')),
      contentId, vuduId:contentId,
      where:[tab.where],
      type:tab.type,
      tags:[tab.tag],
    });
  });
  return out;
}
// Same title can appear on several tabs (today's sale AND a Fanflix bundle).
// Merge into one card per title+type, keeping every source label and the
// lowest sale price seen.
function mergeItems(all){
  const byKey=new Map();
  all.forEach(it=>{
    const key=(it.contentId||it.vuduId||it.title+'|'+(it.year||''))+'::'+it.type;
    const prev=byKey.get(key);
    if(!prev){ byKey.set(key,{...it, where:[...it.where], tags:[...it.tags]}); return; }
    it.where.forEach(w=>{ if(!prev.where.includes(w)) prev.where.push(w); });
    it.tags.forEach(t=>{ if(!prev.tags.includes(t)) prev.tags.push(t); });
    if(it.price!=null && (prev.price==null || it.price<prev.price)){
      prev.price=it.price; prev.saleQ=it.saleQ;
    }
    if(prev.img==='' && it.img) prev.img=it.img;
    if(prev.url==='' && it.url) prev.url=it.url;
    ['tomato','imdb','year','lowest'].forEach(k=>{ if(prev[k]==null && it[k]!=null) prev[k]=it[k]; });
    ['d2d','ma','ownedQ','bestQ','studio'].forEach(k=>{
      const blank=v=>v==null||v==='UNOWNED'||v==='—';
      if(blank(prev[k]) && !blank(it[k])) prev[k]=it[k];
    });
  });
  let merged=[...byKey.values()];
  // If the SAME Content ID shows up as both a Movie and a TV Show, the TV
  // entry is a phantom from a mis-resolved tab. Real shows and real movies
  // never share an ID.
  const movieIds=new Set(
    merged.filter(m=>m.type==='Movies' && (m.contentId||m.vuduId))
          .map(m=>m.contentId||m.vuduId)
  );
  merged=merged.filter(m=>{
    if(m.type!=='TV Shows') return true;
    const id=m.contentId||m.vuduId;
    return !(id && movieIds.has(id));
  });
  merged.forEach(m=>{
    m.search=[m.title,m.studio,m.provider,m.year].join(' ').toLowerCase();
    m.priceTag=m.price!=null?'$'+m.price.toFixed(2):null;
    m.key=(m.contentId||m.vuduId||m.title+'|'+(m.year||''))+'::'+m.type;
  });
  applyOwnedQualityOverrides(merged);
  return merged;
}
// Manual corrections for titles whose Owned Quality bucket needs forcing by
// hand. Add [title-lowercase, category] pairs; category must be 'UNOWNED',
// 'SD UPGRADEABLE', or 'HD UPGRADEABLE'.
const OWNEDQ_OVERRIDES=[];
function applyOwnedQualityOverrides(list){
  if(!OWNEDQ_OVERRIDES.length) return;
  list.forEach(m=>{
    const t=m.title.trim().toLowerCase();
    const hit=OWNEDQ_OVERRIDES.find(([title])=>title===t);
    if(hit) m.ownedQ=hit[1];
  });
}
/* ---------- PER-TAB STATE ----------
   What is on screen is kept as the parsed rows OF EACH TAB, each stamped with
   `t` -- the time its data was current at (when it was fetched, minus the age
   the edge reported for its copy). The grid is the merge of all of them.

   Every source feeds this one map through offer(), and per tab the NEWER data
   wins: the IndexedDB cache from the last visit, the deploy-time snapshot,
   the edge's fast answer and the confirm pass. That single rule is what makes
   the order they arrive in stop mattering:
     - a snapshot built after the cache was written replaces the cached tabs
       (sales change daily, so a fresh deploy beats yesterday's visit);
     - an edge copy that has been sitting in a quiet colo for three days does
       NOT replace a snapshot built this morning -- the confirm pass will
       fetch a live copy for exactly those tabs anyway;
     - a tab that fails to load keeps the last rows it had, rather than
       vanishing from a grid that otherwise looks complete. */
const tabState = new Map();          // tab name -> {rows, t}
const parseTab = (json, tab) => tab.bundle ? parseBundleRows(json, tab) : parseTabRows(json, tab);
// Fold a Map of per-tab answers ({rows, t}) into tabState. Returns true when at
// least one tab was taken -- false means everything offered was older than
// what is already on screen.
function offer(got){
  let took=false;
  got.forEach((v,name)=>{
    const cur=tabState.get(name);
    if(cur && cur.t > v.t) return;
    tabState.set(name, {rows:v.rows, t:v.t});
    took=true;
  });
  return took;
}
// The grid's rows, merged in TABS order rather than in whatever order the
// tabs happened to answer -- so the same data always merges to the same
// result (which tab's Provider wins a tie, say), and the signature compare in
// showData() can trust that "different" really means different.
function mergedFromState(){
  const raw=[];
  for(const tab of TABS){ const s=tabState.get(tab.name); if(s) raw.push(...s.rows); }
  return mergeItems(raw);
}
async function loadTabs(tabs, onProgress, confirm){
  const got=new Map(), failed=[]; const queue=tabs.slice();
  async function worker(){
    while(queue.length){
      const tab=queue.shift();
      const r=await loadTab(tab, !!confirm, failed);
      if(r){
        try{
          got.set(tab.name, {rows:parseTab(r.json, tab), t:Date.now()-(+r.meta.age||0)*1000, meta:r.meta});
        }catch(e){
          // One malformed answer must not sink the other 45.
          console.warn(`[sales] tab ${tab.name} could not be parsed:`, e && e.message);
          failed.push(tab.name);
        }
      }
      onProgress && onProgress();
    }
  }
  await Promise.all(Array.from({length:Math.min(POOL,tabs.length)},worker));
  return {got, failed};
}
/* ---------- SNAPSHOT SEED ----------
   This page reads 46 tabs, one request each, and each pays Google's TTFB --
   measured between 0.5s and 11.3s per tab. With nothing cached there was no
   way to show anything until enough of those had come back.

   The build bundles all 46 gviz responses into one file at deploy time, so a first
   visit can paint from a single request instead of forty-six. The responses are
   stored verbatim and fed straight back through this page's OWN
   parseTabRows/parseBundleRows below, so there is no second copy of the per-tab
   schemas anywhere.

   This is only ever a first paint. Sales change daily, so the live load runs
   right behind it and replaces it tab by tab. Every tab from the bundle is
   stamped with the manifest's `built` time, which is how offer() decides
   whether it beats a cached tab (newer deploy) or loses to the edge's copy.

   The manifest is fetched on its own first because it is tiny and also answers
   the question "is the deploy newer than my cache?" -- when it is not, the
   bundle itself is never downloaded. */
let manifestP=null;
function fetchManifest(){
  if(!manifestP) manifestP=fetch('/data-manifest.json',{credentials:'omit'}).then(r=>{
    if(!r.ok) throw new Error('manifest HTTP '+r.status); return r.json();
  }).catch(e=>{ console.warn('[sales] data manifest unavailable:', e && e.message); return null; });
  return manifestP;
}
const manifestBuilt = man => (man && Date.parse(man.built)) || 0;
async function seedFromSnapshot(man){
  try{
    if(!man || !man.files || !man.files.sales) return null;
    const bundle=await fetch('/snapshots/'+man.files.sales,{credentials:'omit'}).then(r=>{
      if(!r.ok) throw new Error('bundle HTTP '+r.status); return r.json();
    });
    const built=manifestBuilt(man);
    const got=new Map(); let n=0;
    for(const tab of TABS){
      const json=bundle[tab.gid];
      if(!json) continue;                      // tab not in the bundle -- load it live
      try{
        const rows=parseTab(json, tab);
        got.set(tab.name, {rows, t:built});
        n+=rows.length;
      }catch(e){ /* one bad tab must not sink the seed */ }
    }
    return n ? got : null;
  }catch(e){
    console.warn('[sales] snapshot seed unavailable:', e && e.message);
    return null;
  }
}
/* ---------- CACHE (IndexedDB) ----------
   One connection, opened exactly as the Collection page opens it (same
   database, same version, same store) so either page can be first to create
   it. Every failure is swallowed: private mode, quota, a blocked upgrade --
   caching is an optimisation and must never stop the page loading. */
let idbConn=null;
function openIdb(){
  if(idbConn) return idbConn;
  idbConn=new Promise((res,rej)=>{
    const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE); };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>{ idbConn=null; rej(r.error); };
  });
  return idbConn;
}
function idbGet(db,key){
  return new Promise((res,rej)=>{
    const q=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(key);
    q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);
  });
}
function legacyStores(){
  const out=[];
  try{ if(window.localStorage) out.push(window.localStorage); }catch(e){}
  try{ if(window.sessionStorage) out.push(window.sessionStorage); }catch(e){}
  return out;
}
/* Resolves to one of
     {kind:'idb', t, got}       per-tab rows from IndexedDB
     {kind:'legacy', t, items}  the old localStorage record (merged items)
     null                       nothing usable */
async function cacheGet(){
  try{
    const db=await openIdb();
    const rec=await idbGet(db, IDB_KEY);
    if(rec && rec.d && rec.d.tabs && Date.now()-rec.t <= CACHE_TTL){
      const got=new Map(Object.entries(rec.d.tabs));
      let n=0; got.forEach(v=>{ n+=(v.rows||[]).length; });
      if(n) return {kind:'idb', t:rec.t, got};
    }
  }catch(e){ /* fall through to the old key */ }
  for(const store of legacyStores()){
    try{
      const raw=store.getItem(LEGACY_CACHE_KEY);
      if(!raw) continue;
      const c=JSON.parse(raw);
      if(!c || !Array.isArray(c.d) || !c.d.length) continue;
      if(Date.now()-c.t > CACHE_TTL) continue;
      return {kind:'legacy', t:c.t, items:c.d};
    }catch(e){ /* try the next store */ }
  }
  return null;
}
/* Saved in an idle slot so the structured clone of ~1,400 rows never delays
   the paint that just happened. Only called when every tab is accounted for --
   see cacheComplete(). Once the IndexedDB write has landed, the old
   localStorage copy is deleted: it would otherwise sit there for good, and be
   read back by an older tab of this page. */
function writeCache(){
  const tabs={}; tabState.forEach((v,k)=>{ tabs[k]=v; });
  idle(async()=>{
    try{
      const db=await openIdb();
      await new Promise((res,rej)=>{
        const tx=db.transaction(IDB_STORE,'readwrite');
        tx.objectStore(IDB_STORE).put({t:Date.now(), sig:shownSig, d:{tabs}}, IDB_KEY);
        tx.oncomplete=res; tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);
      });
      for(const s of legacyStores()){ try{ s.removeItem(LEGACY_CACHE_KEY); }catch(e){} }
    }catch(e){ /* private mode / quota -- caching is optional */ }
  });
}
/* Only a COMPLETE picture earns the cache. A tab that has no rows from ANY
   source (it failed live and there was nothing cached or seeded for it) is a
   hole, and caching that would serve the hole back on every visit until the
   next good load. A tab that failed live but still holds its last known rows
   is not a hole -- that is the whole point of keeping rows per tab. */
const cacheComplete = () => TABS.every(t=>tabState.has(t.name));
/* ---------- FACET UI ---------- */
/* Option lists are counted off the titles currently on screen, the same rule
   the Collection page follows: pick a store and every other list shrinks to
   what that store actually has on sale, so nothing on offer can only ever
   return zero. A facet with picks of its own is the exception. Counting Studio
   off a list already narrowed to one studio would leave it as the only choice
   and no way to tick a second one, so it counts off everything-but-itself. */
// One reading of a row's values for both counting and matching, so the number
// beside an option is exactly what ticking it returns. Owned Quality folds
// every spelling of "unowned" into the UNOWNED it is listed under.
function facetVals(m,f){
  const vals=f.csv?m[f.key]:[m[f.key]].filter(Boolean);
  return f.key==='ownedQ' ? vals.map(v=>/^unowned$/i.test(v)?'UNOWNED':v) : vals;
}
function countFacets(rows,list){
  list.forEach(f=>{
    const counts=new Map();
    rows.forEach(m=>{
      facetVals(m,f).forEach(v=>counts.set(v,(counts.get(v)||0)+1));
    });
    let entries=[...counts.entries()];
    // D2D/MA are "not applicable" for almost every row, so their UNOWNED
    // bucket is dropped from the filter list as clutter.
    if(f.key==='d2d'||f.key==='ma') entries=entries.filter(([v])=>v!=='UNOWNED');
    // A -> Z with the shared collator, as on the Collection page. Sale Price
    // keeps its natural order (cheapest first) -- alphabetical would file
    // $10.99 before $2.99.
    facetValues[f.key]=entries.sort((a,b)=>
      f.numeric ? parseFloat(a[0].replace(/[^0-9.]/g,''))-parseFloat(b[0].replace(/[^0-9.]/g,''))

  });
}
// The whole-catalog pass, run before every rebuild: buildFacets() sizes its
// panels off it, and applyFilters() narrows the lists from there.
function buildFacetValues(){

  countFacets(items,FACETS);
}
function refreshFacetValues(q){

// Set once the sidebar exists. A search or quick filter used while the first

let facetsReady=false;

/* ---------- SLIDERS ---------- */
function buildSliders(){
  /* This used to return early once a slider had been touched, so a late batch
     of tabs could not reset a filter mid-use -- but that also froze the bounds
     at whatever the first paint had seen. Now, as on the Collection page, the
     sliders are always rebuilt and a range the visitor SET (s._active) is
     carried across, clamped to the new bounds; an untouched slider simply
     takes the new full span. */
  const host=$('#sliders'); host.textContent='';
  SLIDERS.forEach(s=>{
    const vals=items.map(m=>m[s.key]).filter(v=>v!=null);
    if(vals.length){
      s.min=Math.floor(Math.min(s.min,...vals));
      s.max=Math.ceil(Math.max(s.max,...vals));
    }
    const keep = s._active && rangeState[s.key] ? rangeState[s.key] : null;
    rangeState[s.key]={lo:s.min,hi:s.max};
    const el=document.createElement('div');
    el.className='slider-group';
    el.innerHTML=
      '<div class="sl-title"></div>'+
      '<div class="range-wrap"><div class="rail"></div><div class="fill"></div>'+
        '<input type="range" class="lo"><input type="range" class="hi"></div>'+
      '<div class="sl-vals"><input class="v-lo" type="number" title="Type a value">'+
        '<input class="v-hi" type="number" title="Type a value"></div>';
    el.querySelector('.sl-title').textContent=s.label;
    host.appendChild(el);
    const lo=el.querySelector('.lo'), hi=el.querySelector('.hi'),
          fill=el.querySelector('.fill'), vlo=el.querySelector('.v-lo'), vhi=el.querySelector('.v-hi');
    [lo,hi,vlo,vhi].forEach(inp=>{ inp.min=s.min; inp.max=s.max; inp.step=s.step; });
    lo.value=s.min; hi.value=s.max;
    if(keep){
      const c=v=>Math.max(s.min,Math.min(s.max,v));
      lo.value=c(keep.lo); hi.value=c(keep.hi);
    }
    const paint=()=>{
      const a=+lo.value,b=+hi.value;
      let mn=Math.min(a,b),mx=Math.max(a,b);
      if(mn < s.min + s.step/2) mn = s.min;
      if(mx > s.max - s.step/2) mx = s.max;

      const pct=v=>(v-s.min)/(s.max-s.min)*100;
      fill.style.left=pct(mn)+'%'; fill.style.width=(pct(mx)-pct(mn))+'%';
      vlo.value=mn; vhi.value=mx;

         slider filters anything, so the blue can never disagree with the grid:
         if it is blue, rows are being dropped, and if rows are being dropped
         it is blue. */
      s._active = mn>s.min || mx<s.max;
      el.classList.toggle('active', s._active);
    };
    paint();
    let t;
    const onInput=()=>{ paint(); clearTimeout(t); t=setTimeout(applyFilters,150); };
    lo.addEventListener('input',onInput); hi.addEventListener('input',onInput);
    const manual=(inputEl,rangeEl)=>{
      let v=parseFloat(inputEl.value);
      if(isNaN(v)){ paint(); return; }
      v=Math.max(s.min,Math.min(s.max,v));
      rangeEl.value=v;
      paint(); applyFilters();
    };
    vlo.addEventListener('change',()=>manual(vlo,lo));
    vhi.addEventListener('change',()=>manual(vhi,hi));
    vlo.addEventListener('keydown',e=>{ if(e.key==='Enter') vlo.blur(); });
    vhi.addEventListener('keydown',e=>{ if(e.key==='Enter') vhi.blur(); });
    s._reset=()=>{ lo.value=s.min; hi.value=s.max; paint(); };

}
/* ---------- FILTER + SORT + RENDER ---------- */
// `skipKey` leaves one facet out, which is how a facet with picks of its own
// gets its option list counted (see refreshFacetValues).
function rowMatches(m,q,skipKey){
  if(q && !m.search.includes(q)) return false;
  if(quickTags.size && !m.tags.some(t=>quickTags.has(t))) return false;
  for(const f of FACETS){
    if(f.key===skipKey) continue;
    const sel=selected[f.key]; if(!sel.size) continue;
    if(!facetVals(m,f).some(v=>sel.has(v))) return false;
  }
  for(const s of SLIDERS){
    const r=rangeState[s.key];
    if(!r) continue;
    if(r.lo>s.min || r.hi<s.max){
      const v=m[s.key];
      if(v==null || v<r.lo || v>r.hi) return false;
    }
  }
  return true;
}
// `soft` is the background-refresh path (showData): the page number is kept
// and the grid is only touched if the cards on it actually changed.
function applyFilters(keepPage, soft){
  const q=$('#searchBox').value.trim().toLowerCase();
  filtered=items.filter(m=>rowMatches(m,q,null));
  refreshFacetsNow();
  renderChips();
  sortNow();
  if(!keepPage) page=0;
  renderPage(soft?{ifChanged:true}:null);
}
/* Same semantics as the Collection page's sortNow(), which this used to differ
   from: the direction came from `dir==='asc' ? 1 : -1`, the reverse of index's
   `dir==='desc' ? -1 : 1`, and blanks/ties were handled differently per key.
   Now, for every key:
     - blanks always sort LAST, whichever direction is picked (a title with no
       IMDb score is not the "lowest rated");
     - ties are broken by title A -> Z with the shared collator, regardless of
       the primary direction, so equal prices come out in a stable, readable
       order instead of whatever order the tabs answered in.
   Titles compare on sortTitle (leading The/A/An dropped), so "The Batman"
   files under B -- this page's long-standing title order. */
function sortNow(){
  const [key,dir]=$('#sortSel').value.split('|');
  const mul=dir==='desc'?-1:1;
  const alphaTitle=(a,b)=>collator.compare(a.sortTitle||a.title||'', b.sortTitle||b.title||'')
                          || collator.compare(a.title||'', b.title||'');
  filtered.sort((a,b)=>{
    if(key==='sortTitle') return mul*alphaTitle(a,b);
    const x=a[key], y=b[key];
    if(x==null&&y==null) return alphaTitle(a,b);
    if(x==null) return 1;   // blanks last either direction
    if(y==null) return -1;
    if(x===y) return alphaTitle(a,b);
    return mul*(x-y);
  });
}
/* ---------- ACTIVE-FILTER CHIPS ----------
   Every active facet pick, shown above the wall, as on the Collection page: a
   pick inside a closed panel is otherwise only a small count badge, and with
   the sidebar collapsed there is not even that. One chip per selected value,
   in FACETS order, each carrying its facet's name dimmed; the ✕ removes just
   that value and re-filters. Rebuilt from applyFilters(), which every path
   that changes a selection already goes through. */
function renderChips(){
  const row=$('#chipRow');
  row.textContent='';
  for(const f of FACETS){
    const sel=selected[f.key];
    if(!sel) continue;
    sel.forEach(v=>{
      const chip=document.createElement('div');
      chip.className='chip';
      chip.innerHTML=`<span class="k">${esc(f.chip||f.label)}</span><span class="v">${esc(v)}</span>`;
      const x=document.createElement('button');
      x.type='button';
      x.title=`Clear ${f.label}: ${v}`;
      x.textContent='✕';
      x.addEventListener('click',e=>{
        // Stop the document-level handler closing an open facet panel: the
        // panel is redrawn with the box unticked, which is the useful thing.
        e.stopPropagation();
        selected[f.key].delete(v);
        applyFilters();
      });
      chip.appendChild(x);
      row.appendChild(chip);
    });

}
/* Cards are built once and kept, keyed by title identity. When a later batch

const cardCache = new Map();

    const ph=document.createElement('div'); ph.className='ph'; ph.textContent=m.title;
    a.appendChild(ph);

  const where=document.createElement('span'); where.className='where-tag';
  a.appendChild(where);

function syncCard(a,m){

  a._where.textContent=m.where.join(' · ');

  // the whole strip stays out of the way when neither score came through.
  const rtN = (m.tomato==null || isNaN(m.tomato)) ? null : Math.round(m.tomato);
  const imN = (m.imdb==null || isNaN(m.imdb)) ? null : m.imdb;

    a._rt.textContent='RT '+rtN+'%';
    a._rt.className='rt-tag '+(rtN>=60?'fresh':'rotten');
    a._rt.style.display='';

  if(imN!=null){
    a._imdb.textContent='IMDb '+imN.toFixed(1);

      else if(Math.abs(m.price-m.lowest) < 0.005) cls+=' tied-low';

function getCard(m){

  // <img> src, its alt and the no-poster placeholder text are only written
  // when a card is built. Everything else (price, tags, ratings) syncs in place.
  if(el && el._img===m.img && el._t===m.title){ syncCard(el,m); return el; }
  el=buildCard(m);
  el._img=m.img; el._t=m.title;
  cardCache.delete(m.key);
  cardCache.set(m.key,el);
  if(cardCache.size>CARD_CACHE_MAX){

/* Fingerprint of what is in the grid -- which cards, in which order, on which

   Collection page's renderedKey. */
let renderedKey=null;
function renderPage(opts){
  const total=filtered.length;

  page=Math.min(page,pages-1);
  const start=page*PER_PAGE, end=Math.min(start+PER_PAGE,total);
  const label= total? `${start+1} - ${end} / ${total}` : '0 results';
  $('#pgLabel').textContent=label;
  const atFirst=page===0, atLast=page>=pages-1;
  $('#prevPg').disabled=atFirst;  $('#nextPg').disabled=atLast;
  if(window.syncBottomPager) syncBottomPager(page,pages);
  const slice=filtered.slice(start,end);
  let k=page+'|'+PER_PAGE+'|';

    // two rows load eagerly so the fold fills at once, the first ten jump
    // the queue. Set before the card is attached, so a lazy poster that has
    // become a first-row poster starts loading straight away.

function toTop(){

function pinDocTop(){

// Anything else that nudges the document gets put straight back, so the top

function goPrev(){ if(page>0){ page--; renderPage(); toTop(); } }
function goNext(){ page++; renderPage(); toTop(); }
$('#prevPg').addEventListener('click',goPrev);   $('#nextPg').addEventListener('click',goNext);

   nothing at all -- no rebuild, no re-sort, no DOM. A different one swaps the

   picks (the `selected` sets are never touched), slider ranges (rebuilt with

let shownSig=null, painted=false;

// to keep alongside the cache.
function signature(list){
  const s=JSON.stringify(list);
  let h=0x811c9dc5;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193); }

     3. the live load: all 46 tabs through the edge's FAST path, started right

        whichever usable answer lands first paints; per tab, newer data wins.

window.__sales={};

    }else{
      oldestCached=cached.t;
      showData(cached.items);       // legacy record: merged items, no per-tab rows
    }
    markPaint(cached.kind==='idb' ? 'cache' : 'legacy cache');
  }
  if(painted) setBar(0.25);
  // 2. Snapshot. Never awaited here -- it paints itself when it lands, or not
  //    at all if the live load has already put something newer on screen.
  fetchManifest().then(man=>{
    if(cached && !(manifestBuilt(man) > oldestCached)) return null;
    return seedFromSnapshot(man);
  }).then(got=>{
    if(!got) return;
    if(offer(got)){ showData(mergedFromState()); markPaint('snapshot'); }
  }).catch(e=>console.warn('[sales] snapshot seed failed:', e && e.message));
  // 3. Live load through the edge. One task's pause when something is already
  //    painted, so that frame is committed before 46 requests go out; no
  //    waiting for window load or idle any more (see POOL above).
  if(painted) await new Promise(r=>setTimeout(r,0));
  const priorityTabs = TABS.filter(t=>t.priority);
  const restTabs     = TABS.filter(t=>!t.priority);
  let done=0;
  const progress=()=>{
    done++;
    // Tabs are 85% of the bar; merging, facets and the first render are the
    // rest, so it doesn't sit at 100% while the page is still working.
    setBar(0.85 * done / TABS.length);
    // The tab counter is only for a blank page -- once anything is painted it
    // would just be noise over a grid that is already usable.
    if(!painted) setStatus(`Loading sales… ${done} of ${TABS.length} tabs`);
  };
  // Staged only when EARLY_PAINT is on AND nothing has painted yet.
  // Otherwise every tab goes out in one pass and the grid paints once.
  const staged = EARLY_PAINT && !painted;
  const live={got:new Map(), failed:[]};
  const take=r=>{ r.got.forEach((v,k)=>live.got.set(k,v)); live.failed.push(...r.failed); };
  try{
    if(staged){
      take(await loadTabs(priorityTabs, progress));
      if(offer(live.got)){ showData(mergedFromState()); markPaint('live (Today tabs)'); }
    }
    take(await loadTabs(staged ? restTabs : TABS, progress));
    failedTabs = live.failed;
    let liveRows=0; live.got.forEach(v=>{ liveRows+=v.rows.length; });
    if(!liveRows){
      throw new Error('No rows found — is the sheet shared as "Anyone with the link"?');
    }
    setBar(0.9);
    offer(live.got);
    showData(mergedFromState());
    markPaint('live');
    setBar(1);
    if(cacheComplete()) writeCache();
    barDone();
    setStatus(null);
    window.__sales.liveMs=Math.round(performance.now()-t0);
    const answered = TABS.length - failedTabs.length;
    let oldest=0; live.got.forEach(v=>{ oldest=Math.max(oldest, +v.meta.age||0); });
    console.info(`[sales] ${items.length} titles from ${answered} of ${TABS.length} tabs`
                 + ` in ${window.__sales.liveMs}ms`
                 + ` (transport: ${TRANSPORT}, oldest edge copy: ${Math.round(oldest)}s,`
                 + ` filter: ${SHEET_QUERY_FILTER?'on':'off'}, proxy: ${proxyIdx})`);
    /* A tab that never answered must not pass as a clean load. It is now kept
       on screen from the cache or snapshot when it can be, so the message
       says which case it is -- but either way it is a toast and a console
       line, not an error chip over a grid that is in use. */
    if(failedTabs.length){
      const holes=failedTabs.filter(n=>!tabState.has(n));
      console.warn(`[sales] ${failedTabs.length} tab(s) never answered: ${failedTabs.join(', ')}`
                   + (holes.length ? ` -- missing entirely: ${holes.join(', ')}` : ' -- showing their last known sales'));
      toast(holes.length
        ? `Could not load: ${holes.join(', ')} — some sales are missing. Reload to try again.`
        : `Could not refresh: ${failedTabs.join(', ')} — showing their last known sales.`, true);
    }
    // 4. Silent confirm for whatever came from an old edge copy.
    confirmLater(live.got);
  }catch(err){
    barDone();
    if(painted){
      setStatus(null);
      console.warn('[sales] refresh failed, keeping what is on screen:', err && err.message);
      toast('Could not refresh: '+err.message, true);
    }else{
      setStatus('Could not load the sales sheet.<br><small>'+esc(err.message)+'</small>', false, true);
    }
  }
})();
</script>
</body>
</html>
