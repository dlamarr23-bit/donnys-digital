# Donny's Digital -- Netlify configuration
#
# The whole point of this move is the [[headers]] blocks below. Google's
# published-CSV endpoint answers with "Cache-Control: private, max-age=300",
# which bars every CDN from caching it and re-downloads 11.7MB on any visit
# more than five minutes apart. Nothing about that is configurable at the
# Google end -- it is why the site was slow, and it is what this replaces.

[build]
  publish = "."
  command = "node scripts/build-data.mjs"

# Rebuilding on a schedule is optional -- the pages catch up against the live
# sheet in the background on every visit, so a stale snapshot is a slower
# first paint, never wrong data. Set up a scheduled build in the Netlify UI
# (Site configuration > Build & deploy > Build hooks) if you want the snapshot
# itself kept current.

# ---------------------------------------------------------------------------
# Data snapshots. Filenames carry a content hash, so a given URL can never
# change meaning and may be cached forever. A rebuild produces new filenames,
# which the manifest points at -- the old ones simply stop being requested.
[[headers]]
  for = "/snapshots/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Brand mark and favicons. Checked in rather than generated, and their content
# only changes if the artwork does -- so they get a long cache with a
# revalidate rather than the immutable treatment reserved for hashed names.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# CSV mirrors of the sheets the other pages parse. Stable filenames, so these
# are revalidated rather than cached forever: a repeat visit costs one 304 and
# no body, and a rebuild is picked up straight away. Still far better than
# Google's "private, max-age=300" on a regenerated-per-request endpoint.
[[headers]]
  for = "/mirror/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/csv; charset=utf-8"

# The pointer to the current snapshots. Small, and must be re-checked every
# time or a rebuild would never be noticed.
[[headers]]
  for = "/data-manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Pages themselves: always revalidate (they are ~100KB and change when I edit
# them), but a 304 costs one round trip and no body.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---------------------------------------------------------------------------
# POSTER PROXY.
# Work networks (and some ISPs) block anything with the Vudu address in it.
# That blocks not just the direct poster URLs but every image proxy the pages
# fall back to, because all of them carry the original URL in their path or
# query: cdn.statically.io/img/images2.vudu.com/..., i0.wp.com/images2.vudu.com/...,
# wsrv.nl/?url=...images2.vudu.com... . A filter matching that string blocks the
# lot, which is why the Movies and D2D grids came up blank at work.
#
# Routed through this domain, the browser only ever requests /p/<id>-l. Netlify
# fetches from Vudu server-side, where no client-side filter applies, and its
# CDN caches the result -- so Vudu is hit once per poster globally, not once
# per visitor.
#
# Deliberately narrow: it can only ever reach images2.vudu.com/poster2/, so it
# is not an open proxy that anyone could point at an arbitrary host.
[[redirects]]
  from = "/p/*"
  to = "https://images2.vudu.com/poster2/:splat"
  status = 200

# ---------------------------------------------------------------------------
# Clean URLs: /wishlist instead of /wishlist.html
[[redirects]]
  from = "/movies"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/wishlist"
  to = "/wishlist.html"
  status = 200
[[redirects]]
  from = "/data"
  to = "/data.html"
  status = 200
[[redirects]]
  from = "/sales"
  to = "/sales.html"
  status = 200
[[redirects]]
  from = "/ma-compare"
  to = "/ma-compare.html"
  status = 200
[[redirects]]
  from = "/d2d"
  to = "/d2d.html"
  status = 200
  
  [images]
  remote_images = [
    'https?://([a-z0-9-]+\.)*vudu\.com/.*',
    'https?://([a-z0-9-]+\.)*fandango\.com/.*',
    'https?://([a-z0-9-]+\.)*fandangonow\.com/.*',
    'https?://([a-z0-9-]+\.)*moviesanywhere\.com/.*',
    'https?://([a-z0-9-]+\.)*staticflickr\.com/.*',
    'https?://([a-z0-9-]+\.)*ssl-images-amazon\.com/.*',
    'https?://([a-z0-9-]+\.)*media-amazon\.com/.*',
    'https?://([a-z0-9-]+\.)*barcodespider\.com/.*',
    'https?://image\.tmdb\.org/.*',
    'https?://([a-z0-9-]+\.)*wikimedia\.org/.*',
    'https?://([a-z0-9-]+\.)*mzstatic\.com/.*',
    'https?://([a-z0-9-]+\.)*googleusercontent\.com/.*',
    'https?://([a-z0-9-]+\.)*akamaized\.net/.*',
    'https?://([a-z0-9-]+\.)*cloudfront\.net/.*',
  ]
