<!-- ===================================================================
     POSTER ROUTING -- runs before anything else in the page.

     Rewrites the src of every <img>, now and as the grid renders more, to
     load through this domain via this site's own /img proxy instead of straight
     from the image host.

     Two reasons, in order of how much they matter:

     1. Networks that filter on hostname (a work network, some ISPs) block
        images2.vudu.com outright, and the fallback proxies the pages walk
        through -- cdn.statically.io, i0.wp.com, wsrv.nl -- are separate
        hostnames that can be blocked just as easily. Routed through here
        the browser only ever connects to this site, so there is nothing
        for a host-based filter to match. (Confirmed working on a network
        that was blocking Vudu.)

     2. Resizing: this USED to also re-encode, when the proxy was Netlify's
        Image CDN -- a poster arrived as ~10KB of webp instead of ~40KB of
        source jpeg. On Cloudflare Pages there is no image-processing step,
        so the &w= and &fm= below are sent and ignored, and posters arrive
        at their original size and format. See README.md "Posters".

     The host allowlist lives in functions/img.js -- a URL whose host is not
     on that list is refused, so add the host there before pointing anything
     new at it. (It used to be [images] remote_images in netlify.toml, which
     Cloudflare does not read.)
     =================================================================== -->
<script>
(function () {
  var PROXY  = "/img";
  var WIDTH  = 300;      // poster cards render ~150px wide; 300 covers retina
  var FORMAT = "webp";   // smaller than the source jpg

  function proxied(u) {
    if (!u) return u;
    u = String(u).trim();
    if (!/^(https?:)?\/\//i.test(u)) return u;              // relative -> leave alone
    if (u.indexOf(PROXY + "?url=") === 0) return u;         // already proxied
    if (u.indexOf("//" + location.host) !== -1) return u;   // same-site -> leave alone
    if (u.slice(0, 2) === "//") u = "https:" + u;
    else if (u.slice(0, 5).toLowerCase() === "http:") u = "https:" + u.slice(5);
    return PROXY + "?url=" + encodeURIComponent(u) + "&w=" + WIDTH + "&fm=" + FORMAT;
  }

  function fix(el) {
    if (!el || el.tagName !== "IMG") return;
    var src = el.getAttribute("src");
    var next = proxied(src);
    if (next && next !== src) el.setAttribute("src", next);
  }

  function scan(root) {
    if (!root || root.nodeType !== 1) return;
    fix(root);
    if (root.querySelectorAll) {
      var imgs = root.querySelectorAll("img");
      for (var i = 0; i < imgs.length; i++) fix(imgs[i]);
    }
  }

  new MutationObserver(function (mutations) {
    for (var i = 0; i < mutations.length; i++) {
      var m = mutations[i];
      if (m.type === "attributes") fix(m.target);
      else for (var j = 0; j < m.addedNodes.length; j++) scan(m.addedNodes[j]);
    }
  }).observe(document.documentElement, {
    childList: true, subtree: true, attributes: true, attributeFilter: ["src"]
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { scan(document.body); });
  } else {
    scan(document.body);
  }
})();
</script>
<script>
/* ============ EDGE SHEET CACHE (functions/sheet.js) ============
   Shared by every page. Same block in each file -- keep them in step.

   Google takes 0.5-14s to answer a sheet request and forbids CDNs from keeping
   a copy, which is why every page used to show its cached grid and then sit
   on "Checking for changes..." for several seconds. /sheet keeps that copy at
   Cloudflare's edge instead.

     __edge.fast(url)     -> the edge's copy, however old, in ~50ms
     __edge.confirm(url)  -> a copy no older than FRESH_S, waiting on Google
                             only if the edge has nothing that recent
     __edge.isOld(r)      -> true when a fast answer still needs confirming

   Each resolves to {res, age, how}: `res` is the fetch Response (body unread,
   so callers can stream it), `age` its age in seconds, `how` where it came
   from. The pages paint the fast answer straight away and run the confirm
   pass silently behind it, so the data is still live -- it just no longer
   holds anything up.

   If /sheet is missing (local preview, a host without Functions) or fails,
   this goes straight to Google exactly as the pages always did. */
(function(){
  var FRESH_S=60;
  var off=false;
  function opts(signal){ var o={credentials:'omit'}; if(signal) o.signal=signal; return o; }
  function direct(url, signal){
    return fetch(url,opts(signal)).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return {res:r, age:0, how:'DIRECT'};
    });
  }
  function viaEdge(url, fresh, signal){
    if(off) return direct(url, signal);
    var u='/sheet?u='+encodeURIComponent(url)+(fresh==null?'':'&fresh='+fresh);
    return fetch(u,opts(signal)).then(function(r){
      var how=r.headers.get('X-Sheet-Cache');
      /* No header means this was not the function answering (a 404 page, a
         static server) -- stop asking it for the rest of this visit. */
      if(!how){ off=true; return direct(url, signal); }
      if(!r.ok) throw new Error('sheet HTTP '+r.status);
      return {res:r, age:+(r.headers.get('X-Sheet-Age')||0), how:how};
    }).catch(function(e){
      if(off || (e && e.name==='AbortError')) throw e;
      try{ console.warn('[edge] /sheet unavailable, using Google directly:', (e&&e.message)||e); }catch(x){}
      return direct(url, signal);
    });
  }
  window.__edge={
    FRESH_S:FRESH_S,
    fast:function(url,signal){ return viaEdge(url,null,signal); },
    confirm:function(url,maxAge,signal){ return viaEdge(url, maxAge==null?FRESH_S:maxAge, signal); },
    isOld:function(r){ return !!r && (r.age>FRESH_S || r.how==='ERROR-STALE'); },
    text:function(p){ return p.then(function(r){ return r.res.text().then(function(t){ r.text=t; return r; }); }); }
  };
})();
</script>

<!-- Tells the browser the page is dark BEFORE any CSS is parsed, so the very
     first frame is dark instead of a white flash that repaints to #171C20. -->

<title>Donny's Wishlist</title>

/* ============ CRITICAL CSS ============
   Same block as the Collection page. Just the loading indicator, inlined
   ahead of everything else so the bar and the chip are on screen in the very
   first painted frame -- before the main stylesheet is read, before the
   fonts, and long before any data arrives.
   This replaces the old full-page cover, which hid the whole page behind a
   spinner until Google answered: a returning visitor stared at a blank
   screen for the 1-2s the sheet took even though their browser already had
   the wishlist from last time. Now the cached grid paints underneath and the
   chip only shows while there is genuinely nothing to look at. */
html,body{margin:0;padding:0;background:#171C20}
#topbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:200;
  background:rgba(255,255,255,.09);overflow:hidden}
#topbar.done{opacity:0;transition:opacity .4s .25s}
#topfill{height:100%;width:0;background:linear-gradient(90deg,#004A75,#007BC4,#4FA8E0);
  transition:width .3s ease-out}
#topbar.indet #topfill{width:38%;animation:ddslide 1.15s ease-in-out infinite}
@keyframes ddslide{0%{transform:translateX(-110%)}100%{transform:translateX(275%)}}
#status{position:fixed;top:23px;left:50%;transform:translateX(-50%);z-index:201;
  display:flex;flex-direction:row;gap:10px;align-items:center;
  background:#263238;border-radius:20px;padding:8px 17px 8px 13px;
  font:700 12.5px 'Poppins','Segoe UI',system-ui,sans-serif;letter-spacing:.5px;color:#cfd8dc;
  box-shadow:0 4px 16px rgba(0,0,0,.55);max-width:min(92vw,520px)}
#status.hidden{display:none}
#status.err{background:#b71c1c;color:#fff;border-radius:10px;text-align:left}
#status small{font-weight:700;line-height:1.6;display:block}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.22);border-top-color:#fff;
  border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
/* Placeholder tiles, so the grid reads as "filling in" instead of "broken". */
.skel{border-radius:6px;height:0;padding-bottom:150%;background:#1f262b;
  animation:ddpulse 1.5s ease-in-out infinite}
@keyframes ddpulse{0%,100%{opacity:.5}50%{opacity:.92}}
@media(prefers-reduced-motion:reduce){
  .spin,.skel{animation:none}
  #topbar.indet #topfill{animation:none;width:100%}
}
</style>

<style>
:root{
  --bg:#171C20;
  --bg-soft:#1f262b;
  --pill:#ffffff;
  --pill-text:#37474f;
  --bar:#8a9096;
  --bar-text:#ffffff;
  --accent:#007BC4;
  /* Same hue, lifted, for the places where --accent has to carry meaning as a
     thin line or small text on the dark sidebar rather than as a filled pill. */
  --accent-bright:#3AA0E3;
  --track:#4a565e;
  --track-fill:#eceff1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg)}
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{
  background:var(--bg);
  font-family:'Poppins','Segoe UI',sans-serif;
  font-weight:700;
  color:#eceff1;
  overflow:hidden;
}
#app{display:flex;height:100%}
/* ---------- SIDEBAR ---------- */
#sidebar{
  width:250px;min-width:250px;
  padding:16px 12px 30px 14px;
  height:100%;
  overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:#4a565e transparent;
}
#sidebar::-webkit-scrollbar{width:6px}
#sidebar::-webkit-scrollbar-thumb{background:#4a565e;border-radius:3px}
/* Every colour here is declared outright, as on the Collection page. This field
   used to declare no background at all and leaned on the browser's default
   form-control white -- which the page-level color-scheme:dark flips to a dark
   grey, leaving dark text and a dark caret on a dark box. Never let a
   control's legibility depend on a UA default. */
/* Same white pill as the facet buttons below it, pinned to the light scheme
   with its colours set explicitly. */
#searchBox{
  width:100%;padding:5px 9px;border:none;border-radius:8px;
  background:var(--pill);color:var(--pill-text);color-scheme:light;
  font:700 12.5px 'Poppins',sans-serif;letter-spacing:.6px;
  caret-color:var(--pill-text);
  margin-bottom:12px;outline:none;transition:box-shadow .15s;
}
#searchBox::placeholder{color:#78909c;text-transform:uppercase;letter-spacing:1.2px}
#searchBox:hover{box-shadow:0 0 0 2px rgba(255,255,255,.25)}
/* outline:none removes the browser's focus ring, so give the field its own. */
#searchBox:focus{box-shadow:0 0 0 2px var(--accent)}
.facet{position:relative;margin-bottom:10px}
.facet-btn{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  background:var(--pill);color:var(--pill-text);
  border:none;border-radius:8px;padding:5px 7px;cursor:pointer;
  font:700 12.5px 'Poppins',sans-serif;letter-spacing:1.2px;text-transform:uppercase;
  transition:box-shadow .15s;
}
.facet-btn:hover{box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.facet-btn .icon{font-size:13px;color:#607d8b;transition:transform .2s}
.facet.open .facet-btn .icon{transform:rotate(180deg)}
.facet-btn .count-badge{
  background:var(--accent);color:#fff;border-radius:10px;
  font-size:10px;padding:1px 7px;margin-left:auto;margin-right:8px;
}
.facet-panel{
  display:none;position:relative;z-index:30;
  background:#fff;border-radius:8px;margin-top:5px;
  box-shadow:0 8px 22px rgba(0,0,0,.45);
  padding:8px;color:var(--pill-text);
}
.facet.open .facet-panel{display:block}
/* On a white panel, so it is pinned to the light scheme and given its colours
   explicitly -- same UA-default trap as #searchBox above, just inverted: with
   color-scheme:dark inherited from the page it would render as a dark grey box
   with white text in the middle of a white popover. */
.facet-panel input.opt-search{
  width:100%;padding:6px 9px;margin-bottom:6px;
  border:1px solid #cfd8dc;border-radius:5px;font:700 12.5px 'Poppins',sans-serif;outline:none;
  color-scheme:light;background:#ffffff;color:var(--pill-text);
}
.facet-panel input.opt-search::placeholder{color:#90a4ae}
.opt-list{max-height:240px;overflow-y:auto;scrollbar-width:thin}
.opt-list label{
  display:flex;align-items:center;gap:8px;
  font:700 13px 'Poppins',sans-serif;padding:5px 6px;border-radius:4px;cursor:pointer;
}
.opt-list label:hover{background:#eceff1}
.opt-list input{accent-color:var(--accent)}
.opt-list .n{margin-left:auto;color:#90a4ae;font-size:11px}
.opt-more{font-size:11px;color:#90a4ae;padding:5px 6px}
.facet-clear{
  display:block;width:100%;margin-top:6px;padding:6px;
  background:#eceff1;border:none;border-radius:5px;cursor:pointer;
  font:700 11px 'Poppins',sans-serif;letter-spacing:1px;text-transform:uppercase;color:#546e7a;
}
.facet-clear:hover{background:#cfd8dc}
/* Sidebar controls are inert until the wishlist has been indexed. */
#sidebar.pending #facets,#sidebar.pending #sliders{opacity:.45;pointer-events:none}
/* sort -- copied from the Collection page.
   The native <select> is kept for state (and for keyboard/AT users) but is
   never painted: Chrome on Windows draws a select's dropdown list with the OS
   menu font, so the options came out in Segoe UI no matter what font-family
   the select carried. The list below is plain markup, so it honours Poppins. */
#sortWrap{position:relative;margin-bottom:10px}
#sortSel{
  position:absolute;width:1px;height:1px;padding:0;margin:0;border:0;
  opacity:0;pointer-events:none;clip:rect(0 0 0 0);overflow:hidden;
}
#sortBtn{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--pill);color:var(--pill-text);text-align:left;
  border:none;border-radius:8px;padding:5px 6px;cursor:pointer;
  font:700 12.5px 'Poppins','Segoe UI',sans-serif;letter-spacing:1.2px;text-transform:uppercase;
  outline:none;transition:box-shadow .15s;
}
#sortBtn:hover{box-shadow:0 0 0 2px rgba(255,255,255,.25)}
#sortBtn .icon{font-size:13px;color:#607d8b;transition:transform .2s;flex:none}
#sortWrap.open #sortBtn .icon{transform:rotate(180deg)}
#sortLabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#sortPanel{
  display:none;position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:60;
  background:#fff;border-radius:8px;box-shadow:0 8px 22px rgba(0,0,0,.45);
  padding:6px;max-height:340px;overflow-y:auto;scrollbar-width:thin;
}
#sortWrap.open #sortPanel{display:block}
#sortPanel button{
  display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
  padding:7px 9px;border-radius:5px;color:var(--pill-text);
  font:700 11.5px 'Poppins','Segoe UI',sans-serif;letter-spacing:.4px;
  text-transform:uppercase;white-space:nowrap;
}
#sortPanel button:hover{background:#eceff1}
#sortPanel button[aria-selected="true"]{background:var(--accent);color:#fff}
/* Shown at the top of a facet panel that needs a word of explanation. Same
   rule as the Collection page; no Wishlist facet uses it today. */
.facet-hint{
  font:700 10px 'Poppins','Segoe UI',sans-serif;color:#78909c;
  letter-spacing:.2px;line-height:1.45;padding:0 2px 7px;
}
/* sliders */
.slider-group{margin:11px 2px 3px;text-align:center}
.slider-group .sl-title{
  font:700 13px 'Poppins',sans-serif;letter-spacing:1.6px;text-transform:uppercase;
  color:#eceff1;margin-bottom:2px;
}
.range-wrap{position:relative;height:22px}
.range-wrap .rail{
  position:absolute;top:9px;left:0;right:0;height:3px;border-radius:2px;background:var(--track);
}
.range-wrap .fill{

}
.range-wrap input[type=range]::-moz-range-thumb{

  background:#fff;border:none;cursor:pointer;
}
.sl-vals{display:flex;justify-content:space-between;margin-top:2px}
.sl-vals input{
  background:transparent;border:none;border-bottom:1px solid #eceff1;
  color:#eceff1;font:700 13px 'Poppins',sans-serif;text-align:center;
  width:56px;padding:1px 2px;outline:none;color-scheme:dark;cursor:text;
}
/* A slider that has been pulled off its ends is narrowing the wall, and the two
   numbers underneath otherwise read as "the range of the data", not as "a
   filter you set". So an adjusted slider goes blue: title, fill, both thumbs
   and both value fields -- the Collection page's rule, toggled by the same
   test the filter itself uses (see paint() in buildSliders).
   --accent-bright rather than --accent: #007BC4 as a 3px line on the #4a565e
   rail reads as "slightly different track" rather than as blue. */
.slider-group.active .sl-title{color:var(--accent-bright)}
.slider-group.active .fill{background:var(--accent-bright)}
.slider-group.active input[type=range]::-webkit-slider-thumb{background:var(--accent-bright)}
.slider-group.active input[type=range]::-moz-range-thumb{background:var(--accent-bright)}
.slider-group.active .sl-vals input{color:var(--accent-bright);
  border-bottom-color:var(--accent-bright)}
.sl-vals input:focus{border-bottom-color:#fff;background:rgba(255,255,255,.08)}
.sl-vals input.date{width:106px;font-size:12px}
.sl-vals input::-webkit-outer-spin-button,
.sl-vals input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sl-vals input[type=number]{-moz-appearance:textfield;appearance:textfield}

.card{
  position:relative;display:block;border-radius:6px;overflow:hidden;

/* ---------- PAGER -----------------------------------------------------------
   Phone sizing first. The bar was drawn at desktop scale everywhere, and 34px
   digits between two 132px arrows leave about 140px for the label, so
   "1 - 148 / 19020" wrapped onto a second line and the bar grew a chin.

   Then #pagerBottom: a second copy of the pager parked at the foot of the
   wall, revealed only once you have scrolled to the end of it -- the moment
   you actually want the next page. Its middle is the jump control, so the far
   end of a 19,000-title collection is one move away rather than a hundred-odd
   taps of an arrow, and the page count is on screen rather than guessed at.

   It is absolutely positioned inside #main (already position:relative) rather
   than fixed to the window, so it tracks the sidebar for free -- no
   left-offset maths, and collapsing the sidebar widens it on its own.
   -------------------------------------------------------------------------- */
/* Static: it lives inside #grid as the last item, spanning every column, so
   it simply scrolls into view after the last row of covers and never floats
   over them. The bottom-pager script keeps it parked at the end of the grid
   through every repaint. Outside the grid and on a single page it is hidden. */
#pagerBottom{display:none}
#grid > #pagerBottom{display:flex;grid-column:1 / -1;margin-top:6px}
body:not(.multiPage) #grid > #pagerBottom{display:none}
#grid{padding-bottom:4px}
/* The jump control. This was a <select>, which on a 19,000-title collection
   meant scrolling a 127-item menu to reach page 67 -- a list, not a jump. It
   is now the page number itself: click it and it turns into a field you type
   into. The count stays beside the field while you type, so you can still see
   what you are aiming at. */
#pgJumpWrap{flex:1;min-width:0;display:flex;align-items:center;justify-content:center}

// in functions/img.js AND the upstream actually answers. The old chain
// failed both tests on every single entry:

//   cdn.statically.io  -> 400, host not allowlisted (and 403 direct: Statically
//                         disabled its /img/ endpoint)
//   i0.wp.com          -> 400, host not allowlisted
//   wsrv.nl            -> 400, host not allowlisted (and 404 direct: vudu
//                         refuses wsrv's fetcher)
//   .../gadgets/proxy  -> allowlisted via googleusercontent.com, but 404 upstream
//

// leaving the text placeholder. The one URL the Image CDN will fetch is the
// direct Vudu one, which is what index.html discovers via its direct probe and
// why the movies page kept working. Direct goes first; Photon's shards stay as
// a real fallback (wp.com added to remote_images alongside this change).
const VUDU_PROXIES = [
  u => u,                                                        // direct: the allowlisted route
  u => 'https://i0.wp.com/' + stripScheme(u) + '?w=400',         // Photon
  u => 'https://i1.wp.com/' + stripScheme(u) + '?w=400',         // Photon, 2nd shard

  const chain = isVudu(orig)

function firstNonEmpty(promises){

function parseCsvText(text){
  const rows=[]; let row=[], cell='', inQ=false;

    const ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else inQ=false; }
      else cell+=ch;
    }else{
      if(ch==='"') inQ=true;
      else if(ch===','){ row.push(cell); cell=''; }
      else if(ch==='\n'||ch==='\r'){
        if(ch==='\r'&&text[i+1]==='\n') i++;

function countFacets(rows,list){
  list.forEach(f=>{

      vals.forEach(v=>counts.set(v,(counts.get(v)||0)+1));

    // facet with a natural order of its own (Price runs cheapest to dearest,
    // then UNAVAILABLE), which keeps it.

      keepScroll=true;
      renderChips(); applyFilters();

    el.querySelector('.facet-clear').addEventListener('click',()=>{
      selected[f.key].clear(); if(search) search.value='';
      renderChips(); applyFilters();
    });
  });
  facetsReady=true;
  document.addEventListener('click',e=>{
    if(!e.target.closest('.facet')) document.querySelectorAll('.facet.open').forEach(x=>x.classList.remove('open'));
  });
}
function updateBadge(el,key){

/* buildFacets() renders the whole sidebar and would close whatever panel is
   open, so a chip's ✕ updates only the one facet it touched. */
function syncFacetUI(key){

  if(!el) return;

/* Every pick, from every facet, gets a chip above the wall -- the Collection

   other trace of a pick is a small count badge on a collapsed row, and with
   the sidebar itself collapsed there is not even that. Each chip carries its
   facet's name, dimmed, so "Drama" (Genre) and "R" (Rating) are told apart
   at a glance. */
function renderChips(){
  const row=$('#chipRow');
  row.innerHTML='';
  const add=(facet,name)=>{
    const chip=document.createElement('div');
    chip.className='chip';
    chip.innerHTML=`<span class="k">${esc(facet.chip||facet.label)}</span>`
      +`<span class="v">${esc(name)}</span>`;
    const x=document.createElement('button');
    x.type='button';
    x.title=`Clear ${facet.label}: ${name}`;
    x.textContent='✕';
    x.addEventListener('click',()=>{

    });

/* ---------- SLIDERS ----------
   Ported from the Collection page's buildSliders(). Three things changed here:
   * The typed-value boxes carried max="${s.step}" -- i.e. max="1" -- so the
     browser flagged every typed year or runtime as out of range. They now get
     the real min/max/step.
   * A rebuild (the background refresh, the confirm pass) keeps a range the
     visitor set instead of snapping every slider back to its ends while the
     grid underneath was still filtered by it.
   * An adjusted slider turns blue (.slider-group.active), using the same test
     the filter uses, so the colour can never disagree with the grid.
   Date sliders count DAY INDICES rather than milliseconds, so a 23- or 25-hour
   DST day cannot leave a handle an hour short of its bound. No wishlist slider
   is a date today; the path is kept so one can be added the same way as on
   the Collection page. */
function minMax(list,key){
  let mn=Infinity, mx=-Infinity, any=false;
  for(const m of list){ const v=m[key]; if(v==null) continue; any=true; if(v<mn)mn=v; if(v>mx)mx=v; }
  return any?{mn,mx}:null;
}
function buildSliders(){
  const host=$('#sliders'); host.innerHTML='';
  SLIDERS.forEach(s=>{
    const isDate=s.type==='date';
    // Bounds start from the configured ones every build, widened to the data,
    // so a rebuild cannot ratchet them outward on its own.
    if(s.min0==null){ s.min0=s.min; s.max0=s.max; }
    const mm=minMax(movies,s.key);
    if(isDate){
      const now=new Date();
      const todayLocal=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
      s.min=mm?mm.mn:new Date(now.getFullYear(),now.getMonth(),now.getDate()-365).getTime();
      s.max=Math.max(mm?mm.mx:todayLocal, todayLocal);
      s.step=86400000;
    } else {
      s.min=s.min0; s.max=s.max0;
      if(mm){ s.min=Math.floor(Math.min(s.min,mm.mn)); s.max=Math.ceil(Math.max(s.max,mm.mx)); }
    }
    const keep = s._active && rangeState[s.key] ? rangeState[s.key] : null;
    rangeState[s.key]={lo:s.min,hi:s.max};
    const baseD=new Date(s.min);
    const dateFromIdx=i=>new Date(baseD.getFullYear(),baseD.getMonth(),baseD.getDate()+i).getTime();
    const idxFromTime=t=>{
      let i=Math.round((t-s.min)/86400000);
      while(dateFromIdx(i)>t) i--;
      while(dateFromIdx(i+1)<=t) i++;
      return i;
    };
    const toVal  = isDate ? dateFromIdx : (u=>u);
    const toUnit = isDate ? idxFromTime : (v=>v);
    const uStep = isDate ? 1 : s.step;
    const uMin  = isDate ? 0 : s.min;
    const uMax  = isDate ? idxFromTime(s.max) : s.max;
    const uSpan = (uMax-uMin)||1;   // one value in the whole column: no divide by 0
    // value <-> text (dates shown/entered as YYYY-MM-DD, local time)
    const pad=n=>String(n).padStart(2,'0');
    const toStr=v=>{ if(!isDate) return String(v);
      const d=new Date(v); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
    const fromStr=str=>{
      if(isDate){
        const p=String(str).split('-').map(Number);
        if(p.length!==3||p.some(isNaN)) return null;
        return new Date(p[0],p[1]-1,p[2]).getTime();
      }
      const n=parseFloat(str); return isNaN(n)?null:n;
    };
    const el=document.createElement('div');
    el.className='slider-group';
    el.innerHTML=`
      <div class="sl-title">${esc(s.label)}</div>
      <div class="range-wrap">
        <div class="rail"></div><div class="fill"></div>
        <input type="range" class="lo" min="${uMin}" max="${uMax}" step="${uStep}" value="${uMin}">
        <input type="range" class="hi" min="${uMin}" max="${uMax}" step="${uStep}" value="${uMax}">
      </div>
      <div class="sl-vals">
        <input class="v-lo ${isDate?'date':'number'}"
               ${isDate?'':`min="${s.min}" max="${s.max}" step="${s.step}"`} title="Type a value">
        <input class="v-hi ${isDate?'date':'number'}"
               ${isDate?'':`min="${s.min}" max="${s.max}" step="${s.step}"`} title="Type a value">
      </div>`;
    host.appendChild(el);
    const lo=el.querySelector('.lo'), hi=el.querySelector('.hi'),
          fill=el.querySelector('.fill'), vlo=el.querySelector('.v-lo'), vhi=el.querySelector('.v-hi');
    const paint=()=>{
      const a=+lo.value,b=+hi.value;
      let uLo=Math.min(a,b), uHi=Math.max(a,b);
      // A handle that cannot move any further out is sitting ON the bound.
      if(uLo-uMin < uStep) uLo=uMin;
      if(uMax-uHi < uStep) uHi=uMax;
      const mn=toVal(uLo), mx=toVal(uHi);
      rangeState[s.key]={lo:mn,hi:mx};
      const pct=u=>(u-uMin)/uSpan*100;
      fill.style.left=pct(uLo)+'%'; fill.style.width=(pct(uHi)-pct(uLo))+'%';
      vlo.value=toStr(mn); vhi.value=toStr(mx);
      // The same test rowMatches() uses to decide whether this slider filters
      // anything: if it is blue, rows are being dropped, and vice versa.
      s._active = uLo>uMin || uHi<uMax;
      el.classList.toggle('active', s._active);
    };
    if(keep){
      const c=v=>Math.max(s.min,Math.min(s.max,v));
      lo.value=toUnit(c(keep.lo)); hi.value=toUnit(c(keep.hi));
    }
    paint();
    let t;
    const onInput=()=>{ paint(); clearTimeout(t); t=setTimeout(applyFilters,150); };
    lo.addEventListener('input',onInput); hi.addEventListener('input',onInput);
    // typed values: clamp to range and move the matching handle
    const manual=(inputEl,rangeEl)=>{
      let v=fromStr(inputEl.value);
      if(v==null){ paint(); return; }        // bad entry: snap back
      v=Math.max(s.min,Math.min(s.max,v));
      rangeEl.value=toUnit(v);
      paint(); applyFilters();
    };
    vlo.addEventListener('change',()=>manual(vlo,lo));
    vhi.addEventListener('change',()=>manual(vhi,hi));
    vlo.addEventListener('keydown',e=>{ if(e.key==='Enter') vlo.blur(); });
    vhi.addEventListener('keydown',e=>{ if(e.key==='Enter') vhi.blur(); });
    s._reset=()=>{ lo.value=uMin; hi.value=uMax; paint(); };
  });
}
/* ---------- FILTER + SORT + RENDER ---------- */
// `skipKey` leaves one facet out, which is how a facet with picks of its own
// gets its option list counted (see refreshFacetValues).
function rowMatches(m,q,skipKey){
  if(q && !m.search.includes(q)) return false;
  for(const f of FACETS){
    if(f.key===skipKey) continue;
    const sel=selected[f.key]; if(!sel || !sel.size) continue;
    const vals=f.csv?m[f.key]:[m[f.key]];
    if(!vals.some(v=>sel.has(v))) return false;
  }
  for(const s of SLIDERS){
    const r=rangeState[s.key];
    if(!r) continue;                              // sliders not built yet
    if(r.lo>s.min || r.hi<s.max){
      const v=m[s.key];
      const hi = s.type==='date' ? r.hi+86399999 : r.hi;  // include the whole end day
      if(v==null || v<r.lo || v>hi) return false;
    }
  }
  return true;
}
/* keepPage: stay on the current page (a background repaint) instead of going
   back to page 1 (a filter the visitor just changed).
   soft: only touch cards that actually changed -- see renderPage. */
function applyFilters(keepPage, soft){
  const q=$('#searchBox').value.trim().toLowerCase();
  filtered=movies.filter(m=>rowMatches(m,q,null));
  refreshFacetsNow();
  sortNow();
  if(!keepPage) page=0;
  renderPage(soft?{ifChanged:true}:null);
}
/* Same semantics as the Collection page's sortNow(): blanks always last
   whichever way the sort runs, and ties broken A -> Z by title with the
   shared collator, so equal years or prices come out in a stable, readable
   order instead of whatever order the sheet happened to hold them in.
   sortTitle is the title with a leading The/A/An dropped, so "The Matrix"
   files under M. */
function sortNow(){
  const [key,dir]=$('#sortSel').value.split('|');
  const mul=dir==='desc'?-1:1;
  const alphaTitle=(a,b)=>collator.compare(a.sortTitle||a.title||'', b.sortTitle||b.title||'');
  filtered.sort((a,b)=>{
    if(key==='sortTitle') return mul*alphaTitle(a,b) || (a.sheetRow-b.sheetRow);
    const x=a[key], y=b[key];
    if(x==null&&y==null) return alphaTitle(a,b);
    if(x==null) return 1;   // blanks last either direction
    if(y==null) return -1;
    if(x===y) return alphaTitle(a,b);
    return mul*(x-y);
  });
}
/* Everything a card shows, as one string. Two cards with the same key render
   byte-identical markup, so an existing card element can be reused as is. */
function cardKey(m){
  return m.sheetRow+'\u0001'+m.title+'\u0001'+(m.year??'')+'\u0001'+m.img+'\u0001'+m.link
    +'\u0001'+m.color+'\u0001'+(m.buy??'')+'\u0001'+m.buyQuality;
}
function cardHtml(m,i){
  // First ~2 rows load eagerly so the fold fills at once; the rest lazy-load
  // as you scroll. decoding=async keeps poster decode off the main thread, and
  // the width/height give the browser the aspect ratio before a byte arrives.
  return `<a class="card" href="${esc(m.link)||'#'}" target="_blank" rel="noopener"
       data-row="${m.sheetRow}" title="${esc(m.title)}${m.year?' ('+m.year+')':''}"
       style="background:${esc(m.color)||'var(--bg-soft)'}">
      ${m.img?`<img loading="${i<20?'eager':'lazy'}" ${i<10?'fetchpriority="high"':''} decoding="async"
        width="250" height="375" src="${esc(firstSrc(m.img))}" data-src="${esc(m.img)}"
        alt="${esc(m.title)}">`
        :`<div class="ph">${esc(m.title)}</div>`}
      <span class="edit-tag" title="Edit details">&#9998;</span>
      ${m.buy!=null?`<span class="price-tag">$${m.buy}${m.buyQuality?' '+m.buyQuality:''}</span>`:''}
    </a>`;
}
/* Fingerprint of what is in the grid, plus the card elements behind it.
   A soft render ({ifChanged:true}) -- the background refresh and the confirm
   pass -- does nothing at all when the page would come out identical, and
   when it would not, it keeps every card element whose key is unchanged and
   only builds the ones that differ. Rewriting innerHTML restarts every <img>,
   so a one-price change used to re-request all 150 posters on the page. */
let renderedKey=null, cardEls=new Map();
const cardTpl=document.createElement('template');
function renderPage(opts){
  const total=filtered.length;
  const pages=Math.max(1,Math.ceil(total/PER_PAGE));
  page=Math.min(page,pages-1);
  const start=page*PER_PAGE, end=Math.min(start+PER_PAGE,total);
  const label= total? `${start+1} - ${end} / ${total}` : '0 results';
  $('#pgLabel').textContent=label;
  const atFirst=page===0, atLast=page>=pages-1;
  $('#prevPg').disabled=atFirst;  $('#nextPg').disabled=atLast;
  if(window.syncBottomPager) syncBottomPager(page,pages);
  const grid=$('#grid');
  const slice=filtered.slice(start,end);
  const keys=slice.map(cardKey);
  const k=page+'|'+keys.join('\u0002');
  const soft=!!(opts && opts.ifChanged);
  if(soft && k===renderedKey) return;   // identical -> leave the loading images alone
  renderedKey=k;
  const next=new Map();
  if(soft && cardEls.size){
    const keepScroll=grid.scrollTop;
    const nodes=slice.map((m,i)=>{
      let el=cardEls.get(keys[i]);
      if(!el){ cardTpl.innerHTML=cardHtml(m,i); el=cardTpl.content.firstElementChild; }
      next.set(keys[i],el);
      return el;
    });
    grid.replaceChildren(...nodes);
    grid.scrollTop=keepScroll;
  }else{
    grid.innerHTML=slice.map(cardHtml).join('');
    const els=grid.children;
    for(let i=0;i<els.length;i++) next.set(keys[i],els[i]);
  }
  cardEls=next;
}
function toTop(){
  $('#grid').scrollTop=0;                              // reset the wall's inner scroll
  // scrollIntoView also reaches the surrounding Google Sites page,
  // bringing the top pager bar back into view after a page flip
  $('#pagerTop').scrollIntoView({behavior:'smooth', block:'start'});
}
function pinDocTop(){
  if(document.scrollingElement && document.scrollingElement.scrollTop) document.scrollingElement.scrollTop=0;
  if(document.body.scrollTop) document.body.scrollTop=0;
}
// Anything else that nudges the document gets put straight back, so the top
// pager bar is always on screen.
window.addEventListener('scroll',pinDocTop,{passive:true});
function goPrev(){ if(page>0){ page--; renderPage(); toTop(); } }
function goNext(){ page++; renderPage(); toTop(); }
$('#prevPg').addEventListener('click',goPrev);
$('#nextPg').addEventListener('click',goNext);
/* ---- BOTTOM PAGER ----------------------------------------------------------
   A second set of controls parked at the foot of the wall, revealed only once
   #grid -- which is the scroll container on this page, not the window -- has
   been scrolled to its end.

   The middle of the bar is the jump control. It shows "Page 67 of 127"; click
   it and it becomes a field you type a page number into, because the <select>
   this replaced meant scrolling a 127-item menu to get anywhere, which is a
   list rather than a jump. Enter commits, Escape or clicking away cancels, and
   anything out of range is clamped rather than rejected.
   ------------------------------------------------------------------------- */
(function(){
  const grid=document.getElementById('grid'),
        prevB=document.getElementById('prevPgB'), nextB=document.getElementById('nextPgB'),
        label=document.getElementById('pgJump'), form=document.getElementById('pgJumpForm'),
        field=document.getElementById('pgJumpIn'), ofTxt=document.getElementById('pgJumpOf');
  let cur=0, pageCount=1;
  // Park the bottom pager as the last item of the wall and keep it there:
  // every repaint rewrites the grid's children, which drops it off the end.
  const pagerB=document.getElementById('pagerBottom');
  const parkPager=function(){ if(grid.lastElementChild!==pagerB) grid.appendChild(pagerB); };
  new MutationObserver(parkPager).observe(grid,{childList:true});
  parkPager();
  function openJump(){
    field.value=String(cur+1);
    label.hidden=true; form.hidden=false;
    field.focus(); field.select();
  }
  function closeJump(){ if(!form.hidden){ form.hidden=true; label.hidden=false; } }
  // The arrows run the same goPrev/goNext as the top bar, so a flip from the
  // foot of the wall lands exactly where a flip from the head does.
  prevB.addEventListener('click',goPrev);
  nextB.addEventListener('click',goNext);
  label.addEventListener('click',openJump);
  form.addEventListener('submit',function(e){
    e.preventDefault();
    const n=parseInt(field.value,10);
    closeJump();
    if(!isFinite(n)) return;                       // empty or junk -- just close
    const want=Math.min(pageCount,Math.max(1,n))-1;
    if(want===cur) return;
    page=want; renderPage(); toTop();
  });
  field.addEventListener('keydown',function(e){ if(e.key==='Escape'){ e.preventDefault(); closeJump(); } });
  field.addEventListener('blur',closeJump);        // clicking away cancels
  /* Within 24px of the end counts as the end: the scroll metrics are fractional
     on a high-DPI phone, so waiting for exact equality means a fling that stops
     half a pixel short never shows the bar.
     Measured straight out of the scroll handler rather than inside a rAF --
     it is one read, and the class is only written when the answer changes
     (twice per trip down the wall), so there is no layout thrash to batch. */
  let shown=null;
  function atEnd(){
    const end = grid.scrollHeight-grid.scrollTop-grid.clientHeight<=24;
    if(end!==shown){ shown=end; document.body.classList.toggle('atEnd',end); }
  }
  grid.addEventListener('scroll',atEnd,{passive:true});
  window.addEventListener('resize',atEnd);

  window.syncBottomPager=function(c,pages){
    cur=c; pageCount=pages;
    label.textContent='Page '+(c+1)+' of '+pages;
    ofTxt.textContent='of '+pages;
    prevB.disabled=c===0; nextB.disabled=c>=pages-1;
    document.body.classList.toggle('multiPage',pages>1);
    closeJump();      // a flip from anywhere else drops you out of the field
    /* renderPage() has not written the new slice yet when this runs, and
       toTop() moves the scroll after it, so re-measure once both are done.
       A timeout rather than rAF: this has to settle even when the tab is
       throttled, and reading scrollHeight forces the layout it needs. */
    setTimeout(function(){ shown=null; atEnd(); },0);
  };
  atEnd();
})();
let st; $('#searchBox').addEventListener('input',()=>{clearTimeout(st);st=setTimeout(applyFilters,220);});

/* The visible sort control, copied from the Collection page. #sortSel stays

   button only, where the label has ~180px and would otherwise ellipse off
   the one word that tells the pair apart. */
(function(){
  const wrap=$('#sortWrap'), sel=$('#sortSel'),
        btn=$('#sortBtn'), panel=$('#sortPanel'), label=$('#sortLabel');
  panel.innerHTML=[].map.call(sel.options,o=>
    `<button type="button" role="option" data-v="${esc(o.value)}"`+
    ` aria-selected="${o.value===sel.value}">${esc(o.textContent)}</button>`).join('');
  const sync=()=>{

    e.stopPropagation();

/* Wrapped, as on the Collection page. Unguarded, a browser with site data

/* Save to the Apps Script. Tries a normal POST first; if the Google Sites
   sandbox blocks it ("Failed to fetch"), falls back to a JSONP request,
   which loads as a script tag and cannot be blocked by CORS. */
function jsonpSave(payload){
  return new Promise((resolve,reject)=>{
    const cb='__save_cb_'+Math.random().toString(36).slice(2);
    const timer=setTimeout(()=>{ cleanup(); reject(new Error('save timed out')); },30000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; tag.remove(); }
    window[cb]=d=>{ cleanup(); resolve(d); };
    const tag=document.createElement('script');
    tag.src=APPS_SCRIPT_URL+'?callback='+cb+'&payload='+encodeURIComponent(JSON.stringify(payload));
    tag.onerror=()=>{ cleanup(); reject(new Error('request blocked — check the Apps Script is deployed with access set to "Anyone"')); };
    document.head.appendChild(tag);
  });
}
async function saveToSheet(payload){
  try{
    const res=await fetch(APPS_SCRIPT_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)
    });
    return await res.json();
  }catch(e){
    return await jsonpSave(payload);   // sandbox blocked the POST — go around it
  }
}

}
function finishToken(ok){
  const v = ok ? $('#tokenInput').value.trim() : '';
  $('#tokenWrap').classList.remove('open');
  if(v){ sessionToken=v; try{ sessionStorage.setItem('wl_token',v); }catch(e){} }
  const r=tokenResolve; tokenResolve=null; if(r) r(v);
}
$('#tokenOk').addEventListener('click',()=>finishToken(true));
$('#tokenCancel').addEventListener('click',()=>finishToken(false));
$('#tokenInput').addEventListener('keydown',e=>{ if(e.key==='Enter') finishToken(true); if(e.key==='Escape') finishToken(false); });
$('#tokenWrap').addEventListener('click',e=>{ if(e.target.id==='tokenWrap') finishToken(false); });
async function getToken(){
  if(sessionToken) return sessionToken;
  return await askToken();
}
function dropToken(){ sessionToken=''; try{ sessionStorage.removeItem('wl_token'); }catch(e){} }
// Google Sites can swallow bubbling clicks inside embeds — bind at the
// document capture phase so the toggle always sees them. Bind ONCE — adding a
// listener on the button itself too fires this handler twice per click, which
// toggles edit mode on and straight back off whenever a token is cached.
document.addEventListener('click',e=>{
  if(e.target.closest && e.target.closest('#editToggle')) handleEditToggle();
}, true);
async function handleEditToggle(){
  if(!editMode){
    if(!APPS_SCRIPT_URL){
      toast('Paste your Apps Script URL into APPS_SCRIPT_URL in the embed code first',true);
      return;
    }
    const t=await getToken();
    if(!t){ toast('Edit mode needs a token',true); return; }
  }
  editMode=!editMode; document.body.classList.toggle('editing',editMode);
  $('#editToggle').innerHTML = editMode ? '&#128274; Lock editing' : '&#9998; Unlock editing';
  toast(editMode?'Edit mode on — \u270E edits an entry':'Edit mode off');
}
/* ---------- price refresh (runs server-side via Apps Script) ---------- */
// Prices are looked up on the Apps Script side (UrlFetchApp), not in the
// browser — Vudu's API blocks direct cross-origin browser requests (CORS),
// so calling it from here would silently fail every time.
$('#priceBtn').addEventListener('click',async()=>{
  if(!APPS_SCRIPT_URL){ toast('Set up the Apps Script URL first',true); return; }
  const token=await getToken();
  if(!token){ toast('A token is required to refresh prices',true); return; }
  const btn=$('#priceBtn'); btn.disabled=true;
  const targets=movies.filter(m=>m.contentId);
  const CHUNK=8; // keep each request/JSONP URL a reasonable size
  let done=0, saved=0;
  try{
    for(let i=0;i<targets.length;i+=CHUNK){
      const chunk=targets.slice(i,i+CHUNK);
      const contentIds=chunk.map(m=>m.contentId);
      const data=await saveToSheet({token,action:'refreshPrices',contentIds});
      if(!data.ok) throw new Error(data.error||'refresh failed');
      chunk.forEach(m=>{
        const p=data.prices ? data.prices[m.contentId] : undefined;
        const q=data.qualities ? data.qualities[m.contentId] : undefined;
        m.buy=(p===''||p==null)?null:p;
        m.buyQuality=q||'';
        m.priceBucket=priceBucket(m.buy);   // keep the Price facet in sync
      });
      saved+=(data.written||0);
      done+=chunk.length;
      btn.textContent='$ '+done+'/'+targets.length;
    }
    toast('Prices updated: '+saved+' of '+targets.length+' titles');
    buildFacetValues();   // refresh Price bucket counts
    applyFilters(true, true);  // re-evaluate in case a Price filter is active; stay on this page
    noteLocalEdit();      // the screen is now newer than the cached copy
  }catch(err){
    if(/token/i.test(err.message||'')) dropToken();   // bad token — re-prompt next click
    const hint=/unknown action/i.test(err.message)
      ? 'Your Apps Script is outdated — paste the newest version and redeploy (Deploy \u2192 Manage deployments \u2192 pencil \u2192 New version).'
      : err.message;
    toast('Price refresh failed: '+hint,true);
  }
  btn.disabled=false; btn.innerHTML='&#36; Refresh prices';
});
$('#grid').addEventListener('click',e=>{
  if(!editMode) return;
  const card=e.target.closest('.card'); if(!card) return;
  if(e.target.closest('.edit-tag')){
    e.preventDefault();
    openEditor(+card.dataset.row);
    return;
  }
  // any other click on the cover: let the link open the movie's page as usual
});
let toastTimer;
function toast(msg,isErr){
  const t=$('#toast');
  t.textContent=msg; t.className=isErr?'show err':'show';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ t.className=''; },2600);
}
function openEditor(sheetRow){
  const m=movies.find(x=>x.sheetRow===sheetRow); if(!m) return;
  currentEdit=m;
  $('#modalTitle').textContent='Edit: '+m.title;
  $('#modalMsg').textContent= APPS_SCRIPT_URL ? '' :
    'Saving is not set up yet — deploy the Apps Script and add its URL to the embed, or edit directly in the Sheet.';
  $('#modalMsg').className='msg';
  $('#saveBtn').disabled=!APPS_SCRIPT_URL;
  $('#sheetRowLink').href=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit#gid=${SHEET_GID}&range=A${sheetRow}`;
  const body=$('#modalBody');
  body.innerHTML=EDIT_FIELDS.map(f=>{
    const key=COLMAP[f.h];
    let v=m[key]; if(v==null) v='';
    return `<div class="field${f.full?' full':''}">
      <label>${esc(f.h)}</label>
      ${f.area?`<textarea data-h="${esc(f.h)}">${esc(v)}</textarea>`
              :`<input data-h="${esc(f.h)}" value="${esc(v)}">`}
    </div>`;
  }).join('');
  $('#modalWrap').classList.add('open');
}
function closeEditor(){ $('#modalWrap').classList.remove('open'); currentEdit=null; }
$('#closeModal').addEventListener('click',closeEditor);
$('#cancelBtn').addEventListener('click',closeEditor);
$('#modalWrap').addEventListener('click',e=>{ if(e.target.id==='modalWrap') closeEditor(); });
$('#saveBtn').addEventListener('click',async()=>{
  if(!currentEdit||!APPS_SCRIPT_URL) return;
  const token=await getToken();
  if(!token){ $('#modalMsg').textContent='A token is required to save changes.'; $('#modalMsg').className='msg err'; return; }
  const updates={};
  document.querySelectorAll('#modalBody [data-h]').forEach(el=>{ updates[el.dataset.h]=el.value; });
  const msg=$('#modalMsg'); msg.textContent='Saving…'; msg.className='msg';
  $('#saveBtn').disabled=true;
  try{
    const data=await saveToSheet({token,action:'update',sheetRow:currentEdit.sheetRow,
        key:{ContentID:currentEdit.contentId,Title:currentEdit.title},updates});
    if(!data.ok){
      if(/token/i.test(data.error||'')) dropToken();
      throw new Error(data.error||'Save failed');
    }
    // reflect changes locally without a full reload
    const m=currentEdit;
    for(const [h,v] of Object.entries(updates)){
      const key=COLMAP[h]; if(!key) continue;
      if(['year','runtime','myRating'].includes(key)){ const n=parseFloat(v); m[key]=isNaN(n)?null:n; }
      else if(key==='tomatoRaw'){ m.tomatoRaw=v; let n=parseFloat(String(v).replace('%',''));
        if(!isNaN(n) && n>0 && n<=1) n=Math.round(n*100);
        m.tomato=isNaN(n)?null:n; }
      else m[key]=v;
    }
    m.genre=splitCsv(m.genreRaw); m.lang=splitCsv(m.langRaw);
    m.sortTitle=String(m.title).replace(/^(the|a|an)\s+/i,'');
    m.contentId=String(m.contentId).trim();
    m.img=m.contentId?IMG_BASE+m.contentId+'-l':'';
    m.link=m.contentId?LINK_BASE+m.contentId:'';
    m.priceBucket=priceBucket(m.buy);   // in case Buy Price ever becomes editable
    m.search=[m.title,m.desc,m.year,m.genreRaw,m.studio,m.mpaa].join(' ').toLowerCase();
    buildFacetValues();
    noteLocalEdit();
    msg.textContent='Saved ✓'; msg.className='msg ok';
    setTimeout(()=>{ closeEditor(); applyFilters(true); },600);   // stay on this page
  }catch(err){
    msg.textContent='Could not save: '+err.message; msg.className='msg err';
  }finally{
    $('#saveBtn').disabled=false;
  }
});
/* ---------- SHOW / REPAINT ----------
   The single way data reaches the screen, for every source: cache, mirror
   seed, edge answer, confirm pass. It compares the new rows with what is on
   screen first and does NOTHING when they match -- which is the normal case
   for every answer after the first. When they differ it swaps the data in
   under the visitor rather than starting the page over: page number, facet
   picks, the open facet panel and its search text, slider ranges (rebuilt
   with keep, see buildSliders), the search box, sort and the wall's scroll
   position all survive, and cards that did not change keep their <img>
   (renderPage's soft path). Returns true when it repainted. */
let shownSig=null;
const busy=()=>$('#priceBtn').disabled;   // a price refresh is writing into `movies`
function show(list){
  const sig=signature(list);
  if(sig===shownSig) return false;
  if(busy()) return false;               // don't swap objects out from under it
  const first=!movies.length;
  movies=list; shownSig=sig;
  // An editor left open across a repaint keeps editing the same sheet row,
  // now through the new object, so a save still reflects on screen.
  if(currentEdit) currentEdit=movies.find(m=>m.sheetRow===currentEdit.sheetRow)||currentEdit;
  if(first) syncPerPage();
  buildFacetValues();
  // The facet DOM is built once. Rebuilding it would close the open panel and
  // wipe its search box; the counts and the open list are redone in place by
  // applyFilters -> refreshFacetsNow instead.
  if(!facetsReady) buildFacets();
  buildSliders();
  applyFilters(!first, !first);
  renderChips();
  $('#sidebar').classList.remove('pending');
  return true;
}
/* An edit or a price refresh just changed `movies` in place: the screen is now
   the newest copy there is, so it becomes both the repaint baseline and the
   cached copy. Without the cache write, the next visit would paint the
   pre-edit wishlist from IndexedDB until the edge answered. */
function noteLocalEdit(){
  shownSig=signature(movies);
  idle(()=>cacheSet(movies));
}
/* ---------- INIT ----------
   Staged, so that something useful is on screen at every point:
     0 ms    static shell + top bar + placeholder tiles (needs no JS)
     ~30 ms  this browser's cached wishlist, if it has one -> full grid
     ~50 ms  the edge's copy of the live sheet -> repaint only if different
             (first visit: raced against the deploy-time mirror, first
             usable answer paints)
     idle    if the edge's copy was old, a silent confirm pass against Google
             -> repaint only if different
   The old version had one stage: walk the sources one after another behind a
   full-page cover and paint nothing until Google answered. */
(async function init(){
  const t0=performance.now();
  const ms=()=>Math.round(performance.now()-t0)+'ms';
  let painted=false, from='';
  const paint=(list,src)=>{
    const changed=show(list);
    if(!painted){
      painted=true; from=src;
      setStatus(null);
      console.info(`[wishlist] first paint from ${src} at ${ms()} (${list.length} titles)`);
    }else if(changed){
      console.info(`[wishlist] repainted from ${src} at ${ms()}`);
    }
    return changed;
  };
  syncPerPage();
  // On the wire before IndexedDB is even opened.
  const liveP=loadLive('fast');
  liveP.catch(()=>{});                   // handled below; keeps the console clean
  // 0. Last visit's copy.
  const cached=await cacheGet();
  if(cached){ paint(cached.d,'cache'); setBar(0.6); }
  // 1. First visit: race the live edge answer against the mirror seed.
  let mirrorP=null;
  if(!painted){
    setStatus('Loading wishlist&hellip;');
    mirrorP=loadMirror();
    mirrorP.catch(()=>{});
    const seed=await firstNonEmpty([liveP.then(r=>r.rows), mirrorP]);
    if(seed) paint(seed, 'race');
  }
  // 2. The live sheet, through the edge.
  let meta=null;
  try{
    const live=await liveP;
    meta=live.meta;
    const asOf=Date.now()-(meta.age||0)*1000;
    /* Stale-edge guard. The edge's fast copy can be OLDER than what this
       browser already has -- the last visit's confirm pass may have fetched a
       newer one from Google than the edge has caught up to. Painting it would
       briefly roll the wishlist back, and the confirm pass would then roll it
       forward again: two visible flips for no reason. So an old edge copy
       that predates the cache is not painted; the confirm pass decides. */
    if(cached && asOf < (cached.asOf||cached.t) && window.__edge && window.__edge.isOld(meta)){
      console.info('[wishlist] edge copy predates this browser\'s cache; keeping the cache until the confirm pass');
    }else{
      paint(live.rows, 'edge '+meta.how+' age '+meta.age+'s');
      idle(()=>cacheSet(live.rows, asOf));
    }
  }catch(err){
    if(!painted){
      // 3. Nothing on screen and no live sheet: the old fallback chain.
      try{
        paint(await loadFallbacks(mirrorP, ['csv: '+err.message]), 'fallback');
      }catch(e2){
        barDone();
        setStatus('Could not load the sheet.<br><small>'
          +'1. Check the spreadsheet is shared as &ldquo;Anyone with the link &ndash; Viewer&rdquo;.<br>'
          +'2. If it still fails, in the Sheet use File &rarr; Share &rarr; Publish to web &rarr; your wishlist tab &rarr; CSV,<br>'
          +'&nbsp;&nbsp;&nbsp;&nbsp;then paste that link into PUBLISHED_CSV_URL at the top of this embed code.<br>'
          +'<span style="color:#607d8b">('+esc(e2.message)+')</span></small>', false, true);
        return;
      }
    }else{
      // Something is already on screen: keep it, say so quietly.
      console.warn('[wishlist] live sheet unavailable, keeping what is on screen ('+from+'):', err && err.message);
      toast('Couldn’t reach the sheet — showing the last loaded wishlist');
    }
  }
  barDone(); setStatus(null);
  console.info(`[wishlist] ${movies.length} titles settled at ${ms()} (first paint: ${from})`);
  confirmLater(meta);
})();
/* The confirm pass. `meta` is what the edge said about the copy this visit
   used; when it was fresh enough (or came straight from Google) there is
   nothing to do. Otherwise, once the page is idle, ask again insisting on a
   copy no older than __edge.FRESH_S, and repaint only if THAT differs from
   the grid. No status chip, no bar, no toast -- the visitor already has a
   working page, and the only visible sign is the grid quietly catching up. */
let confirming=false;
function confirmLater(meta){
  if(confirming || !window.__edge || !window.__edge.isOld(meta)) return;
  confirming=true;
  idle(async()=>{
    try{
      const r=await loadLive('confirm');
      if(busy()){ console.info('[wishlist] confirm pass: skipped, a price refresh is running'); return; }
      const changed=show(r.rows);
      console.info('[wishlist] confirm pass: '+(changed?'CHANGED, caught up':'unchanged'));
      cacheSet(r.rows, Date.now()-(r.meta.age||0)*1000);
    }catch(e){
      console.warn('[wishlist] confirm pass failed (keeping what is on screen):', e && e.message);
    }
  });
}
</script>
